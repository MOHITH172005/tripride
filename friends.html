 const uid=u.uid;let tab="Requests",myId="Loading...",following=new Set(),near=[],pos=null,nmsg="",found=null,smsg="",busy=false;
 const meRef=doc(db,"users",uid);
 m.innerHTML=`<div class="card row" style="background:linear-gradient(135deg,#6D28D9,#9333EA);color:#fff;border:0"><span class="ms" style="font-size:30px">badge</span><div class="grow"><small style="color:#ffffffb3;letter-spacing:.8px;font-weight:800">MY TRIPRIDE ID</small><b id="mid" style="display:block;font-size:23px;letter-spacing:1.2px">…</b><small style="color:#ffffffb3">Share this ID to connect with friends</small></div><button id="cp" style="color:#fff"><span class="ms">content_copy</span></button></div>
 <div class="inp"><input id="sq" placeholder="Search TRIPRIDE ID" style="text-transform:uppercase"><button class="btn sm" id="sb"><span class="ms" style="vertical-align:middle">search</span></button></div><div id="sm" class="mut" style="color:#B91C1C;margin-bottom:8px"></div><div id="sr"></div>
 <div class="tabs" id="tb"></div><div id="tc"></div>`;
 const $$=s=>m.querySelector(s);
 const tile=(d,{act,text,dist,src,id})=>{const e=h(`<div class="card row" style="padding:12px">${avatar(ft(d.profilePhoto,d.fromPhoto),ft(d.name,d.fullName,d.displayName,d.fromName,"Traveler"),27)}<div class="grow"><b>${esc(ft(d.name,d.fullName,d.displayName,d.fromName,"Traveler"))}</b><br><small>${esc(id||rid(d))}</small>${dist!=null?`<br><small style="color:#7C3AED;font-weight:700">📍 ${dist.toFixed(dist<10?1:0)} km away</small>${src?`<br><small>${esc(src)}</small>`:""}`:""}</div>${act?`<button class="btn sm">${text}</button>`:""}</div>`);if(act)e.querySelector("button").onclick=act;return e};
 const reload=async()=>{try{following=new Set((await getDocs(collection(db,"users",uid,"following"))).docs.map(d=>d.id))}catch{}render()};
 const send=async d=>{const rc=d.uid;if(following.has(rc))return toast("Already following this user.");try{const mine=(await getDoc(meRef)).data()||{},r=doc(db,"users",rc,"followRequests",uid),ex=await getDoc(r);if(ex.exists()&&ex.data().status==="pending")return toast("Follow request already sent.");await setDoc(r,{fromUid:uid,fromName:mine.name||"Traveler",fromPhoto:mine.profilePhoto||"",fromTriprideId:rid(mine),toUid:rc,status:"pending",createdAt:serverTimestamp()},{merge:true});toast("Follow request sent.")}catch(e){console.error(e);toast("Unable to send request.")}};
 const accept=async rd=>{const d=rd.data(),from=ft(d.fromUid,rd.id);try{const o=(await getDoc(doc(db,"users",from))).data()||{},me=(await getDoc(meRef)).data()||{},b=writeBatch(db);
  b.set(doc(db,"users",uid,"followers",from),{uid:from,name:o.name||d.fromName||"Traveler",phone:o.phone||"",profilePhoto:o.profilePhoto||d.fromPhoto||"",triprideId:rid(o),createdAt:serverTimestamp()});
  b.set(doc(db,"users",from,"following",uid),{uid,name:me.name||"Traveler",phone:me.phone||"",profilePhoto:me.profilePhoto||"",triprideId:rid(me),createdAt:serverTimestamp()});
  b.update(rd.ref,{status:"accepted",acceptedAt:serverTimestamp()});await b.commit();toast("Follow request accepted.");await reload()}catch(e){console.error(e);toast("Unable to accept request.")}};
 const unfollow=async o=>{try{const b=writeBatch(db);b.delete(doc(db,"users",uid,"following",o));b.delete(doc(db,"users",o,"followers",uid));await b.commit();toast("Unfollowed.");await reload()}catch{toast("Unable to unfollow.")}};
 const removeF=async o=>{try{await deleteDoc(doc(db,"users",uid,"followers",o));await deleteDoc(doc(db,"users",o,"following",uid));toast("Follower removed.");render()}catch{toast("Unable to remove follower.")}};
 const nearby=async()=>{nmsg="";render();if(!navigator.geolocation){nmsg="Location not supported.";return render()}
  navigator.geolocation.getCurrentPosition(async p=>{pos=p.coords;try{await setDoc(meRef,{currentLatitude:pos.latitude,currentLongitude:pos.longitude,currentLocationUpdatedAt:serverTimestamp()},{merge:true});
   const me=(await getDoc(meRef)).data()||{},rl=x=>[num(x.registeredLatitude??x.cityLatitude??x.locationLatitude??x.latitude),num(x.registeredLongitude??x.cityLongitude??x.locationLongitude??x.longitude)],[ra,rb]=rl(me),out=[];
   for(const d of (await getDocs(collection(db,"users"))).docs){if(d.id===uid)continue;const x=d.data(),[oa,ob]=rl(x),ca=num(x.currentLatitude),cb=num(x.currentLongitude);
    const rd=ra!=null&&rb!=null&&oa!=null&&ob!=null?km(ra,rb,oa,ob):null,cd=ca!=null&&cb!=null?km(pos.latitude,pos.longitude,ca,cb):oa!=null&&ob!=null?km(pos.latitude,pos.longitude,oa,ob):null;
    const rm=rd!=null&&rd<=200,cm=cd!=null&&cd<=200;if(!rm&&!cm)continue;
    out.push({uid:d.id,...x,_d:Math.min(...[rm?rd:1e9,cm?cd:1e9]),_s:[rm?`Registered ${rd.toFixed(0)} km`:"",cm?`Current ${cd.toFixed(0)} km`:""].filter(Boolean).join(" • ")})}
   near=out.sort((a,b)=>a._d-b._d)}catch(e){console.error(e);nmsg="Unable to load nearby users."}render()},()=>{nmsg="Location permission is required for nearby suggestions.";render()},{enableHighAccuracy:true,timeout:15000})};
 const list=async(sub,mk,emptyTxt,ord)=>{const c=$$("#tc");c.innerHTML='<div class="empty"><div class="spin" style="margin:auto"></div></div>';try{const q=ord?query(collection(db,"users",uid,sub),orderBy("createdAt","desc")):query(collection(db,"users",uid,sub),where("status","==","pending"));const s=(await getDocs(q)).docs;c.textContent="";if(!s.length)return c.innerHTML=`<div class="empty"><p>${emptyTxt}</p></div>`;s.forEach(d=>c.append(mk(d)))}catch(e){console.error(e);c.innerHTML='<div class="empty"><p>Unable to load.</p></div>'}};
 function render(){
  $$("#mid").textContent=myId;
  $$("#tb").innerHTML=["Requests","Nearby","Following","Followers"].map(t=>`<button class="${t===tab?"on":""}">${t}</button>`).join("");
  $$("#tb").querySelectorAll("button").forEach(b=>b.onclick=()=>{tab=b.textContent;render();if(tab==="Nearby"&&!pos&&!near.length)nearby()});
  const c=$$("#tc");
  if(tab==="Requests")list("followRequests",d=>{const x=d.data(),e=h(`<div class="card row" style="padding:12px">${avatar(x.fromPhoto,x.fromName,27)}<div class="grow"><b>${esc(ft(x.fromName,"Traveler"))}</b><br><small>${esc(x.fromTriprideId||"")}</small></div><button class="ms" style="color:#DC2626" title="Reject">close</button><button class="ms" style="color:#16A34A" title="Accept">check_circle</button></div>`),[r,a]=e.querySelectorAll("button");r.onclick=async()=>{try{await deleteDoc(d.ref);toast("Request rejected.");render()}catch{toast("Unable to reject request.")}};a.onclick=()=>accept(d);return e},"No pending follow requests.",0);
  else if(tab==="Following")list("following",d=>tile(d.data(),{act:()=>unfollow(d.id),text:"Unfollow"}),"You are not following anyone yet.",1);
  else if(tab==="Followers")list("followers",d=>tile(d.data(),{act:()=>removeF(d.id),text:"Remove"}),"No followers yet.",1);
  else{c.innerHTML=`<div class="card row"><span class="ms" style="color:#6D28D9">location_on</span><div class="grow"><b>Nearby TRIPRIDE users</b><br><small>${pos?"Showing users within 200 km • registered + current location":"Getting your current location..."}</small></div><button id="rf" class="tbtn"><span class="ms">refresh</span></button></div>`;$$("#rf").onclick=nearby;
   if(nmsg)c.append(h(`<div class="empty"><p>${esc(nmsg)}</p></div>`));else if(pos&&!near.length)c.append(h('<div class="empty"><p>No TRIPRIDE users found within 200 km.</p></div>'));
   near.forEach(d=>{const f=following.has(d.uid);c.append(tile(d,{act:f?null:()=>send(d),text:"Follow",dist:d._d,src:d._s}))})}
 }
 $$("#cp").onclick=async()=>{try{await navigator.clipboard.writeText(myId);toast("TRIPRIDE ID copied: "+myId)}catch{toast(myId)}};
 $$("#sb").onclick=async()=>{const code=$$("#sq").value.trim().toUpperCase();if(!code)return;$$("#sr").textContent="";$$("#sm").textContent="";
  try{let r=await getDocs(query(collection(db,"users"),where("triprideId","==",code),limit(1)));if(!r.docs.length)r=await getDocs(query(collection(db,"users"),where("userId","==",code),limit(1)));
   if(!r.docs.length)return $$("#sm").textContent="User not found. Check the TRIPRIDE ID.";const d=r.docs[0];if(d.id===uid)return $$("#sm").textContent="That is your own TRIPRIDE ID.";
   const x={uid:d.id,...d.data()};$$("#sr").append(tile(x,{act:following.has(d.id)?null:()=>send(x),text:"Follow"}))}catch(e){console.error(e);$$("#sm").textContent="Unable to search right now."}};
 $$("#sq").onkeydown=e=>{if(e.key==="Enter")$$("#sb").click()};
 (async()=>{try{const s=await getDoc(meRef);if(s.exists()){const d=s.data(),c=rid(d);if(ft(d.triprideId)!==c)await setDoc(meRef,{triprideId:c},{merge:true});myId=c}}catch(e){console.warn(e)}await reload()})();
}));
</script></body></html>
