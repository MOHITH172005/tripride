const vd=d=>d&&!isNaN(d)?d:null,toD=x=>x&&x.toDate?x.toDate():typeof x==='string'&&x?vd(new Date(x)):typeof x==='number'?new Date(x):x instanceof Date?x:null;

/* ===== schedule + route matching (ported from the app) ===== */
function runsOn(r,day){const s=rDep(r),e=vd(toD(r.endDate));if(!s||mid(day)<mid(s))return false;if(e&&mid(day)>mid(e))return false;if((r.skipDates||[]).includes(dKey(day)))return false;

/* ===== backend (wallet / razorpay) ===== */
async function post(path,body){
  if(location.protocol==='https:'&&API.startsWith('http:'))throw new Error('The payment server must use HTTPS to work from this website. Update API.');
  const t=await auth.currentUser.getIdToken(true),ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),30000);
  try{const r=await fetch(API+path,{method:'POST',signal:ctl.signal,headers:{'Content-Type':'application/json',Accept:'application/json',Authorization:'Bearer '+t},body:JSON.stringify(body)});let j={};try{j=await r.json()}catch(e){}return{status:r.status,j}}
  catch(e){throw new Error(e.name==='AbortError'?'Server timed out. Try again.':'Could not reach the server. Check HTTPS and CORS settings.')}finally{clearTimeout(tm)}}
async function bpost(path,body){const{status,j}=await post(path,body);if(status<200||status>=300||j.success!==true)throw new Error(str(j.message,status===401?'Your session expired. Please sign in again.':`Server could not complete this request (HTTP ${status}).`));return j}
async function rzpPay(payload,desc){
  const{status,j}=await post('/rydora/payment/create-order',payload);if(status!==200||j.success!==true)throw new Error(str(j.message,'Unable to create payment order.'));
  const orderId=str(j.order_id),intent=str(j.intent_id),key=str(j.key_id),amt=nm(j.amount);if(!orderId||!intent||!key||amt<=0)throw new Error('Payment server returned an invalid order.');
  if(typeof window.Razorpay!=='function')throw new Error('Payment checkout is still loading. Try again in a moment.');
  const pay=await new Promise((res,rej)=>{let done=false;const rz=new window.Razorpay({key,amount:amt,currency:str(j.currency,'INR'),order_id:orderId,name:'RYDORA',description:desc,prefill:{email:S.user.email||'',contact:S.user.phoneNumber||''},theme:{color:'#F26B2A'},
    handler:r=>{done=true;res(r)},modal:{ondismiss:()=>{if(!done)rej(new Error('Payment was cancelled.'))}}});rz.on('payment.failed',r=>{done=true;rej(new Error((r.error&&r.error.description)||'Payment failed.'))});rz.open()});
  const v=await post('/rydora/payment/verify',{intent_id:intent,razorpay_order_id:pay.razorpay_order_id||orderId,razorpay_payment_id:pay.razorpay_payment_id,razorpay_signature:pay.razorpay_signature});
  if(v.status!==200||v.j.verified!==true)throw new Error(str(v.j.message,'Payment verification failed.'));
  return{...v.j,intent_id:intent,payment_id:str(v.j.payment_id,pay.razorpay_payment_id||'')}}
function ask(title,body,btns){return new Promise(res=>{S.ans=res;show(`<div class="d">${X}<h2>${title}</h2><div class="sub">${body}</div><div class="cta">${btns.map(([l,v,g])=>`<button class="btn ${g?'ghost':''}" data-ans="${v}">${l}</button>`).join('')}</div></div>`)})}
const payAsk=(title,body,wl)=>ask(title,body,[[wl,'wallet'],['Pay with Razorpay','razorpay',1]]);

    });

}

  const ref=doc(RIDES(),id);await runTransaction(db,async tx=>{const r=await tx.get(ref);if(!r.exists()||r.data().ownerId!==S.user.uid)throw new Error('Not your ride.');if(str(r.data().status).toLowerCase()!=='active')throw new Error('A ride cannot be cancelled after it has started.');
    tx.update(ref,{status:'cancelled',publishFeeRefundable:false,publishFeeRefundStatus:'not_applicable',cancelledAt:serverTimestamp(),updatedAt:serverTimestamp()})});stopWatch(id);
  const bs=await getDocs(query(BOOKS(),where('rideId','==',id)));
  for(const d of bs.docs){const b=d.data();if(b.status!=='confirmed')continue;const amt=nm(b.bookingFee,nm(b.paidAmount)),pid=str(b.paymentIntentId,str(b.razorpayPaymentId));
    await updateDoc(d.ref,{status:'cancelled',cancelledBy:'publisher',refundAmount:amt,refundStatus:pid?'wallet_pending':'payment_reference_missing',refundLabel:'Publisher cancelled this ride. The platform booking fee will be credited to your TripRide Wallet.',refundRequested:!!pid,cancelledAt:serverTimestamp(),updatedAt:serverTimestamp()});
    note(b.passengerId,'ride_cancelled','Ride has been cancelled','Ride has been cancelled by the publisher. Your platform booking fee will be credited to your TripRide Wallet.',{rideId:id,bookingId:d.id,refundAmount:amt});refund('cancelled_booking',d.id)}
  const rq=await getDocs(query(REQS(),where('rideId','==',id)));
  for(const d of rq.docs){const q=d.data();if(str(q.status).toLowerCase()!=='pending')continue;await updateDoc(d.ref,{status:'rejected',rejectionReason:'publisher_cancelled_ride',updatedAt:serverTimestamp()});
    note(q.requesterId,'ride_cancelled','Ride has been cancelled','The publisher cancelled this ride before accepting your request. Your platform booking fee will be credited to your TripRide Wallet.',{rideId:id,requestId:d.id});refund('rejected_request',d.id)}}
function otpDialog(bid,k,l){show(`<div class="d">${X}<h2>Verify ${l==='return'?'evening return':'morning'} pickup</h2><p class="sub">Ask the passenger for their 6-digit OTP for ${esc(k)}.</p><div class="fl"><label for="po">OTP</label><input id="po" inputmode="numeric" maxlength="6" placeholder="123456"></div><p class="err" id="poe" hidden></p><button class="btn block" data-act="otpGo" data-id="${bid}" data-k="${k}" data-l="${l}">Verify OTP</button></div>`);setTimeout(()=>$('#po')&&$('#po').focus(),50)}
async function otpGo(bid,k,l){const c=($('#po').value||'').replace(/\D/g,''),e=$('#poe');if(c.length!==6){e.textContent='Enter a valid 6-digit OTP.';e.hidden=false;return}
  try{await bpost('/rydora/booking/verify-pickup',{booking_id:bid,otp:c,date_key:k,leg:l});dlg.close();toast(`OTP verified. This ${l==='return'?'return':'morning'} leg will complete automatically after 30 minutes.`)}catch(er){e.textContent=(er.message||'Verification failed.').replace('Bad state: ','');e.hidden=false}}
async function run(btn,fn,okMsg){if(btn)btn.disabled=true;try{await fn();if(okMsg)toast(okMsg)}catch(e){console.error(e);toast(e.message||'Something went wrong.')}finally{if(btn)btn.disabled=false}}

/* ===== events ===== */
document.addEventListener('click',async e=>{
  if(!e.target.closest('.fl')){document.querySelectorAll('.sugg').forEach(s=>s.hidden=true)}
  const el=e.target.closest('[data-act],[data-tab],[data-ans],[data-tab-go]');if(!el)return;const d=el.dataset;
  if(d.ans!==undefined){const r=S.ans;S.ans=null;dlg.close();if(r)r(d.ans);return}
  if(d.tab)return go(d.tab);if(d.tabGo)return go(d.tabGo);
  switch(d.act){
    case'close':return dlg.close();case'login':return openLogin(null);case'sendOtp':return sendOtp();case'verifyOtp':return verifyOtp();case'chPhone':return login1();
    case'fveh':F.veh=d.v;document.querySelectorAll('[data-act=fveh]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===F.veh)));return paintFind();
    case'fseat':F.seats=Math.min(6,Math.max(1,F.seats+ +d.d));$('#fs').textContent=F.seats;return paintFind();
    case'book':return openBook(d.id);
    case'bmode':B.mode=d.v;B.sel.clear();{const o=bOpts().filter(x=>remain(B.r,x)>=B.seats);if(o.length)B.sel.add(dKey(o[0]))}return renderBook();
    case'bdate':{const k=d.k;if(B.mode==='once'){B.sel.clear();B.sel.add(k)}else B.sel.has(k)?B.sel.delete(k):B.sel.add(k);return renderBook()}
    case'bseat':{const n=B.seats+ +d.d;if(n<1||n>tSeats(B.r))return;B.seats=n;while(B.names.length<n){B.names.push('');B.phones.push('')}B.names.length=n;B.phones.length=n;return renderBook()}
    case'bsubmit':return submitBook();
    case'toMine':dlg.close();M.side='book';M.period='Upcoming';return go('mine');
    case'pveh':PB.veh=d.v;{const s=$('#pseats');if(d.v==='bike')s.value=1;s.max=d.v==='bike'?1:7}return pubUI();
    case'prec':PB.rec=d.v;return pubUI();
    case'pday':{const n=+d.d;PB.days.has(n)?PB.days.delete(n):PB.days.add(n);return pubUI()}
    case'rmstop':PB.stops.splice(+d.i,1);return paintStops();
    case'mside':M.side=d.v;M.period='Current';return paintMine();case'mper':M.period=d.v;return paintMine();
    case'decide':{const acc=d.v==='1';return run(el,()=>decide(d.id,acc),acc?'Request accepted.':'Request rejected.')}
    case'cancelBook':if(confirm('Cancel this booking? Passenger cancellations are not refunded.'))return run(el,()=>cancelBooking(d.id),'Booking cancelled.');return;
    case'startRide':if(confirm('Start this ride now? Passengers will see your live location while this page stays open.'))return run(el,()=>startRide(d.id),'Ride started. Live location sharing is on.');return;
    case'completeRide':if(confirm('Mark this ride as completed?'))return run(el,()=>completeRide(d.id),'Ride completed.');return;
    case'cancelRide':if(confirm('Cancel this published ride? Your ₹20 publishing fee is non-refundable. Passengers’ booking fees go back to their wallets.'))return run(el,()=>cancelRide(d.id),'Ride cancelled. Passenger refunds are being processed.');return;
    case'otp':return otpDialog(d.id,d.k,d.l);case'otpGo':return otpGo(d.id,d.k,d.l);
  }});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.bn!==undefined)B.names[+t.dataset.bn]=t.value;else if(t.dataset&&t.dataset.bp!==undefined)B.phones[+t.dataset.bp]=t.value.replace(/\D/g,'')});
document.addEventListener('change',e=>{if(e.target.id==='bret'){B.ret=e.target.checked;renderBook()}});
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});dlg.addEventListener('close',()=>{if(S.ans){const r=S.ans;S.ans=null;r(null)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ph'){e.preventDefault();sendOtp()}if(e.key==='Enter'&&e.target.id==='otp'){e.preventDefault();verifyOtp()}});
$('#authBtn').addEventListener('click',async()=>{if(S.user){try{await signOut(auth);toast('Signed out.')}catch(e){toast('Could not sign out.')}}else openLogin(null)});
$('#themeBtn').addEventListener('click',()=>{const r=document.documentElement,dk=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dk?'light':'dark';try{localStorage.setItem('tr_theme',r.dataset.theme)}catch(e){}});
go('find');
</script>
