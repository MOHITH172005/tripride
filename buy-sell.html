async function loginApi(endpoint,data){
 const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),30000);
 try{
  const response=await fetch(LOGIN_API_BASE_URL+endpoint,{method:'POST',
   headers:{'Content-Type':'application/json','Accept':'application/json'},
   body:JSON.stringify(data),signal:ctrl.signal});
  let body={};try{body=await response.json();}catch(_){}
  if(!response.ok||body.success!==true){
   const error=new Error(body.message||body.error||'Something went wrong. Please try again.');
   error.status=response.status;error.body=body;throw error;
  }
  return body;
 }catch(e){
  if(e.name==='AbortError')throw new Error('Request timed out. Please try again.');
  if(e instanceof TypeError)throw new Error('Cannot reach the login server. Please try again.');
  throw e;
 }finally{clearTimeout(timer);}
}
async function checkLoginMobile(){
 const number=($('#loginPhone')?.value||'').replace(/\D/g,'');
 if(!/^[6-9]\d{9}$/.test(number))return login1('Enter a valid 10-digit mobile number.');
 const b=$('[data-act="checkLoginMobile"]');if(b){b.disabled=true;b.textContent='Checking…';}
 try{
  const result=await loginApi(PHONE_CHECK_URL,{phone:number});
  const exists=result.exists===true||result.user_exists===true||result.registered===true;
  if(exists){S.phone=number;loginStepPassword();}
  else location.href=REGISTER_URL+'?phone='+encodeURIComponent(number);
 }catch(e){
  const body=e.body||{},msg=String(e.message||'');
  const notFound=e.status===404||body.exists===false||body.user_exists===false||body.registered===false||
   /not\s*(found|registered|exist)|no\s+(account|user)|does\s*n[o']t\s+exist|unregistered|new user/i.test(msg);
  if(notFound)location.href=REGISTER_URL+'?phone='+encodeURIComponent(number);
  else login1(msg);
 }
}

 const b=$('[data-act="passwordLogin"]');if(b){b.disabled=true;b.textContent='Signing in…';}

const shrink=async f=>{const b=await createImageBitmap(f),s=Math.min(1,1800/b.width),c=document.createElement('canvas');c.width=Math.round(b.width*s);c.height=Math.round(b.height*s);c.getContext('2d').drawImage(b,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',.82))};



async function walletPay(fee){

  const uid=S.user.uid,pRef=doc(collection(db,'wallets',uid,'usedVehicleListingPayments')),wRef=doc(db,'wallets',uid),hRef=doc(collection(db,'users',uid,'walletTransactions'));

  try{

    await runTransaction(db,async tx=>{

      const s=await tx.get(wRef),bal=Number(s.data()&&s.data().balance)||0;

      if(bal+.01<fee)throw new Error('Insufficient TripRide Wallet balance.');

      tx.set(wRef,{balance:bal-fee,updatedAt:serverTimestamp()},{merge:true});

      const base={type:'debit',transactionType:'used_vehicle_listing_fee',service:'Used Vehicle Marketplace',vehicleType:S.type,amount:fee,status:'completed',createdAt:serverTimestamp()};

      tx.set(pRef,{...base,balanceBefore:bal,balanceAfter:bal-fee});

      tx.set(hRef,{...base,description:`${LABEL[S.type]} marketplace listing fee`});

    });

    return{id:'wallet_'+pRef.id,order:'',sig:''};

  }catch(e){toast('Wallet payment failed: '+(e.message||e));return null}

}

async function walletRefund(payId,fee){

  const uid=S.user.uid,pRef=doc(db,'wallets',uid,'usedVehicleListingPayments',payId.slice(7)),wRef=doc(db,'wallets',uid),hRef=doc(collection(db,'users',uid,'walletTransactions'));

  try{await runTransaction(db,async tx=>{

    const p=await tx.get(pRef);if(!p.exists()||p.data().status==='refunded')return;

    const s=await tx.get(wRef),bal=Number(s.data()&&s.data().balance)||0;

    tx.set(wRef,{balance:bal+fee,updatedAt:serverTimestamp()},{merge:true});

    tx.update(pRef,{status:'refunded',refundedAt:serverTimestamp()});

    tx.set(hRef,{type:'credit',transactionType:'used_vehicle_listing_fee_refund',service:'Used Vehicle Marketplace',vehicleType:S.type,amount:fee,status:'completed',description:'Listing fee refunded because listing publication failed.',createdAt:serverTimestamp()});

  })}catch(e){console.error('REFUND ERROR',e)}

}

function rzpPay(fee){

  return new Promise(res=>{

    if(!RZP_KEY||RZP_KEY.startsWith('YOUR_')){toast('Razorpay key is not configured. Set RZP_KEY in the page script.');return res(null)}

    if(typeof window.Razorpay!=='function'){toast('Payment checkout is still loading. Try again in a moment.');return res(null)}

    const rz=new window.Razorpay({key:RZP_KEY,amount:Math.round(fee*100),currency:'INR',name:'TripRide',description:`${LABEL[S.type]} listing fee`,

      prefill:{contact:S.user.phoneNumber||'',email:S.user.email||''},

      notes:{purpose:'used_vehicle_listing',vehicle_type:S.type,listing_fee:String(fee),user_id:S.user.uid},theme:{color:'#F26B2A'},

      handler:r=>res({id:r.razorpay_payment_id||'',order:r.razorpay_order_id||'',sig:r.razorpay_signature||''}),

      modal:{ondismiss:()=>res(null)}});

    rz.on('payment.failed',()=>{toast('Payment failed. Please try again.');res(null)});rz.open();

  });

}

async function payFee(){

  const fee=FEE[S.type];

  if(S.wallet+.01>=fee){

    const a=await ask('Pay listing fee',`TripRide Wallet balance: ₹${money(S.wallet)}\n${LABEL[S.type]} listing fee: ₹${money(fee)}\n\nUse your wallet to publish this listing immediately?`,[['Pay from wallet','wallet'],['Razorpay','rzp',1]]);

    if(a==null)return null;

    if(a==='wallet'){const r=await walletPay(fee);if(r)toast(`₹${money(fee)} paid from TripRide Wallet. Publishing…`);return r}

  }

  const r=await rzpPay(fee);if(r)toast('Payment successful. Publishing your listing…');return r;

}

function sErr(m){const e=$('#sErr');if(e){e.textContent=m;e.hidden=!m}}

async function publish(){

  if(S.busy)return;const f=$('#sf');sErr('');

  if(!S.user)return openLogin(()=>go('sell'));

  if(!f.reportValidity())return;

  const g=n=>f[n].value.trim(), rep=g('sellerType')==='representative';

  if(rep&&(!g('ownerName')||!g('ownerPhone')||!g('sellerRelationship')))return sErr('Enter the actual owner’s name, phone and your relationship or authorization.');

  if(!S.pos){sErr('Present location is required. Allow location access and try again.');await locate();return}

  if(!S.imgs.length)return sErr('Please add at least one vehicle photo.');

  const pay=await payFee();if(!pay)return;

  S.busy=true;const b=$('#pubBtn');b.disabled=true;b.textContent='Publishing…';

  const fee=FEE[S.type],uid=S.user.uid,lRef=doc(collection(db,'used_vehicles'));

  try{

    const urls=[];

    for(let i=0;i<S.imgs.length;i++){const r=ref(storage,`used_vehicles/${lRef.id}/photo_${i}.jpg`);await uploadBytes(r,await shrink(S.imgs[i]),{contentType:'image/jpeg'});urls.push(await getDownloadURL(r))}

    const n=k=>parseInt(g(k),10)||0;

    await setDoc(lRef,{type:S.type,sellerId:uid,sellerName:g('sellerName'),sellerPhone:g('sellerPhone'),sellerType:g('sellerType'),

      ownerName:rep?g('ownerName'):g('sellerName'),ownerPhone:rep?g('ownerPhone'):g('sellerPhone'),sellerRelationship:rep?g('sellerRelationship'):'',

      brand:g('brand'),model:g('model'),variant:g('variant'),year:n('year'),registrationYear:n('registrationYear'),registrationNumber:g('registrationNumber').toUpperCase(),

      fuel:g('fuel'),transmission:g('transmission'),kmDriven:n('kmDriven'),owners:n('owners')||1,rcDetails:g('rcDetails'),insurance:g('insurance'),puc:g('puc'),

      price:parseFloat(g('price'))||0,city:g('city'),latitude:S.pos.lat,longitude:S.pos.lng,photos:urls,listingStatus:'active',listingFee:fee,

      paymentStatus:pay.id.startsWith('wallet_')?'wallet_paid':'gateway_success_unverified',paymentId:pay.id,paymentOrderId:pay.order,paymentSignature:pay.sig,

      createdAt:serverTimestamp(),updatedAt:serverTimestamp(),publishedAt:serverTimestamp()});

    S.busy=false;

    show(`<div class="d" style="text-align:center"><h2 style="margin:0 0 8px">Live now</h2><p class="sub">Your vehicle is now visible to buyers within 200 km.</p><button class="btn block" data-act="doneSell">Done</button></div>`);

  }catch(e){

    console.error('PUBLISH ERROR',e);

    if(pay.id.startsWith('wallet_'))await walletRefund(pay.id,fee);

    S.busy=false;b.disabled=false;paintWallet();

    sErr('Publish failed: '+(e.message||e)+(pay.id.startsWith('wallet_')?' Your wallet fee was refunded.':' Your payment was received; contact Tripride Support before paying again.'));

  }

}

  if(!S.mine.length){box.innerHTML=stateCard('📦','No selling products','Your active, sold and removed listings will appear here.','<button class="btn" data-act="sell">Sell a vehicle</button>');return}

  box.innerHTML=S.mine.map(v=>{const img=safeImg(v.photos[0]),a=v.status==='active';

    return`<div class="mine"><div class="row"><div class="ph">${img?`<img src="${esc(img)}" alt="" referrerpolicy="no-referrer">`:ICON[v.type]}</div><div class="vi"><h3>${esc(`${v.brand||''} ${v.model||''}`)}</h3><div class="pr" style="justify-content:flex-start;gap:10px;margin:6px 0"><b>₹${money(v.price)}</b><span class="st ${esc(v.status)}">${esc(v.status)}</span></div></div></div>

    <div class="btns">${a?`<button class="btn sm ghost" data-act="editPrice" data-id="${esc(v.id)}">Edit price</button><button class="btn sm ghost" data-act="status" data-id="${esc(v.id)}" data-s="removed">Remove</button><button class="btn sm ghost" data-act="status" data-id="${esc(v.id)}" data-s="sold">Mark sold</button>`:`<button class="btn sm ghost" data-act="status" data-id="${esc(v.id)}" data-s="active">Make active</button>`}</div></div>`}).join('');

}

const setStatus=(id,s)=>updateDoc(doc(db,'used_vehicles',id),{listingStatus:s,updatedAt:serverTimestamp()}).catch(e=>toast('Could not update: '+(e.code||e.message)));



/* ===== events ===== */

document.addEventListener('click',async e=>{

  if(!e.target.closest('.fl')){const sg=$('#sg');if(sg)sg.hidden=true}

  const el=e.target.closest('[data-act],[data-open],[data-tab],[data-ans],[data-sg],[data-rm]');if(!el)return;const d=el.dataset;

  if(d.ans!==undefined){const r=S.ans;S.ans=null;dlg.close();if(r)r(d.ans);return}

  if(d.sg!==undefined){$('#f_city').value=d.sg;$('#sg').hidden=true;return}

  if(d.rm!==undefined){S.imgs.splice(+d.rm,1);return paintThumbs()}

  if(d.tab){return go(d.tab==='mine'?'mine':'home')}

  if(d.open){const v=S.items.find(x=>x.id===d.open);return v&&detail(v)}

  switch(d.act){

    case'close':return dlg.close();

    case'home':return go('home');

    case'buy':return choose('buy');

    case'sell':return S.user?choose('sell'):openLogin(()=>choose('sell'));

    case'pickType':dlg.close();return go(S.mode==='buy'?'list':'sell',d.t);

    case'relocate':S.pos=null;return go('list');

    case'login':return openLogin(null);

    case'checkLoginMobile':return checkLoginMobile();case'passwordLogin':return passwordLogin();case'changeLoginPhone':return login1();

    case'pickPh':return $('#phIn').click();

    case'useLoc':if(!S.pos){await locate()}if(S.place)$('#f_city').value=S.place;else toast('Present location is not available yet.');return;

    case'status':return setStatus(d.id,d.s);

    case'editPrice':{const v=S.mine.find(x=>x.id===d.id);if(!v)return;

      show(`<div class="d">${X}<h2>Edit selling price</h2><div class="fl" style="margin-top:12px"><label for="np">New price (₹)</label><input id="np" type="number" min="1" value="${v.price}" inputmode="numeric"></div><button class="btn block" data-act="savePrice" data-id="${esc(v.id)}">Save</button></div>`);return}

    case'savePrice':{const p=parseFloat($('#np').value);if(!(p>0))return toast('Enter a valid price.');dlg.close();return updateDoc(doc(db,'used_vehicles',d.id),{price:p,updatedAt:serverTimestamp()}).catch(er=>toast('Could not update: '+(er.code||er.message)))}

    case'doneSell':dlg.close();return go('mine');

  }

});

dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});

dlg.addEventListener('close',()=>{if(S.ans){const r=S.ans;S.ans=null;r(null)}});

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='loginPhone'){e.preventDefault();checkLoginMobile()}if(e.key==='Enter'&&e.target.id==='loginPassword'){e.preventDefault();passwordLogin()}});

$('#authBtn').addEventListener('click',()=>{if(!S.user)openLogin(null)});

$('#themeBtn').addEventListener('click',()=>{const r=document.documentElement,dk=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dk?'light':'dark';try{localStorage.setItem('tr_theme',r.dataset.theme)}catch(e){}});

go('home');

</script>

</body>

</html>
