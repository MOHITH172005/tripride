const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const x = typeof v === 'number' ? v : parseFloat(v); return Number.isFinite(x) ? x : null; };

function mapDoc(d){
  const x = d.data(), raw = x.rideDate || x.departureTime;
  const date = raw && raw.toDate ? raw.toDate() : null;
  const seats = Math.max(0, Math.round(num(x.availableSeats ?? x.seats) ?? 0));
  return {...x, id:d.id, date, seats, total:Math.max(seats, Math.round(num(x.totalSeats) ?? seats)), price:num(x.price ?? x.seatPrice) ?? 0,
    pLat:num(x.pickupLat), pLng:num(x.pickupLng), dLat:num(x.dropLat), dLng:num(x.dropLng),
    from:x.from || x.tripStartLocation || 'Pickup', to:x.to || x.tripEndLocation || 'Destination',
    owner:x.creatorId || x.driverId || x.hostUid || '', name:x.creatorName || x.driverName || 'Driver', photo:x.creatorPhoto || x.driverPhoto || ''};
}
const rideOpen = t => ['open','active','available'].includes(String(t.status || 'open').toLowerCase());
const bookable = t => t.date && t.date > new Date() && rideOpen(t) && t.seats > 0;
function subscribe(){
  const q = query(collection(db,'trips'), where('rideDate','>=',Timestamp.now()), orderBy('rideDate'));
  onSnapshot(q, snap => { S.trips = snap.docs.map(mapDoc); S.loaded = true; S.error = ''; render(); },

/* ============ LOCATION ============ */
function locate(){
  if (!navigator.geolocation) { S.loc = 'denied'; return render(); }
  navigator.geolocation.getCurrentPosition(p => { S.pos = {lat:p.coords.latitude, lng:p.coords.longitude}; S.loc = 'ready'; render(); reverseGeocode(); },
    () => { if (!S.pos) { S.loc = 'denied'; render(); } }, {enableHighAccuracy:true, timeout:12000, maximumAge:120000});
}
async function reverseGeocode(){
  try {
    const r = await fetch(`https://maps.googleapis.com/maps/api/geocode/json?latlng=${S.pos.lat},${S.pos.lng}&key=${GOOGLE_KEY}&language=en&region=in`);
    const j = await r.json(), f = j.results && j.results[0] && j.results[0].formatted_address;
    S.place = f || '';
  } catch(e){ S.place = ''; }
  render();
}
async function geocode(text){
  try {
    const r = await fetch(`https://maps.googleapis.com/maps/api/geocode/json?address=${encodeURIComponent(text)}&key=${GOOGLE_KEY}&language=en&region=in`);
    const l = (await r.json()).results?.[0]?.geometry?.location;
    return l ? {lat:l.lat, lng:l.lng} : null;
  } catch(e){ return null; }
}

/* ============ GOOGLE PLACES ============ */
async function placeSearch(text){
  const key = text.toLowerCase(); if (S.cache.has(key)) return S.cache.get(key);
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 7000);
  try {
    const r = await fetch('https://places.googleapis.com/v1/places:searchText', {method:'POST', signal:ctl.signal,
      headers:{'Content-Type':'application/json','X-Goog-Api-Key':GOOGLE_KEY,'X-Goog-FieldMask':'places.displayName,places.formattedAddress,places.location'},
      body:JSON.stringify({textQuery:text, languageCode:'en', regionCode:'IN', pageSize:7})});
    if (!r.ok) throw new Error('Places ' + r.status);
    const j = await r.json();
    const out = (j.places || []).map(p => ({name:(p.displayName && p.displayName.text) || (p.formattedAddress || '').split(',')[0] || 'Place', address:p.formattedAddress || '',
      lat:num(p.location && p.location.latitude), lng:num(p.location && p.location.longitude)})).filter(p => p.lat !== null && p.lng !== null);
    S.cache.set(key, out); return out;
  } finally { clearTimeout(timer); }
}
// k = 'from' | 'to' on the search bar; 'cfrom' | 'cto' inside the create-ride form
function suggest(k, text){
  clearTimeout(S.sdeb[k]); const id = S.sreq[k] = (S.sreq[k] || 0) + 1;
  if (text.trim().length < 3) { S.sugg[k] = []; return drawSugg(k); }
  S.sdeb[k] = setTimeout(async () => {
    try { const res = await placeSearch(text.trim()); if (id !== S.sreq[k]) return; S.sugg[k] = res; if (!res.length) S.sugg[k] = [{none:1}]; }
    catch(e){ if (id !== S.sreq[k]) return; S.sugg[k] = [{err:1}]; }
    drawSugg(k);
  }, 300);
}
function drawSugg(k){
  const box = $('#sg-' + k); if (!box) return; const a = S.sugg[k] || [];

}

function matchesFilter(t){
  const v = String(t.vehicle || '').toLowerCase();
  switch (S.filter) {
    case 'Car': return v.includes('car');
    case 'Bike': return v.includes('bike') || v.includes('motor');
    case 'Women Only': return t.womenOnly === true;
    case 'AC': return t.acAvailable === true || t.ac === true;
    case 'Fast Ride': return t.fastRide === true;
    case 'Verified': return t.verified === true || t.isVerified === true;
    default: return true;
  }
}
function visible(){
  const now = new Date(); let list = S.trips.filter(bookable);
  if (S.searched && S.from) {
    const day = new Date(S.date + 'T00:00');
    list = list.filter(t => sameDay(t.date, day) && t.pLat !== null && t.dLat !== null)
      .map(t => ({t, pk:km(S.from.lat, S.from.lng, t.pLat, t.pLng), dp:S.curMode ? 0 : km(S.to.lat, S.to.lng, t.dLat, t.dLng)}))
      .filter(o => o.pk <= MATCH_KM && (S.curMode || o.dp <= MATCH_KM))
      .sort((a,b) => (a.pk + a.dp) - (b.pk + b.dp)).map(o => o.t);
  } else {
    list = list.filter(t => sameDay(t.date, now) && t.pLat !== null && distMe(t) <= NEARBY_KM).sort((a,b) => distMe(a) - distMe(b));
  }
  return list.filter(matchesFilter);
}

const AUTH_ERR = {'auth/invalid-phone-number':'Enter a valid 10-digit mobile number.','auth/too-many-requests':'Too many attempts. Please wait a few minutes.','auth/invalid-verification-code':'That OTP is not correct.','auth/code-expired':'That OTP has expired. Request a new one.','auth/captcha-check-failed':'Security check failed. Refresh and try again.','auth/unauthorized-domain':'This domain is not authorized in Firebase Authentication.','auth/operation-not-allowed':'Phone sign-in is not enabled for this Firebase project.','auth/network-request-failed':'Network error. Try again.'};
function loginStep1(msg){

}
function loginStep2(phone, msg){
  show(`<div class="d"><button class="x" data-close aria-label="Close">×</button><h2>Enter the OTP</h2><p class="sub">We sent a 6-digit code to +91 ${esc(phone)}.</p>

function openLogin(after){ S.afterLogin = after || null; S.confirm = null; loginStep1(); }
async function sendOtp(){
  const phone = ($('#ph').value || '').replace(/\D/g,'');
  if (!/^[6-9]\d{9}$/.test(phone)) return loginStep1('Enter a valid 10-digit mobile number.');

    S.confirm = await signInWithPhoneNumber(auth, '+91' + phone, S.rc); S.phone = phone; loginStep2(phone);
  } catch(e){ console.error(e); if (S.rc) { try { S.rc.clear(); } catch(_){} S.rc = null; } loginStep1(AUTH_ERR[e.code] || `Could not send OTP (${e.code || 'error'}).`); }
}
async function verifyOtp(){
  const code = ($('#otp').value || '').replace(/\D/g,''); if (code.length !== 6) return loginStep2(S.phone, 'Enter the 6-digit OTP.');
  const b = $('#verifyOtp'); b.disabled = true; b.textContent = 'Verifying…';

}

/* ============ BACKEND CALLS ============ */
async function api(path, token, body, ms){
  if (location.protocol === 'https:' && BACKEND.startsWith('http:')) throw new Error('The payment server must use HTTPS to work from this website. Update BACKEND.');
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), ms || 20000);
  try {
    const r = await fetch(BACKEND + path, {method:'POST', signal:ctl.signal, headers:{'Content-Type':'application/json','Authorization':'Bearer ' + token}, body:JSON.stringify(body)});
    let j; try { j = await r.json(); } catch(e){ throw new Error('Invalid response from payment server.'); }
    return {status:r.status, j};
  } catch(e){
    if (e.name === 'AbortError') throw new Error('The payment server took too long. Please try again.');
    if (e instanceof TypeError) throw new Error('Could not reach the payment server. Check that it allows this website (CORS) and uses HTTPS.');
    throw e;
  } finally { clearTimeout(timer); }
}
const apiMsg = (j, fb) => (j && (j.message || j.error)) ? String(j.message || j.error) : fb;
const okRes = (r, needVerified) => (r.status === 200 || r.status === 201) && r.j && r.j.success === true && (!needVerified || r.j.verified === true);

/* ============ BOOKING (booking/create-order + booking/verify-payment) ============ */
function joinTrip(id){
  const t = S.trips.find(x => x.id === id); if (!t) return;
  if (isMine(t)) return toast('You cannot book your own ride.');
  if (!S.user) return openLogin(() => joinTrip(id));
  S.bk = {trip:t, seats:1, pax:[{name:'',age:''}], busy:false}; renderBooking();
}
function renderBooking(){
  const t = S.bk.trip;
  show(`<div class="d"><button class="x" data-close aria-label="Close">×</button><h2>Confirm your seat</h2><p class="sub">${esc(t.from)} → ${esc(t.to)} · ${money(t.price)} per seat</p>
    <h4>Passenger details</h4><div id="pax"></div>
    <div class="offer"><div class="top"><span>Booking fee offer</span><span>₹${FEE}</span></div><p>Pay only a ₹${FEE} booking fee now. The ride price is paid separately according to the ride arrangement.</p></div>
    <div class="rows" id="prices"></div>
    <div class="stepper"><b>Select seats</b><div class="c"><button type="button" data-act="seatMinus" id="sMinus" aria-label="Remove a seat">−</button><span id="sCount"></span><button type="button" data-act="seatPlus" id="sPlus" aria-label="Add a seat">+</button></div></div>
    <button class="btn block" id="payBtn" data-act="pay"></button><p class="note">Seat is confirmed only after secure payment verification.</p></div>`);

}
function renderPax(){
  $('#pax').innerHTML = S.bk.pax.map((p,i) => `<div class="pax"><div class="h">Passenger ${i+1}</div><div class="two pa">
    <div class="fld"><label for="pn${i}">Name</label><input id="pn${i}" data-pax="${i}" data-f="name" value="${esc(p.name)}" placeholder="Traveler name" autocomplete="off"></div>
    <div class="fld"><label for="pa${i}">Age</label><input id="pa${i}" data-pax="${i}" data-f="age" value="${esc(p.age)}" inputmode="numeric" maxlength="3" placeholder="Age" autocomplete="off"></div></div></div>`).join('');
}
function updateBooking(){
  const bk = S.bk; if (!bk) return; const t = bk.trip, total = t.price * bk.seats, rem = Math.max(0, total - FEE);
  $('#prices').innerHTML = `<div><span>Ride price (per seat)</span><b>${money(t.price)}</b></div><div><span>Total (${bk.seats} × ${money(t.price)})</span><b>${money(total)}</b></div>
    <div><span>Online booking fee</span><b>₹${FEE}</b></div><div class="tot"><span>Remaining after booking</span><b>${money(rem)}</b></div>`;
  $('#sCount').textContent = bk.seats; $('#sMinus').disabled = bk.seats <= 1; $('#sPlus').disabled = bk.seats >= t.seats;
  const b = $('#payBtn'); b.disabled = bk.busy; b.textContent = bk.busy ? 'Processing…' : `Pay ₹${FEE} securely`;
}
async function startBooking(){
  const bk = S.bk; if (!bk || bk.busy) return; const t = bk.trip, passengers = [];
  for (let i = 0; i < bk.seats; i++) {
    const name = (bk.pax[i].name || '').trim(), age = (bk.pax[i].age || '').trim(), n = parseInt(age, 10);
    if (!name) return toast(`Enter name for passenger ${i+1}.`);
    if (!Number.isFinite(n) || n <= 0) return toast(`Enter a valid age for passenger ${i+1}.`);
    passengers.push({name, age});
  }
  if (!S.user) return openLogin(() => joinTrip(t.id));
  bk.busy = true; updateBooking();
  try {
    const token = await S.user.getIdToken(true);
    const r = await api('/booking/create-order', token, {trip_id:t.id, seat_count:bk.seats, group_pricing_version:PRICING_V, pricing_version:PRICING_V, booking_fee:FEE, coupon_code:'', use_wallet:true, passengers});
    if (!okRes(r)) throw new Error(apiMsg(r.j, 'Unable to prepare booking payment.'));
    const j = r.j, fee = num(j.total_fee ?? j.booking_fee) ?? NORMAL_FEE;
    if (Math.abs(fee - FEE) > .01 && Math.abs(fee - NORMAL_FEE) > .01) throw new Error('Invalid booking fee returned by server.');
    const intentId = String(j.intent_id || ''); if (!intentId) throw new Error('Booking payment intent missing.');
    const walletUsed = num(j.wallet_used) ?? 0, rzp = num(j.razorpay_amount) ?? 0, needsRzp = j.requires_razorpay === true;
    const P = {trip:t, intentId, seats:bk.seats, passengers, fee, walletUsed, rzp, mode: j.payment_mode ? String(j.payment_mode) : (!needsRzp ? 'wallet' : walletUsed > 0 ? 'wallet_razorpay' : 'razorpay'), paid:false};
    S.pending = P;
    if (!needsRzp) { dlg.close(); return finishBooking(P, {}); }
    if (typeof window.Razorpay !== 'function') throw new Error('Payment checkout is still loading. Please try again in a moment.');
    dlg.close();
    const rz = new window.Razorpay({key:j.key_id, amount:j.amount, currency:j.currency || 'INR', order_id:j.order_id, name:'TRIPMATE', description:'Ride Booking Fee',
      prefill:{email:S.user.email || '', contact:S.user.phoneNumber || ''}, notes:{trip_id:t.id, intent_id:intentId, user_id:S.user.uid, seat_count:String(bk.seats)}, theme:{color:'#F26B2A'},
      handler: resp => finishBooking(P, {razorpay_payment_id:resp.razorpay_payment_id, razorpay_order_id:resp.razorpay_order_id, razorpay_signature:resp.razorpay_signature}),
      modal:{ondismiss: () => { if (S.pending === P && !P.paid) { S.pending = null; toast('Payment failed or was cancelled.'); } }}});
    rz.on('payment.failed', e => { if (S.pending === P) { S.pending = null; toast(e?.error?.description || 'Payment failed or was cancelled.'); } });
    rz.open();
  } catch(e){ console.error('BOOKING CREATE ERROR', e); S.pending = null; if (S.bk) { S.bk.busy = false; if (dlg.open && $('#payBtn')) updateBooking(); } toast(e.message || 'Unable to start booking right now.'); }
}
async function finishBooking(P, extra){
  P.paid = !!extra.razorpay_payment_id; $('#busyT').textContent = 'Confirming your booking'; busy.showModal();
  try {
    const token = await S.user.getIdToken(true);
    const r = await api('/booking/verify-payment', token, {trip_id:P.trip.id, intent_id:P.intentId, payment_mode:P.mode, seat_count:P.seats, passengers:P.passengers, ...extra});
    if (!okRes(r, true)) throw new Error(apiMsg(r.j, 'Booking confirmation failed.'));
    busy.close(); await new Promise(x => setTimeout(x, 300)); celebrateBooking(P);
  } catch(e){
    console.error('BOOKING VERIFY ERROR', e); busy.close();
    toast(P.paid ? 'Payment completed, but booking confirmation is still pending. Do not pay again. Please try again later or contact support.' : (e.message || 'Unable to confirm booking right now.'));
  } finally { S.pending = null; S.bk = null; }
}
function celebrateBooking(P){
  const label = P.mode === 'wallet' ? 'Paid from Tripride Wallet' : P.mode === 'wallet_razorpay' ? 'Paid using Wallet + Razorpay' : 'Paid securely via Razorpay';
  show(`<div class="d win"><div class="big">✓</div><h2>Your booking is complete!</h2><p class="sub">Seat confirmed. You’re all set for the journey.</p>
    <div class="box"><b>${esc(P.trip.from)} → ${esc(P.trip.to)}</b><div>${fmtDate(P.trip.date)}, ${fmtTime(P.trip.date)} · ${P.seats} seat${P.seats>1?'s':''}</div>
    <span class="ok">₹${rs(P.fee)} Payment successful</span><div style="margin-top:8px;font-size:.82rem">${label}</div></div><button class="btn block" data-close>Done</button></div>`);
}

/* ============ CREATE RIDE (create_ride_screen.dart flow) ============ */
const newC = () => ({fromN:'',fromLa:0,fromLo:0,toN:'',toLa:0,toLo:0,veh:'',vno:'',seats:'',price:'',meet:'',date:'',time:'',ac:false,wo:false,terms:false,busy:false,err:''});
const CT_TERMS = ['Provide correct ride, vehicle, pickup, destination, date and time details.','Be on time and reach the agreed meeting point/pickup location.','Treat passengers respectfully and behave responsibly throughout the journey.','Do not harass, threaten, insult, discriminate against or disturb passengers.','Do not demand any unauthorized extra amount from passengers.','Keep the vehicle clean, safe and suitable for the booked passengers.','Do not change the agreed trip price or important trip details without informing passengers.','Follow applicable traffic, safety and legal requirements while driving.','Respect passengers’ privacy, personal space and belongings.','If the ride cannot be completed or a serious issue occurs, inform passengers and TripRide Support promptly.'];
function openCreate(){ if (!S.user) return openLogin(openCreate); S.C = newC(); S.sugg.cfrom = []; S.sugg.cto = []; renderCreate(); }
function renderCreate(){
  const c = S.C, f = (id, label, key, ph, extra='') => `<div class="fld"><label for="${id}">${label}</label><input id="${id}" data-c="${key}" value="${esc(c[key])}" placeholder="${ph}" autocomplete="off" ${extra}></div>`;
  show(`<div class="d"><button class="x" data-close aria-label="Close">×</button><h2>Share your ride</h2><p class="sub">Add your route, vehicle and trip details to find co-travellers.</p>
    <div class="fld"><label for="cFrom">From</label><input id="cFrom" data-c="fromN" value="${esc(c.fromN)}" placeholder="Enter pickup location" autocomplete="off"><div class="sugg" id="sg-cfrom" hidden></div></div>
    <div class="fld"><label for="cTo">To</label><input id="cTo" data-c="toN" value="${esc(c.toN)}" placeholder="Enter destination" autocomplete="off"><div class="sugg" id="sg-cto" hidden></div></div>
    <div class="two">${f('cVeh','Vehicle name','veh','Example: Swift, Nexon')}${f('cVno','Vehicle number','vno','AP 03 AB 1234')}</div>
    <div class="two">${f('cSeats','Available seats','seats','Enter number of seats','type="number" min="1" max="20"')}${f('cPrice','Price per seat (₹)','price','Enter amount','type="number" min="0" step="0.01"')}</div>
    ${f('cMeet','Meeting point','meet','Where should passengers meet you?')}
    <div class="two">${f('cDate','Ride date','date','','type="date" min="' + isoDay() + '"')}${f('cTime','Ride time','time','','type="time"')}</div>
    <div class="toggles"><label class="ck"><input type="checkbox" data-cb="ac" ${c.ac?'checked':''}><span>AC available<small>Air conditioning is available</small></span></label>
      <label class="ck"><input type="checkbox" data-cb="wo" ${c.wo?'checked':''}><span>Women only<small>Only women can book this ride</small></span></label></div>
    <div class="terms"><h5>Ride Creator Terms & Conditions</h5><p>By creating this ride, you agree to:</p><ul>${CT_TERMS.map(x => `<li>${x}</li>`).join('')}</ul>
      <label class="ck"><input type="checkbox" data-cb="terms" ${c.terms?'checked':''}><span>I have read and agree to the Ride Creator Terms & Conditions.</span></label></div>
    <p class="err" id="cErr" ${c.err ? '' : 'hidden'}>${esc(c.err)}</p>
    <button class="btn block" id="cGo" data-act="createGo" ${c.busy?'disabled':''}>${c.busy ? 'Processing…' : 'Create ride'}</button>
    <p class="note">A small listing fee is charged by the server (wallet first, then Razorpay). Please verify the ride details before creating.</p></div>`);
  drawSugg('cfrom'); drawSugg('cto');
}
const cErr = m => { S.C.err = m; const e = $('#cErr'); if (e) { e.textContent = m; e.hidden = !m; } };
function pickPlace(k, i){
  const p = S.sugg[k][i]; if (!p || p.none || p.err) return; S.sugg[k] = [];
  if (k === 'from') { S.from = {name:p.name, lat:p.lat, lng:p.lng}; S.curMode = false; $('#qFrom').value = p.name; S.searched = false; drawSugg('from'); render(); }
  else if (k === 'to') { S.to = {name:p.name, lat:p.lat, lng:p.lng}; $('#qTo').value = p.name; S.searched = false; drawSugg('to'); render(); }
  else if (k === 'cfrom') { Object.assign(S.C, {fromN:p.address || p.name, fromLa:p.lat, fromLo:p.lng}); renderCreate(); }
  else { Object.assign(S.C, {toN:p.address || p.name, toLa:p.lat, toLo:p.lng}); renderCreate(); }
}
async function routeInfo(a, b){
  try {
    const r = await fetch('https://routes.googleapis.com/directions/v2:computeRoutes', {method:'POST', headers:{'Content-Type':'application/json','X-Goog-Api-Key':GOOGLE_KEY,'X-Goog-FieldMask':'routes.distanceMeters,routes.duration,routes.polyline.encodedPolyline'},
      body:JSON.stringify({origin:{location:{latLng:{latitude:a[0],longitude:a[1]}}}, destination:{location:{latLng:{latitude:b[0],longitude:b[1]}}}, travelMode:'DRIVE', routingPreference:'TRAFFIC_AWARE', computeAlternativeRoutes:false, units:'METRIC'})});
    if (!r.ok) return null; const rt = (await r.json()).routes?.[0]; if (!rt) return null;
    return {meters:Number(rt.distanceMeters) || 0, points:decodePoly(rt.polyline?.encodedPolyline || '')};
  } catch(e){ return null; }
}
function decodePoly(s){
  const pts = []; let i = 0, la = 0, lo = 0;
  while (i < s.length) {
    for (const axis of [0,1]) { let res = 0, sh = 0, b;
      do { if (i >= s.length) return pts; b = s.charCodeAt(i++) - 63; res |= (b & 31) << sh; sh += 5; } while (b >= 32);
      const dv = (res & 1) ? ~(res >> 1) : (res >> 1); if (axis === 0) la += dv; else lo += dv; }
    pts.push({lat:la/1e5, lng:lo/1e5});
  }
  return pts;
}
async function createGo(){
  const c = S.C; if (!c || c.busy) return; cErr('');
  const seats = parseInt(c.seats, 10), price = parseFloat(c.price);
  if (!c.fromN.trim() || !c.toN.trim() || !c.veh.trim() || !c.vno.trim() || !c.meet.trim() || !c.date || !c.time || !c.seats || !c.price) return cErr('Please fill all ride details');
  if (!Number.isInteger(seats) || seats <= 0 || seats > 20) return cErr('Please enter valid available seats');
  if (!Number.isFinite(price) || price < 0) return cErr('Please enter a valid price');
  if (!c.terms) return cErr('Please read and accept the Ride Creator Terms & Conditions before payment.');
  const when = new Date(`${c.date}T${c.time}:00`); if (!(when > new Date())) return cErr('Please select a future date and time');
  if (!S.user) return openLogin(openCreate);
  c.busy = true; $('#cGo').disabled = true; $('#cGo').textContent = 'Processing…';
  try {
    const token = await S.user.getIdToken(true), from = c.fromN.trim(), to = c.toN.trim();
    const r = await api('/trip/create-order', token, {group_pricing_version:PRICING_V, trip_creation_fee:1, coupon_code:'', amount:1,
      trip_data:{tripName:`${from} to ${to}`, tripStartLocation:from, tripEndLocation:to, from, to, meetingLocation:c.meet.trim(), meetingPoint:c.meet.trim(), tripDate:when.toISOString(),
        vehicle:c.veh.trim(), vehicleNumber:c.vno.trim().toUpperCase(), seatsAvailable:seats, availableSeats:seats, totalSeats:seats, price, acAvailable:c.ac, womenOnly:c.wo}});
    if (!okRes(r)) throw new Error(apiMsg(r.j, 'Unable to start payment right now. Please try again.'));
    const j = r.j, fee = num(j.total_fee) ?? 50, intentId = String(j.intent_id || '');
    if (!intentId) throw new Error('Payment intent is missing.');
    const P = {intentId, fee, paid:false, snap:{...c}, when, seats, price};
    S.pending = P;
    if (j.requires_razorpay !== true) {
      dlg.close(); $('#busyT').textContent = 'Creating your ride'; busy.showModal();
      return verifyCreate(P, {payment_mode:'wallet', intent_id:intentId});
    }
    const orderId = String(j.order_id || ''), keyId = String(j.key_id || ''), rzpAmt = num(j.razorpay_amount) ?? 0;
    if (!orderId || !keyId || rzpAmt <= 0) throw new Error('Payment service is temporarily unavailable. Please try again later.');
    if (typeof window.Razorpay !== 'function') throw new Error('Payment checkout is still loading. Please try again.');
    dlg.close();
    const rz = new window.Razorpay({key:keyId, amount:Math.round(rzpAmt * 100), currency:j.currency || 'INR', order_id:orderId, name:'TripMate', description:'Ride Creation Fee',
      prefill:{contact:S.user.phoneNumber || '', email:S.user.email || ''}, theme:{color:'#F26B2A'},
      handler: resp => { P.paid = true; $('#busyT').textContent = 'Creating your ride'; busy.showModal(); verifyCreate(P, {razorpay_payment_id:resp.razorpay_payment_id, razorpay_order_id:resp.razorpay_order_id, razorpay_signature:resp.razorpay_signature, intent_id:intentId}); },
      modal:{ondismiss: () => { if (S.pending === P && !P.paid) { S.pending = null; toast('Payment failed. Please try again.'); } }}});
    rz.on('payment.failed', () => { if (S.pending === P) { S.pending = null; toast('Payment failed. Please try again.'); } });
    rz.open();
  } catch(e){ console.error('CREATE ORDER ERROR', e); S.pending = null; c.busy = false; if (dlg.open && $('#cGo')) { $('#cGo').disabled = false; $('#cGo').textContent = 'Create ride'; cErr(e.message || 'Unable to start payment. Please try again.'); } else toast(e.message || 'Unable to start payment.'); }
}
async function verifyCreate(P, body){
  try {
    const token = await S.user.getIdToken(true), r = await api('/trip/verify-payment', token, body);
    if (!okRes(r, true)) throw new Error('We could not verify your payment yet. Please do not pay again. Try again shortly.');
    await createRideDoc(P);
  } catch(e){ console.error('CREATE VERIFY ERROR', e); busy.close(); toast(e.message || 'We could not verify your payment yet. Please do not pay again.'); }
  finally { S.pending = null; }
}
async function createRideDoc(P){
  const c = P.snap, u = S.user;
  try {
    let pLa = c.fromLa, pLo = c.fromLo, dLa = c.toLa, dLo = c.toLo;
    if (!pLa || !pLo) { const g = await geocode(c.fromN); if (!g) throw new Error('Unable to find the selected locations'); pLa = g.lat; pLo = g.lng; }
    if (!dLa || !dLo) { const g = await geocode(c.toN); if (!g) throw new Error('Unable to find the selected locations'); dLa = g.lat; dLo = g.lng; }
    const ud = (await getDoc(doc(db,'users',u.uid))).data() || {};
    if ((Number(ud.walletBalance) || 0) < 0) throw new Error('Your wallet balance is negative. Please clear your dues before creating a new ride.');
    const pick = (...v) => { for (const x of v) { const t = x == null ? '' : String(x).trim(); if (t && t.toLowerCase() !== 'null') return t; } return ''; };
    const dName = pick(ud.name, ud.fullName, ud.displayName, u.displayName), dPhoto = pick(ud.profilePhoto, ud.photoUrl, ud.photoURL, u.photoURL), dPhone = pick(ud.phone, ud.phoneNumber, u.phoneNumber);
    const ri = await routeInfo([pLa,pLo],[dLa,dLo]), distanceKm = ri && ri.meters > 0 ? ri.meters/1000 : km(pLa,pLo,dLa,dLo);
    const hr = P.when.getHours(), t12 = `${hr % 12 || 12}:${String(P.when.getMinutes()).padStart(2,'0')} ${hr >= 12 ? 'PM' : 'AM'}`;
    await addDoc(collection(db,'trips'), {driverId:u.uid, driverName:dName, creatorName:dName, driverPhoto:dPhoto, creatorPhoto:dPhoto, driverPhone:dPhone, creatorPhone:dPhone,
      from:c.fromN.trim(), to:c.toN.trim(), pickupLat:pLa, pickupLng:pLo, dropLat:dLa, dropLng:dLo, routePoints:ri ? ri.points : [], distanceKm,
      vehicle:c.veh.trim(), vehicleNumber:c.vno.trim().toUpperCase(), seats:P.seats, availableSeats:P.seats, totalSeats:P.seats, price:P.price, meetingPoint:c.meet.trim(),
      rideDate:Timestamp.fromDate(P.when), rideTime:t12, acAvailable:c.ac, womenOnly:c.wo, status:'active', createdAt:serverTimestamp()});
    await setDoc(doc(db,'users',u.uid), {tripCount:increment(1), kmTravelled:increment(distanceKm)}, {merge:true});
    busy.close(); S.C = null;
    show(`<div class="d win"><div class="big">✓</div><h2>Your ride is live!</h2><p class="sub">Ride created successfully. Passengers can now discover and book your ride.</p>
      <div class="box"><b>${esc(c.fromN)} → ${esc(c.toN)}</b><div>${esc(c.veh)} · ${fmtDate(P.when)}, ${fmtTime(P.when)}</div><div>${esc(c.meet)}</div><span class="ok">₹${rs(P.fee)} Payment successful</span></div>
      <button class="btn block" data-close>Done</button></div>`);
  } catch(e){ console.error('CREATE RIDE ERROR', e); busy.close(); toast(e.message || 'Unable to create ride. Please try again.'); }
}

/* ============ EVENTS ============ */
document.addEventListener('click', async e => {
  if (!e.target.closest('.f1,.fld')) document.querySelectorAll('.sugg').forEach(b => b.hidden = true);
  const el = e.target.closest('[data-open],[data-filter],[data-close],[data-act],[data-join],[data-pick]'); if (!el) return;
  const d = el.dataset;
  if ('close' in d) return dlg.close();
  if (d.pick) { const [k,i] = d.pick.split(':'); return pickPlace(k, +i); }
  if (d.join) return joinTrip(d.join);
  if (d.open) { const t = S.trips.find(x => x.id === d.open); return t && detail(t); }
  if (d.filter) { S.filter = d.filter; return render(); }
  switch (d.act) {
    case 'locate': S.loc = 'asking'; render(); return locate();
    case 'reload': return location.reload();
    case 'clear': e.preventDefault(); return clearSearch();
    case 'create': return openCreate();
    case 'useLoc': {
      if (!S.pos) { locate(); return toast('Getting your current location…'); }
      S.from = {name:S.place || 'Current Location', lat:S.pos.lat, lng:S.pos.lng}; S.curMode = true; S.to = null; $('#qTo').value = '';
      $('#qFrom').value = S.from.name; S.sugg.from = []; drawSugg('from'); return doSearch();
    }
    case 'sendOtp': return sendOtp();
    case 'verifyOtp': return verifyOtp();
    case 'changePhone': return loginStep1();
    case 'seatPlus': if (S.bk && S.bk.seats < S.bk.trip.seats) { S.bk.seats++; S.bk.pax.push({name:'',age:''}); renderPax(); updateBooking(); } return;
    case 'seatMinus': if (S.bk && S.bk.seats > 1) { S.bk.seats--; S.bk.pax.pop(); renderPax(); updateBooking(); } return;
    case 'pay': return startBooking();
    case 'createGo': return createGo();
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('[data-pax]') && S.bk) S.bk.pax[+t.dataset.pax][t.dataset.f] = t.value;
  else if (t.dataset.c && S.C) {
    const k = t.dataset.c; S.C[k] = t.value;
    if (k === 'fromN') { S.C.fromLa = 0; S.C.fromLo = 0; suggest('cfrom', t.value); }
    if (k === 'toN') { S.C.toLa = 0; S.C.toLo = 0; suggest('cto', t.value); }
  }
});
document.addEventListener('change', e => { const t = e.target; if (t.dataset.cb && S.C) S.C[t.dataset.cb] = t.checked; });
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.t-top')) { e.preventDefault(); e.target.click(); }
  if (e.key === 'Enter' && e.target.id === 'ph') { e.preventDefault(); sendOtp(); }
  if (e.key === 'Enter' && e.target.id === 'otp') { e.preventDefault(); verifyOtp(); }
});
dlg.addEventListener('click', e => { if (e.target === dlg && !(S.C && S.C.busy)) dlg.close(); });
busy.addEventListener('cancel', e => e.preventDefault());

$('#qFrom').addEventListener('input', e => { S.from = null; S.curMode = false; S.searched = false; suggest('from', e.target.value); render(); });
$('#qTo').addEventListener('input', e => { S.to = null; S.searched = false; suggest('to', e.target.value); render(); });
$('#date').addEventListener('change', e => { S.date = e.target.value || isoDay(); S.searched = false; render(); });
$('#searchForm').addEventListener('submit', e => { e.preventDefault(); doSearch(); });
$('#searchForm').addEventListener('reset', () => setTimeout(() => { Object.assign(S,{from:null,to:null,curMode:false,searched:false,date:isoDay()}); $('#date').value = S.date; S.sugg.from = []; S.sugg.to = []; drawSugg('from'); drawSugg('to'); render(); }));
$('#createBtn').addEventListener('click', openCreate);
$('#authBtn').addEventListener('click', async () => { if (S.user) { try { await signOut(auth); toast('Signed out.'); } catch(e){ toast('Could not sign out.'); } } else openLogin(null); });
$('#themeBtn').addEventListener('click', () => {
  const root = document.documentElement, dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark'; try { localStorage.setItem('tr_theme', root.dataset.theme); } catch(e){}
});

/* ============ INIT ============ */
$('#yr').textContent = new Date().getFullYear();
S.date = isoDay(); $('#date').value = S.date; $('#date').min = S.date;
render(); subscribe(); locate();
setInterval(render, 60000);
</script>
