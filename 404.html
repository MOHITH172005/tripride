<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>TRIPRIDE</title>
</head>
<body>
<script>
  const match = window.location.pathname.match(
    /^\/invite\/([A-Za-z]{1,4}[0-9]{4})\/?$/
  );

  if (match) {
    const code = match[1].toUpperCase();

    const playStoreUrl =
      'https://play.google.com/store/apps/details?id=com.tripride.app' +
      '&referrer=' +
      encodeURIComponent('referral_code=' + code);

    window.location.replace(playStoreUrl);
  } else {
    window.location.replace('/');
  }
</script>
</body>
</html>
