  m.innerHTML=`<div class="hero" style="background:linear-gradient(135deg,#2563EB,#4F46E5,#7C3AED)"><span class="ms" style="font-size:34px">card_giftcard</span><h2 style="margin:14px 0 6px;font-size:24px">Invite friends &amp; earn</h2><p style="color:#ffffffbb;line-height:1.5">Hi ${esc(ft(me.name,"Traveler"))}! Your friend gets ₹25 and you get ₹25 after successful registration.</p><div class="row" style="margin-top:16px"><div class="grow" style="background:#ffffff1f;border-radius:16px;padding:12px"><small style="margin:0">You get</small><b style="display:block;font-size:18px">₹25</b></div><div class="grow" style="background:#ffffff1f;border-radius:16px;padding:12px"><small style="margin:0">Friend gets</small><b style="display:block;font-size:18px">₹25</b></div></div><div class="row" style="background:#ffffff1f;border-radius:16px;padding:10px 12px;margin-top:14px"><span class="ms" style="font-size:19px">link</span><span class="grow" style="font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(link)}</span><button id="cl" style="color:#fff"><span class="ms" style="font-size:19px">content_copy</span></button></div></div>
  <div class="grid3"><div><b>${done.length}</b><small>Successful</small></div><div><b>${pend}</b><small>Pending</small></div><div><b>₹${earned}</b><small>Earned</small></div></div>
  <div class="sect">YOUR REFERRAL CODE</div><div class="card row"><div class="ib" style="background:#F5F3FF;color:#7C3AED"><span class="ms">confirmation_number</span></div><div class="grow"><small>Your code</small><br><b>Share this code with friends</b></div><b style="color:#7C3AED;letter-spacing:1.1px">${esc(c)}</b><button id="cc" style="color:#7C3AED"><span class="ms">content_copy</span></button></div>
  <div class="sect">HOW IT WORKS</div><div class="card">${steps.map((s,i)=>`<div class="row" style="padding:10px 0"><div class="ib" style="width:42px;height:42px;background:#EFF6FF;color:#2563EB"><span class="ms">${s[0]}</span></div><div class="grow"><b style="font-size:14px">${s[1]}</b><br><small>${s[2]}</small></div><b style="color:#CBD5E1">0${i+1}</b></div>`).join("")}</div>
  <div class="sect">YOUR REFERRALS</div>${refs.length?`<div class="card">${refs.slice(0,10).map(r=>{const ok=String(r.status).toLowerCase()==="completed";return `<div class="row" style="padding:9px 0"><div class="ib" style="width:42px;height:42px;background:${ok?"#ECFDF5":"#FFF7ED"};color:${ok?"#16A34A":"#F59E0B"}"><span class="ms">${ok?"check_circle":"hourglass_bottom"}</span></div><b class="grow">${esc(ft(r.referredUserName,"Referred user"))}</b><b style="color:${ok?"#16A34A":"#F59E0B"}">${ok?"+₹25":"Pending"}</b></div>`}).join("")}</div>`:`<div class="card" style="text-align:center"><b>No referrals yet</b><p class="mut" style="margin-top:4px">Share your invite link and start earning ₹25.</p></div>`}
  <div class="card mut" style="font-size:11.5px;line-height:1.45;background:#F8FAFC">Rewards are credited only after a valid new registration is completed. Self-referrals and duplicate rewards are not eligible.</div>
  <button class="btn" id="sh"><span class="ms" style="vertical-align:middle">share</span> SHARE INVITE LINK</button>`;
  m.querySelector("#cl").onclick=()=>copy(link,"Invite link copied");m.querySelector("#cc").onclick=()=>copy(c,"Referral code copied");
  m.querySelector("#sh").onclick=async()=>{const text=`🎁 Join TRIPRIDE with my invite!\n\nUse my referral code: ${c}\n\nYou get ₹25 and I get ₹25 after you complete registration.\n\n${link}`;try{if(navigator.share)await navigator.share({title:"Join TRIPRIDE & get ₹25",text});else copy(text,"Invite copied")}catch{}};
 };
 draw();
 F.onSnapshot(F.doc(db,"users",u.uid),s=>{me=s.data()||{};draw()},e=>toast("Unable to load your profile."));
 F.onSnapshot(F.query(F.collection(db,"referrals"),F.where("referrerId","==",u.uid)),s=>{refs=s.docs.map(d=>d.data());draw()},e=>console.warn(e));
}));
</script></body></html>
