    veh = first([t.vehicle,t.vehicleName,t.vehicleType,t.carModel]), seats = num([t.availableSeats,t.seatsAvailable,t.remainingSeats,t.seats]);
  [[tr("From"),from(t)],[tr("To"),to(t)],date&&[tr("Date & Time"),fmtDT(date)],price>0&&[tr("Price"),"₹"+money(price)],seats>0&&[tr("Available Seats"),money(seats)],veh&&[tr("Vehicle"),veh],[tr("Trip ID"),tid]]
    .filter(Boolean).forEach(([k,v]) => { const d = el("div","dt"); d.append(el("small",null,k), el("b",null,v)); sh.append(d); });
  $("ov").classList.add("show");
}
$("ov").onclick = e => { if (e.target.id === "ov") $("ov").classList.remove("show"); };
function ask(title, msg, ok){ return new Promise(res => { $("cfT").textContent = title; $("cfM").textContent = msg; $("cfYes").textContent = ok; $("cfNo").textContent = tr("Cancel");
  $("cf").classList.add("show"); const d = v => { $("cf").classList.remove("show"); res(v); }; $("cfNo").onclick = () => d(false); $("cfYes").onclick = () => d(true); }); }
async function removeSaved(id){
  if (!(await ask(tr("Remove Saved Trip?"), tr("This trip will be removed from your saved trips."), tr("Remove")))) return;
  try { await deleteDoc(doc(db,"users",uid,"saved_trips",id)); toast(tr("Trip removed from saved trips.")); }
  catch(e){ console.error("REMOVE", e); toast(tr("Unable to remove this trip right now. Please try again.")); }
}
function watchTrip(sd){
  const id = sd.id, s = sd.data(), tid = txt(s.tripId); if (!tid || subs[id]) return;
  trips[id] = { s:"loading" };
  subs[id] = onSnapshot(doc(db, normType(s.tripType) === "group" ? "group_trips" : "trips", tid),
    x => { trips[id] = x.exists() && x.data() ? { s:"ok", d:x.data() } : { s:"missing" }; render(); },
    e => { console.warn("TRIP", e); trips[id] = { s:"err" }; render(); });
}
onAuthStateChanged(auth, user => {
  if (!user) { location.replace(LOGIN_URL); return; }
  uid = user.uid;
  onSnapshot(collection(db,"users",uid,"saved_trips"), snap => {
    saved = snap.docs.slice().sort((a,b) => ms(b.data().savedAt) - ms(a.data().savedAt));
    Object.keys(subs).forEach(k => { if (!snap.docs.some(d => d.id === k)) { subs[k](); delete subs[k]; delete trips[k]; } });
    saved.forEach(watchTrip); loaded = true; failed = false; render();
  }, e => { console.warn("SAVED", e); failed = true; render(); });
});
</script>
