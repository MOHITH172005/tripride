const prio=d=>{const s=hst(d).toLowerCase();return /complete|return|success/.test(s)?3:/accept|active/.test(s)?2:1};
const sdate=d=>fv(d.completedAt,d.returnDateTime,d.returnDate,d.endDateTime,d.endDate,d.rideDateTime,d.rideDate,d.pickupDateTime,d.pickupDate,d.startDateTime,d.startDate,d.bookingDate,d.createdAt,d.updatedAt);
const prev=(trip,bk,fs)=>{const s=ft(bk.bookingStatus,trip.status).toLowerCase();if(s.includes("cancel"))return false;if(s.includes("complete"))return true;let d=null;for(const f of fs){if(trip[f]!=null){d=trip[f];break}if(bk[f]!=null){d=bk[f];break}}const t=d?.toDate?d.toDate():d?new Date(d):null;return !t||isNaN(t)||t<new Date()};
const loading=m=>m.innerHTML='<div class="empty"><div class="spin" style="margin:auto"></div></div>';
boot(tr("Ride History"),u=>push(tr("Ride History"),m=>{
 m.innerHTML=`<h2 class="h2">Your Ride History</h2><p class="sub">View your previous TripRide journeys and booking details.</p>`;
 m.append(cat({icon:"groups",color:"#059669",bg:"#ECFDF5",title:"Trips Ride History",sub:"View your previous trip bookings and journey details.",go:()=>pairList("trip")}));
 m.append(cat({icon:"route",title:"Place to Place History",sub:"View your previous direct rides and payment details.",go:()=>pairList("place")}));
 SV.forEach(([s,i,c,b])=>m.append(cat({icon:i,color:c,bg:b,title:s+" History",sub:`View your previous ${s} ${/Rental/.test(s)?"bookings and details":"rides and payment details"}.`,go:()=>svcList(s,i)})));

 function pairList(k){const p=P[k],g=k==="trip";push(g?"Trips Ride History":"Place to Place History",async m=>{loading(m);
  try{const bs=await getDocs(query(collection(db,p.b),where(p.f,"==",u.uid))),cache={},items=[];
   for(const b of bs.docs){const bk=b.data(),tid=ft(bk.tripId);if(!tid)continue;if(!(tid in cache)){try{const s=await getDoc(doc(db,p.t,tid));cache[tid]=s.exists()?s.data():{}}catch{cache[tid]={}}}
    if(prev(cache[tid],bk,p.df))items.push({id:b.id,bk,trip:cache[tid]})}
   items.sort((a,b)=>ms(b.bk.createdAt)-ms(a.bk.createdAt));m.textContent="";
   if(!items.length)return m.innerHTML=empty(g?"groups":"route",g?"No trip history":"No place to place history",g?"Your previous trip rides will appear here.":"Your previous direct rides will appear here.");
   items.forEach(({id,bk,trip})=>{const o=pv(g,bk,trip);m.append(rcard({icon:g?"groups":"route",color:g?"#059669":"#2563EB",bg:g?"#ECFDF5":"#EFF6FF",title:o.title,status:o.status,from:o.from,to:o.to,who:o.who,photo:o.photo,amt:o.amt,lines:o.date?[["calendar_month",fdt(o.date)]]:[]},()=>pairDetail(g,id,bk,trip,o)))})
  }catch(e){console.error(e);m.innerHTML=empty("cloud_off","Unable to load history","Check your internet connection and try again.")}})}
 function pv(g,bk,t){const from=g?ft(t.tripStartLocation,t.from,t.meetingLocation,"Starting Point"):ft(t.from,t.pickupLocation,bk.from,"Pickup"),to=g?ft(t.destination,t.to,t.tripEndLocation,t.tripName,"Destination"):ft(t.to,t.dropLocation,bk.to,"Destination");
  return{from,to,title:g?ft(t.tripName,bk.tripName,"Trip"):`${from} → ${to}`,who:g?ft(t.creatorName,bk.creatorName,"Trip Organizer"):ft(bk.driverName,t.driverName,t.creatorName,"Driver"),photo:g?ft(t.creatorPhoto,t.profilePhoto,bk.creatorPhoto):ft(t.driverPhoto,t.creatorPhoto,t.profilePhoto,bk.driverPhoto),date:g?fv(t.tripDate,t.startDate,t.rideDate,bk.tripDate):fv(t.rideDate,t.tripDate,bk.rideDate),status:ft(bk.bookingStatus,t.status,"Completed"),amt:g?fn(bk.totalAmount,bk.amount,t.tripCost,t.price):fn(bk.tripPrice,bk.totalAmount,t.price)}}
 function pairDetail(g,id,bk,t,o){push("Ride Details",m=>{
  const fee=fn(bk.bookingFee,bk.bookingAmount),tot=fn(bk.totalAmount,bk.tripPrice,bk.amount,t.tripCost,t.price),rem=fn(bk.remainingAmount,bk.remainingPayment),veh=ft(t.vehicle,t.vehicleName,t.vehicleType,t.carModel);
  m.innerHTML=hero(g?"Trip":"Place to Place",o.status,o.from,o.to,[o.date&&fdt(o.date)])+
  sec(g?"Trip Organizer":"Driver",[["Name",o.who]])+
  sec("Ride Information",[["From",o.from],["To",o.to],o.date&&["Ride Date",fdt(o.date)],veh&&["Vehicle",veh],["Status",o.status]])+
  sec("Payment Details",[tot>0&&["Ride Price","₹"+tot.toFixed(2)],fee>0&&["Booking Fee","₹"+fee.toFixed(2)],rem>0&&["Remaining Amount","₹"+rem.toFixed(2)],["Payment Status",ft(bk.paymentStatus,bk.payment_status,"Not available")],["Payment Method",ft(bk.paymentMethod,bk.payment_method,"Not available")],["Payment ID",ft(bk.paymentId,bk.razorpay_payment_id,bk.razorpayPaymentId,"Not available")]])+
  sec("Booking Information",[["Booking ID",id],["Trip ID",ft(bk.tripId,t.tripId,"Not available")],["Booked On",fdt(fv(bk.createdAt,bk.bookedAt))]])})}

 function svcList(s,icon){push(s+" History",async m=>{loading(m);
  try{let items;
   if(/Taxi/.test(s))items=(await scanTaxi(s,u.uid,{trips:true,ok:d=>isH(hst(d)),prio})).map(x=>({id:x.id,d:x.data,path:x.path}));
   else items=(await getDocs(collection(db,"bookings"))).docs.filter(x=>{const d=x.data();return matches(d,s)&&belongs(d,u.uid)&&isH(hst(d))}).map(x=>({id:x.id,d:x.data(),path:x.ref.path}));
   items.sort((a,b)=>ms(sdate(b.d))-ms(sdate(a.d)));m.textContent="";
   if(!items.length)return m.innerHTML=empty(icon,`No ${s} history`,`Your completed ${s} bookings will appear here.`);
   items.forEach(it=>{const d=it.d,from=svF(d),to=svT(d);m.append(rcard({icon,title:s,status:hst(d),from,to,who:ft(d.driverName,d.captainName,d.ownerName,d.partnerName,"TripRide Partner"),amt:fn(d.finalFare,d.fare,d.totalAmount,d.tripFare,d.amount,d.totalPrice,d.tripPrice,d.rentalTotal,d.ownerPayout),lines:[["directions_car",ft(d.vehicleName,d.vehicleModel,d.vehicleType,d.carModel,d.bikeModel,d.rideType)],["calendar_month",sdate(d)?fdt(sdate(d)):"Date not available"]].filter(l=>l[1])},()=>svcDetail(s,icon,it)))})
  }catch(e){console.error(e);m.innerHTML=empty("cloud_off","Unable to load history","Please check your internet connection and try again.")}})}
 const svF=d=>ft(d.pickupAddress,d.pickupLocationName,d.pickupLocation,d.pickup,d.from,d.startLocation,"Pickup"),svT=d=>ft(d.destinationAddress,d.dropAddress,d.destinationLocationName,d.destinationLocation,d.destination,d.dropLocation,d.to,"Destination");
 function svcDetail(s,icon,{id,d,path}){push(s+" Details",m=>{
  const amt=fn(d.finalFare,d.fare,d.totalAmount,d.tripFare,d.amount,d.totalPrice,d.tripPrice,d.rentalTotal),fee=fn(d.bookingFee,d.bookingCharge,d.onlineAmount),date=sdate(d),veh=ft(d.vehicleName,d.vehicleModel,d.vehicleType,d.carModel,d.bikeModel,d.rideType);
  m.innerHTML=hero(s,hst(d),svF(d),svT(d),[date&&fdt(date)])+
  sec("Ride Information",[["From",svF(d)],["To",svT(d)],veh&&["Vehicle",veh],["Captain / Partner",ft(d.driverName,d.captainName,d.customerDriverName,d.ownerName,d.partnerName,"TripRide Partner")],["Status",hst(d)]])+
  sec("Payment Details",[amt>0&&["Total Amount","₹"+amt.toFixed(2)],fee>0&&["Booking Charge","₹"+fee.toFixed(2)],["Payment Status",ft(d.paymentStatus,d.payment_status,"Not available")],["Payment Method",ft(d.paymentMethod,d.payment_method,d.paymentMode,"Not available")],["Payment ID",ft(d.paymentId,d.razorpayPaymentId,d.razorpay_payment_id,"Not available")]])+
  sec("Booking Information",[["Booking ID",id],["Source",path]])})}
}));
</script></body></html>
