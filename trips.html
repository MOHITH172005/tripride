<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trips: Travel Together | Tripride</title>
<meta name="description" content="Find trips going where you are going. Browse freely, log in to book your seat.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B2239; --muted:#5B7083; --sky:#0F8BD0; --sky-d:#0A6DA6; --sky-l:#E6F4FC;
  --sun:#FF6B35; --sun-d:#E5551F; --bg:#F2F6F9; --card:#fff; --line:#D9E4EC;
  --ok:#15803D; --bad:#B91C1C; --r:18px;
  --sans:'DM Sans',system-ui,sans-serif; --serif:'Playfair Display',Georgia,serif;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.wrap{width:min(1120px,100% - 32px);margin-inline:auto}

/* Header */
.nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
.brand{font-family:var(--serif);font-weight:800;font-size:1.35rem;letter-spacing:.02em;text-decoration:none;color:var(--ink)}
.brand b{color:var(--sky)}
.nav-r{display:flex;align-items:center;gap:10px}
.nav-link{color:var(--muted);text-decoration:none;font-weight:500;font-size:.95rem;padding:8px 10px}
.user{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.9rem}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--sky);color:#fff;display:grid;place-items:center;font-weight:700}

/* Buttons */
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:700;background:var(--sky);color:#fff;transition:background .15s,transform .1s}
.btn:hover{background:var(--sky-d)} .btn:active{transform:scale(.98)}
.btn.sun{background:var(--sun)} .btn.sun:hover{background:var(--sun-d)}
.btn.ghost{background:transparent;color:var(--sky-d);border:1.5px solid var(--sky)}
.btn.ghost:hover{background:var(--sky-l)}
.btn.sm{padding:8px 14px;font-size:.9rem}
.btn.block{width:100%;padding:14px}
.btn:disabled{opacity:.55;cursor:not-allowed}

/* Hero */
.hero{background:linear-gradient(160deg,#0B2239 0%,#0A4C7A 60%,#0F8BD0 100%);color:#fff;padding:56px 0 84px}
.hero h1{font-family:var(--serif);font-size:clamp(2.1rem,5vw,3.6rem);line-height:1.08;max-width:15ch}
.hero p{margin-top:14px;max-width:46ch;color:#CFE6F5;font-size:1.05rem}
.search{margin-top:-46px;position:relative;z-index:5;background:var(--card);border-radius:20px;padding:14px;box-shadow:0 18px 40px rgba(11,34,57,.14);display:grid;grid-template-columns:1.6fr 1fr 1fr auto;gap:10px}
.search label{display:block;font-size:.75rem;font-weight:700;color:var(--muted);margin:0 0 4px 4px}
.search input,.search select{width:100%;height:46px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;background:#fff}
.search input:focus,.search select:focus{border-color:var(--sky);outline:none}
.search .btn{align-self:end;height:46px}

/* Guest banner */
.guest{margin-top:18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--sky-l);border:1px solid #BFE0F3;border-radius:14px;padding:12px 16px;font-size:.95rem}
.guest span{flex:1;min-width:220px}

/* Chips */
.bar{margin:26px 0 8px;display:flex;flex-direction:column;gap:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 15px;font-weight:500;font-size:.9rem;color:var(--muted)}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.count{color:var(--muted);font-size:.9rem}

/* Ticket cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:20px;margin:16px 0 56px}
.ticket{position:relative;background:var(--card);border-radius:var(--r);border:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;transition:box-shadow .2s,transform .2s}
.ticket:hover{box-shadow:0 14px 30px rgba(11,34,57,.10);transform:translateY(-2px)}
.t-top{padding:18px 18px 14px;cursor:pointer;flex:1}
.who{display:flex;align-items:center;gap:10px}
.who .avatar{width:38px;height:38px;background:var(--sky-l);color:var(--sky-d)}
.who small{display:block;color:var(--muted);font-size:.78rem}
.who strong{font-size:.95rem}
.ver{color:var(--sky);margin-left:4px}
.t-top h3{font-family:var(--serif);font-size:1.3rem;line-height:1.2;margin:14px 0 14px}
.route{position:relative;padding-left:26px;display:grid;gap:16px}
.route::before{content:"";position:absolute;left:7px;top:9px;bottom:9px;border-left:2px dashed #A9C4D6}
.stop{position:relative;font-weight:500;font-size:.93rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stop::before{content:"";position:absolute;left:-26px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--ok)}
.stop.end::before{border-color:var(--sun);background:var(--sun)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.tag{background:#EEF3F7;color:#3B5368;border-radius:999px;padding:4px 10px;font-size:.78rem;font-weight:700}
.tag.warn{background:#FFF1E8;color:#B4460F}
.perf{position:relative;border-top:2px dashed var(--line);margin:0 12px}
.perf::before,.perf::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.perf::before{left:-23px}.perf::after{right:-23px}
.t-bot{padding:14px 18px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.price{font-size:1.5rem;font-weight:800;line-height:1}
.price small{display:block;font-size:.72rem;font-weight:500;color:var(--muted);margin-top:4px}

.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
/* Empty */
.empty{text-align:center;padding:60px 20px;background:#fff;border:1px dashed var(--line);border-radius:var(--r);margin:16px 0 56px}
.empty h3{font-family:var(--serif);font-size:1.4rem;margin-bottom:6px}
.empty p{color:var(--muted);margin-bottom:16px}

/* Dialog */
dialog{border:0;border-radius:24px;padding:0;width:min(520px,calc(100% - 24px));max-height:92vh;box-shadow:0 30px 80px rgba(11,34,57,.35);overflow:auto;background:#fff;color:var(--ink)}
dialog::backdrop{background:rgba(11,34,57,.6);backdrop-filter:blur(3px)}
.d{padding:26px 24px 24px;position:relative}
.d h2{font-family:var(--serif);font-size:1.6rem;line-height:1.15;margin:0 36px 6px 0}
.d .sub{color:var(--muted);margin-bottom:18px}
.x{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;border:0;background:#EEF3F7;font-size:1.2rem}
.f{margin-bottom:12px}
.f label{display:block;font-size:.8rem;font-weight:700;color:var(--muted);margin-bottom:4px}
.f input{width:100%;height:46px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px}
.f input:focus{border-color:var(--sky);outline:none}
.row2{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.phone{display:flex;gap:8px}.phone span{display:grid;place-items:center;padding:0 12px;border:1.5px solid var(--line);border-radius:12px;background:#F7FAFC;font-weight:700}
.msg{font-size:.85rem;font-weight:700;margin:6px 0 0;min-height:1.2em}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.pax{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:#FAFCFD}
.pax b{font-size:.78rem;color:var(--muted);display:block;margin-bottom:6px}
.stepper{display:flex;align-items:center;justify-content:space-between;margin:14px 0}
.stepper div{display:flex;align-items:center;gap:14px;font-weight:800;font-size:1.2rem}
.stepper button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--sky);background:#fff;color:var(--sky-d);font-size:1.2rem;font-weight:700}
.stepper button:disabled{opacity:.35}
.coupon{display:flex;gap:8px}.coupon input{flex:1;height:44px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;text-transform:uppercase}
.sum{background:#F7FAFC;border-radius:14px;padding:12px 14px;margin:14px 0}
.sum div{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:.93rem}
.sum .tot{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-weight:800;font-size:1.05rem}
.terms{display:flex;gap:10px;align-items:flex-start;font-size:.85rem;margin:12px 0;color:#334155}
.terms input{margin-top:3px;width:18px;height:18px;flex:none}
.note{font-size:.78rem;color:var(--muted);text-align:center;margin-top:10px}
.detail{display:grid;margin:16px 0}
.detail div{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.93rem}
.detail span{color:var(--muted)}.detail b{text-align:right}
.done{text-align:center;padding:10px 0}
.done h2{margin-right:0}
.tick{width:84px;height:84px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:2.6rem;margin:6px auto 16px;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}

/* Toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:500;font-size:.92rem;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

footer{border-top:1px solid var(--line);padding:26px 0;color:var(--muted);font-size:.88rem;text-align:center}

@media (max-width:820px){.search{grid-template-columns:1fr 1fr}.search .f1,.search .btn{grid-column:1/-1}.nav-link{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto}}
</style>
</head>
<body>

<header class="nav">
  <div class="wrap">
    <a href="index.html" class="brand">TRIP<b>RIDE</b></a>
    <div class="nav-r">
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link" href="place-to-place.html">Place to Place</a>
      <a class="nav-link" href="support.html">Support</a>
      <div id="authSlot"></div>
    </div>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <h1>Don’t travel alone. Travel together.</h1>
    <p>See trips going where you are going. Browse freely, then log in to book your seat.</p>
  </div>
</section>

<main class="wrap">
  <form class="search" id="searchForm" autocomplete="off">
    <div class="f1"><label for="q">Destination</label><input id="q" placeholder="Goa, Hampi, Coorg…"></div>
    <div><label for="date">Date</label><input id="date" type="date"></div>
    <div><label for="maxp">Max price per seat</label>
      <select id="maxp"><option value="">Any</option><option value="1000">Up to ₹1,000</option><option value="2000">Up to ₹2,000</option><option value="4000">Up to ₹4,000</option><option value="8000">Up to ₹8,000</option></select></div>
    <button class="btn" type="reset">Reset</button>
  </form>

  <div id="guestBanner"></div>

  <div class="bar">
    <div class="chips" id="quick" role="group" aria-label="Quick filters"></div>
    <div class="chips" id="cats" role="group" aria-label="Categories"></div>
    <p class="count" id="count" aria-live="polite"></p>
  </div>

  <div id="list"></div>
</main>

<footer><div class="wrap">© <span id="yr"></span> Tripride. Travel Beyond Ordinary.</div></footer>

<dialog id="dlg"></dialog>
<div id="recaptcha"></div>
<div class="toast" id="toast" role="status"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getFirestore, collection, query, where, orderBy, onSnapshot, Timestamp, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
import { getAuth, onAuthStateChanged, signInWithPhoneNumber, RecaptchaVerifier, signOut } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';

/* ============ FIREBASE CONFIG ============
   Firebase Console > Project settings > Your apps > Web app > paste the config here.
   Until it is filled, the page runs in DEMO mode with sample data. */
const FIREBASE_CONFIG = {
  apiKey: 'YOUR_API_KEY',
  authDomain: 'YOUR_PROJECT.firebaseapp.com',
  projectId: 'YOUR_PROJECT_ID',
  appId: 'YOUR_APP_ID'
};
const LIVE = !FIREBASE_CONFIG.apiKey.startsWith('YOUR_');
const fbApp = LIVE ? initializeApp(FIREBASE_CONFIG) : null;
const db = LIVE ? getFirestore(fbApp) : null;
const fbAuth = LIVE ? getAuth(fbApp) : null;

(() => {

/* ============ CONFIG (mirrors the Flutter app) ============ */
const CATEGORIES = ['Car Trips','Bike Trips','Beach','Trekking','Temple','Adventure','Weekend'];
const QUICK = ['All','Today','Upcoming','Car','Bike'];
const BOOKING_FEE = 50, PROMO_FEE = 1, PROMO_CODE = 'CHITTU2005';
const PROMO_END = new Date(2026, 10, 4, 23, 59, 59);   // 04 Nov 2026
const promoActive = () => new Date() < PROMO_END;
const feeFor = code => (promoActive() || code === PROMO_CODE) ? PROMO_FEE : BOOKING_FEE;

/* ============ DATA ============
   Replace loadTrips() with a call to your backend / Firestore "group_trips".
   Field names match the app. */
const at = (d, h, m=0) => { const t = new Date(); t.setDate(t.getDate()+d); t.setHours(h,m,0,0); if(t<new Date()) t.setTime(Date.now()+36e5*3); return t; };
const SAMPLE = [
  {id:'t1',tripName:'Goa Beach Escape',description:'Beaches, cafés and sunsets with a friendly group.',tripStartLocation:'Bengaluru',meetingLocation:'Calangute, Goa',category:'Beach',vehicleType:'SUV',tripCost:2400,seatsAvailable:3,familyFriendly:true,creatorName:'Ravi K',creatorRating:4.8,creatorVerified:true,creatorId:'u1',tripDate:at(0,23,45)},
  {id:'t2',tripName:'Coorg Weekend Getaway',description:'Coffee estates, waterfalls and campfire evenings.',tripStartLocation:'Bengaluru',meetingLocation:'Madikeri, Coorg',category:'Weekend',vehicleType:'Car',tripCost:1500,seatsAvailable:4,familyFriendly:true,creatorName:'Ananya S',creatorRating:4.6,creatorVerified:true,creatorId:'u2',tripDate:at(1,6,30)},
  {id:'t3',tripName:'Hampi Heritage Ride',description:'Ruins, boulders and sunrise views on a tight budget.',tripStartLocation:'Bengaluru',meetingLocation:'Hampi, Karnataka',category:'Bike Trips',vehicleType:'Bike',tripCost:900,seatsAvailable:2,familyFriendly:false,creatorName:'Imran A',creatorRating:4.9,creatorVerified:false,creatorId:'u3',tripDate:at(2,5)},
  {id:'t4',tripName:'Gokarna Chill Trip',description:'Quiet beaches and beach-side trekking.',tripStartLocation:'Bengaluru',meetingLocation:'Om Beach, Gokarna',category:'Beach',vehicleType:'Car',tripCost:1800,seatsAvailable:3,familyFriendly:true,creatorName:'Meera P',creatorRating:4.5,creatorVerified:true,creatorId:'u4',tripDate:at(4,22)},
  {id:'t5',tripName:'Kudremukh Sunrise Trek',description:'Rolling grasslands and a sunrise worth the early start.',tripStartLocation:'Bengaluru',meetingLocation:'Kudremukh',category:'Trekking',vehicleType:'SUV',tripCost:1300,seatsAvailable:5,familyFriendly:false,creatorName:'Naveen R',creatorRating:4.7,creatorVerified:true,creatorId:'u5',tripDate:at(6,4)},
  {id:'t6',tripName:'Tirupati Darshan Run',description:'Early darshan, comfortable ride, return the same night.',tripStartLocation:'Bengaluru',meetingLocation:'Tirumala, Tirupati',category:'Temple',vehicleType:'Bus',tripCost:700,seatsAvailable:12,familyFriendly:true,creatorName:'Lakshmi V',creatorRating:4.4,creatorVerified:true,creatorId:'u6',tripDate:at(3,23)}
];
/* Real-time listener on group_trips (same collection as the Flutter app).
   Only future trips are requested; seats, cancellations and new trips arrive instantly. */
function subscribeTrips(onData, onError){
  if (!LIVE) { onData(SAMPLE); return () => {}; }
  const q = query(collection(db,'group_trips'), where('tripDate','>=',Timestamp.now()), orderBy('tripDate'));
  return onSnapshot(q, snap => {
    onData(snap.docs.map(d => {
      const x = d.data();
      return {...x, id:d.id, tripDate:x.tripDate.toDate(),
        seatsAvailable:Number(x.seatsAvailable)||0, tripCost:Number(x.tripCost)||0, creatorRating:x.creatorRating||0};
    }));
  }, onError);
}

/* ============ AUTH ============
   Demo login (OTP 123456). Replace sendOtp/verifyOtp with Firebase Auth:
   signInWithPhoneNumber(auth, '+91'+phone, verifier) -> confirmation.confirm(code) */
const wait = ms => new Promise(r => setTimeout(r, ms));
let confirmation = null, verifier = null;
const Auth = {
  user: null,
  load(){ if(!LIVE){ try{ this.user = JSON.parse(localStorage.getItem('tr_user')||'null'); }catch(e){} } },
  save(){ if(!LIVE){ try{ this.user ? localStorage.setItem('tr_user', JSON.stringify(this.user)) : localStorage.removeItem('tr_user'); }catch(e){} } },
  async sendOtp(phone){
    if(!LIVE){ await wait(500); return true; }
    verifier ||= new RecaptchaVerifier(fbAuth, 'recaptcha', {size:'invisible'});
    try { confirmation = await signInWithPhoneNumber(fbAuth, '+91'+phone, verifier); }
    catch(e){ verifier.clear(); verifier = null; throw new Error('Could not send OTP. Check the number and try again.'); }
    return true;
  },
  async verifyOtp(phone, code){
    if(!LIVE){ await wait(500); if(code!=='123456') throw new Error('Wrong OTP. Demo code is 123456.'); return {uid:'me', phone, name:'Traveler'}; }
    try { const r = await confirmation.confirm(code); return await profile(r.user); }
    catch(e){ throw new Error('Wrong OTP. Please try again.'); }
  },
  async logout(){ this.user=null; this.save(); if(LIVE) await signOut(fbAuth); }
};
async function profile(u){
  let name = 'Traveler';
  try { const s = await getDoc(doc(db,'users',u.uid)); if (s.exists() && s.data().name) name = s.data().name; } catch(e){}
  return {uid:u.uid, phone:u.phoneNumber||'', name};
}

/* ============ STATE & HELPERS ============ */
const S = {trips:[], quick:'All', cat:'', q:'', date:'', maxp:'', pending:null};
const $ = s => document.querySelector(s);
const dlg = $('#dlg');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '₹' + Number(n).toLocaleString('en-IN');
const sameDay = (a,b) => a.toDateString() === b.toDateString();
const fmtDate = d => { const n=new Date(); if(sameDay(d,n)) return 'Today'; const t=new Date(n); t.setDate(n.getDate()+1); if(sameDay(d,t)) return 'Tomorrow'; return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'}); };
const fmtTime = d => d.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit',hour12:true}).toUpperCase();
const initial = n => (n||'T').trim().charAt(0).toUpperCase();
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),3200); }
function open(html){ dlg.innerHTML = `<div class="d"><button class="x" data-close aria-label="Close">×</button>${html}</div>`; if(!dlg.open) dlg.showModal(); }
const isCar = t => ['Car','SUV'].includes(t.vehicleType);

/* ============ FILTER (same rules as the app) ============ */
function visibleTrips(){
  const now = new Date(), q = S.q.trim().toLowerCase();
  return S.trips.filter(t => {
    if (t.tripDate < now || t.seatsAvailable <= 0 || /cancel/i.test(t.status||'')) return false;
    if (q && !`${t.meetingLocation} ${t.tripName}`.toLowerCase().includes(q)) return false;
    if (S.date && !sameDay(t.tripDate, new Date(S.date+'T00:00'))) return false;
    if (S.maxp && t.tripCost > +S.maxp) return false;
    if (S.cat === 'Car Trips' && !isCar(t)) return false;
    if (S.cat === 'Bike Trips' && t.vehicleType !== 'Bike') return false;
    if (S.cat && !['Car Trips','Bike Trips'].includes(S.cat) && t.category !== S.cat) return false;
    if (S.quick === 'Today' && !sameDay(t.tripDate, now)) return false;
    if (S.quick === 'Car' && !isCar(t)) return false;
    if (S.quick === 'Bike' && t.vehicleType !== 'Bike') return false;
    return true;
  }).sort((a,b) => a.tripDate - b.tripDate);
}

/* ============ RENDER ============ */
function renderAuth(){
  const u = Auth.user;
  $('#authSlot').innerHTML = u
    ? `<div class="user"><span class="avatar">${esc(initial(u.name))}</span><button class="btn ghost sm" data-act="logout">Log out</button></div>`
    : `<button class="btn sm" data-act="login">Log in</button>`;
  $('#guestBanner').innerHTML = u ? '' :
    `<div class="guest"><span><b>You’re browsing as a guest.</b> You can see every ride. Log in when you’re ready to book a seat.</span><button class="btn sm" data-act="login">Log in</button></div>`;
}
function chips(el, items, key, current){
  el.innerHTML = items.map(i => `<button type="button" class="chip" data-${key}="${esc(i)}" aria-pressed="${current===i}">${esc(i)}</button>`).join('');
}
function render(){
  chips($('#quick'), QUICK, 'quick', S.quick);
  chips($('#cats'), CATEGORIES, 'cat', S.cat);
  const list = visibleTrips();
  $('#count').innerHTML = (LIVE ? '<span class="live"></span>Live · ' : '') + (list.length ? `${list.length} trip${list.length>1?'s':''} available` : '');
  $('#list').innerHTML = list.length
    ? `<div class="grid">${list.map(card).join('')}</div>`
    : `<div class="empty"><h3>No trips match yet</h3><p>Try another destination or date, or clear the filters.</p><button class="btn" data-act="clear">Clear filters</button></div>`;
}
function card(t){
  const own = Auth.user && t.creatorId === Auth.user.uid;
  const btn = own ? `<button class="btn ghost sm" disabled>Your trip</button>`
    : Auth.user ? `<button class="btn sun sm" data-book="${t.id}">Join trip</button>`
    : `<button class="btn sm" data-book="${t.id}">Log in to book</button>`;
  return `<article class="ticket">
    <div class="t-top" data-open="${t.id}" tabindex="0" role="button" aria-label="View ${esc(t.tripName)}">
      <div class="who"><span class="avatar">${esc(initial(t.creatorName))}</span>
        <div><strong>${esc(t.creatorName)}${t.creatorVerified?'<span class="ver" title="Verified">✔</span>':''}</strong><small>★ ${t.creatorRating||0} rating</small></div></div>
      <h3>${esc(t.tripName)}</h3>
      <div class="route"><div class="stop">${esc(t.tripStartLocation)}</div><div class="stop end">${esc(t.meetingLocation)}</div></div>
      <div class="tags"><span class="tag">${fmtDate(t.tripDate)}, ${fmtTime(t.tripDate)}</span><span class="tag">${esc(t.vehicleType)}</span><span class="tag ${t.seatsAvailable<=2?'warn':''}">${t.seatsAvailable} seat${t.seatsAvailable>1?'s':''} left</span><span class="tag">${esc(t.category)}</span>${t.familyFriendly?'<span class="tag">Family</span>':''}</div>
    </div>
    <div class="perf"></div>
    <div class="t-bot"><div class="price">${money(t.tripCost)}<small>per seat</small></div>${btn}</div>
  </article>`;
}

/* ============ DIALOGS ============ */
function detailView(t){
  const own = Auth.user && t.creatorId === Auth.user.uid;
  open(`<h2>${esc(t.tripName)}</h2><p class="sub">${esc(t.description)}</p>
    <div class="detail">
      <div><span>From</span><b>${esc(t.tripStartLocation)}</b></div>
      <div><span>Destination</span><b>${esc(t.meetingLocation)}</b></div>
      <div><span>Date & time</span><b>${fmtDate(t.tripDate)} • ${fmtTime(t.tripDate)}</b></div>
      <div><span>Vehicle</span><b>${esc(t.vehicleType)}</b></div>
      <div><span>Seats left</span><b>${t.seatsAvailable}</b></div>
      <div><span>Price per seat</span><b>${money(t.tripCost)}</b></div>
    </div>
    ${own ? '' : `<button class="btn ${Auth.user?'sun':''} block" data-book="${t.id}">${Auth.user?'Join trip':'Log in to book'}</button>`}`);
}

function loginView(note){
  open(`<h2>Log in to book</h2><p class="sub">${esc(note||'Use your phone number to continue.')}</p>
    <div class="f"><label for="ph">Mobile number</label><div class="phone"><span>+91</span><input id="ph" inputmode="numeric" maxlength="10" placeholder="9876543210"></div></div>
    <div class="f" id="otpBox" hidden><label for="otp">OTP</label><input id="otp" inputmode="numeric" maxlength="6" placeholder="6-digit code"></div>
    <p class="msg" id="lmsg"></p>
    <button class="btn block" id="lgo">Send OTP</button>
    <p class="note">Demo mode: any number works and the OTP is 123456. Connect Firebase Auth to go live.</p>`);
  let sent = false;
  $('#lgo').onclick = async () => {
    const ph = $('#ph').value.replace(/\D/g,''), msg = $('#lmsg'), b = $('#lgo');
    msg.className = 'msg';
    if (ph.length !== 10) { msg.textContent = 'Enter a valid 10-digit mobile number.'; msg.classList.add('bad'); return; }
    b.disabled = true;
    try {
      if (!sent) {
        await Auth.sendOtp(ph); sent = true; $('#otpBox').hidden = false; $('#otp').focus();
        b.textContent = 'Verify & log in'; msg.textContent = 'OTP sent.'; msg.classList.add('ok');
      } else {
        Auth.user = await Auth.verifyOtp(ph, $('#otp').value.trim()); Auth.save(); renderAuth(); render(); toast('Logged in. You can book now.');
        const p = S.pending; S.pending = null; p ? bookingView(p) : dlg.close();
      }
    } catch(e){ msg.textContent = e.message; msg.classList.add('bad'); }
    b.disabled = false;
  };
}

function bookingView(tripId){
  const t = S.trips.find(x => x.id === tripId); if(!t) return;
  let seats = 1, coupon = '', couponOk = false, agreed = false, cmsg = '';
  const names = [''], ages = [''];
  const draw = () => {
    const fee = feeFor(couponOk ? coupon : ''), total = t.tripCost * seats, rest = Math.max(0, total - fee);
    open(`<h2>Confirm your seat</h2><p class="sub">${esc(t.tripName)} · ${fmtDate(t.tripDate)}, ${fmtTime(t.tripDate)}</p>
      <div class="stepper"><b>Seats</b><div><button data-s="-" ${seats<=1?'disabled':''} aria-label="Fewer seats">−</button><span>${seats}</span><button data-s="+" ${seats>=t.seatsAvailable?'disabled':''} aria-label="More seats">+</button></div></div>
      ${Array.from({length:seats},(_,i)=>`<div class="pax"><b>Passenger ${i+1}</b><div class="row2">
        <div class="f" style="margin:0"><label for="n${i}">Name</label><input id="n${i}" data-n="${i}" value="${esc(names[i])}" placeholder="Traveler name"></div>
        <div class="f" style="margin:0"><label for="a${i}">Age</label><input id="a${i}" data-a="${i}" inputmode="numeric" value="${esc(ages[i])}" placeholder="Age"></div></div></div>`).join('')}
      <div class="f"><label for="cp">Coupon code</label><div class="coupon"><input id="cp" value="${esc(coupon)}" placeholder="Enter coupon code"><button class="btn ghost sm" data-apply>Apply</button></div><p class="msg ${couponOk?'ok':'bad'}">${esc(cmsg)}</p></div>
      <div class="sum"><div><span>Trip price (${seats} × ${money(t.tripCost)})</span><b>${money(total)}</b></div>
        <div><span>Booking fee${promoActive()?' (intro offer)':''}</span><b>${money(fee)}</b></div>
        <div class="tot"><span>Pay now</span><span>${money(fee)}</span></div>
        <div><span>Remaining, paid to the trip creator</span><b>${money(rest)}</b></div></div>
      <label class="terms"><input type="checkbox" id="tc" ${agreed?'checked':''}><span>I agree to the Trip Booking Terms & Conditions and have entered the correct name and age for every seat.</span></label>
      <p class="msg bad" id="bmsg"></p>
      <button class="btn sun block" id="pay">Pay ${money(fee)} securely</button>
      <p class="note">Your seat is confirmed after payment. Only the booking fee is charged now.</p>`);
    dlg.querySelectorAll('[data-n]').forEach(e => e.oninput = () => names[+e.dataset.n] = e.value);
    dlg.querySelectorAll('[data-a]').forEach(e => e.oninput = () => ages[+e.dataset.a] = e.value);
    $('#cp').oninput = e => coupon = e.target.value.trim().toUpperCase();
    $('#tc').onchange = e => agreed = e.target.checked;
    dlg.querySelectorAll('[data-s]').forEach(b => b.onclick = () => {
      if (b.dataset.s === '+') { seats++; names.push(''); ages.push(''); } else { seats--; names.pop(); ages.pop(); }
      draw();
    });
    dlg.querySelector('[data-apply]').onclick = () => {
      couponOk = coupon === PROMO_CODE;
      cmsg = couponOk ? 'Coupon applied. Booking fee ₹1.' : (coupon ? 'Invalid coupon code.' : 'Enter a coupon code.');
      draw();
    };
    $('#pay').onclick = async () => {
      const m = $('#bmsg');
      if (!agreed) { m.textContent = 'Accept the Terms & Conditions to continue.'; return; }
      for (let i = 0; i < seats; i++) {
        if (!names[i].trim()) { m.textContent = `Enter name for passenger ${i+1}.`; return; }
        if (!(parseInt(ages[i],10) > 0)) { m.textContent = `Enter a valid age for passenger ${i+1}.`; return; }
      }
      $('#pay').disabled = true; $('#pay').textContent = 'Confirming…';
      /* TODO: POST /group-booking/create-order -> open Razorpay -> POST /group-booking/verify-payment
         body: {trip_id, seat_count: seats, passengers:[{name,age}], coupon_code} */
      if (LIVE) { toast('Online payment is being connected. Please book this trip in the Tripride app for now.'); $('#pay').disabled = false; $('#pay').textContent = `Pay ${money(fee)} securely`; return; }
      await wait(900);
      t.seatsAvailable -= seats; render();
      open(`<div class="done"><div class="tick">✓</div><h2>Your booking is complete!</h2><p class="sub">${seats} seat${seats>1?'s':''} confirmed on ${esc(t.tripName)}.<br>${money(fee)} paid. Pay the remaining ${money(rest)} to the trip creator.</p><button class="btn block" data-close>Done</button></div>`);
    };
  };
  draw();
}

/* ============ EVENTS ============ */
function requireLogin(tripId){
  if (Auth.user) return bookingView(tripId);
  S.pending = tripId;
  loginView('Log in to book this trip. You can keep browsing without an account.');
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-book],[data-open],[data-act],[data-quick],[data-cat],[data-close]'); if (!el) return;
  const d = el.dataset;
  if ('close' in d) { dlg.close(); return; }
  if (d.book) return requireLogin(d.book);
  if (d.open) return detailView(S.trips.find(t => t.id === d.open));
  if (d.quick) { S.quick = d.quick; return render(); }
  if ('cat' in d) { S.cat = S.cat === d.cat ? '' : d.cat; return render(); }
  if (d.act === 'login') { S.pending = null; return loginView(); }
  if (d.act === 'logout') { Auth.logout(); renderAuth(); render(); return toast('Logged out.'); }
  if (d.act === 'clear') { $('#searchForm').reset(); Object.assign(S,{q:'',date:'',maxp:'',cat:'',quick:'All'}); render(); }
});
document.addEventListener('keydown', e => { if ((e.key==='Enter'||e.key===' ') && e.target.matches('.t-top')) { e.preventDefault(); e.target.click(); } });
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
$('#q').addEventListener('input', e => { S.q = e.target.value; render(); });
$('#date').addEventListener('change', e => { S.date = e.target.value; render(); });
$('#maxp').addEventListener('change', e => { S.maxp = e.target.value; render(); });
$('#searchForm').addEventListener('reset', () => setTimeout(() => { Object.assign(S,{q:'',date:'',maxp:''}); render(); }));
$('#searchForm').addEventListener('submit', e => e.preventDefault());

/* ============ INIT ============ */
(async () => {
  $('#yr').textContent = new Date().getFullYear();
  Auth.load(); renderAuth();
  $('#list').innerHTML = '<div class="empty"><p>Loading trips…</p></div>';
  subscribeTrips(list => { S.trips = list; render(); },
    err => { console.error(err); $('#list').innerHTML = '<div class="empty"><h3>Unable to load trips</h3><p>Check your connection and refresh the page.</p></div>'; });
  if (LIVE) onAuthStateChanged(fbAuth, async u => { Auth.user = u ? await profile(u) : null; renderAuth(); render(); });
})();
})();
</script>
</body>
</html>
