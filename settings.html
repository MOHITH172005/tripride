const group = rows => { const g = el("div","mg"); rows.forEach(r => g.append(r)); return g; };
function row(icon, bg, fg, title, sub, onClick, href, isSwitch){
  const a = href ? el("a","mi") : el("button","mi"); if (href) a.href = href;
  const ic = el("div","ic"); ic.style.cssText = `background:${bg};color:${fg}`; ic.append(el("span","ms",icon));
  const d = el("div"); d.append(el("b",null,title), el("small",null,sub)); a.append(ic, d);
  if (onClick || href) { if (!isSwitch) a.append(el("span","ms chev","chevron_right")); }
  if (onClick) a.onclick = onClick; else if (!href) { a.style.cursor = "default"; }
  return a;
}

$("ov").onclick = e => { if (e.target.id === "ov") $("ov").classList.remove("show"); };

/* ---- edit dialog ---- */
function editField(o){
  $("edT").textContent = o.title; $("edL").textContent = o.label; const i = $("edI"); i.placeholder = o.ph; i.value = o.val || ""; i.maxLength = o.max; i.type = o.key === "email" ? "email" : "text";
  $("edE").textContent = ""; $("edNo").textContent = tr("Cancel"); $("edYes").textContent = o.ok; $("ed").classList.add("show"); setTimeout(() => i.focus(), 50);
  const done = () => $("ed").classList.remove("show");
  $("edNo").onclick = done;
  $("edYes").onclick = async () => { const v = i.value.trim(); if (!o.check(v)) { $("edE").textContent = o.err; return; }
    done(); if (v === (o.val || "")) return; if (await save({ [o.key]:v })) o.after && o.after(v); };
  i.onkeydown = e => { if (e.key === "Enter") $("edYes").click(); };
}
$("ed").onclick = e => { if (e.target.id === "ed") $("ed").classList.remove("show"); };
async function save(patch){
  $("busyT").textContent = tr("Updating..."); $("busy").classList.add("show");
  try { await setDoc(doc(db,"users",uid), { ...patch, updatedAt:serverTimestamp() }, { merge:true }); toast(tr("Settings updated successfully.")); return true; }
  catch(e){ console.error("SETTINGS UPDATE", e); toast(tr("Unable to update settings right now. Please try again.")); return false; }
  finally { $("busy").classList.remove("show"); }
}

onAuthStateChanged(auth, u => {

  onSnapshot(doc(db,"users",uid), s => { if (!s.exists()) { state = "missing"; } else { data = s.data(); state = "ok"; } render(); },

});
