<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TripRide Guide</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0" rel="stylesheet">
<style>
:root{--ink:#0F1B3D;--pri:#6D4AE8;--acc:#FFB703;--bg:#F5F7FB;--mut:#5F6B8A;--line:#E3E8F2;--tint:#EEEAFF}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:Figtree,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
h1,h2,h3,.hd{font-family:'Bricolage Grotesque',Figtree,sans-serif}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:24px;line-height:1;display:inline-block;font-variation-settings:'FILL' 1,'wght' 500;user-select:none}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.bar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.bar-in{max-width:900px;margin:0 auto;height:62px;display:flex;align-items:center;gap:12px;padding:0 16px}
.ib{width:42px;height:42px;border-radius:14px;background:var(--bg);display:grid;place-items:center;flex:none}
.bar h1{font-size:21px;font-weight:800;letter-spacing:-.02em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg{display:flex;align-items:center;gap:6px;padding:9px 13px;border-radius:30px;background:var(--bg);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--pri)}.lg span:nth-child(2){max-width:80px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}.lg .ms{font-size:18px}
.wrap{max-width:900px;margin:0 auto;padding:16px 16px 50px}
.hero{position:relative;padding:26px;border-radius:30px;background:var(--pri);color:#fff;overflow:hidden}
.hero::before{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:#ffffff1c}
.hero::after{content:"";position:absolute;right:30px;bottom:-30px;width:70px;height:70px;border-radius:50%;background:var(--acc)}
.hero .hi{width:54px;height:54px;border-radius:18px;background:#ffffff2b;display:grid;place-items:center}.hero .hi .ms{font-size:30px}
.hero h2{margin-top:18px;font-size:clamp(24px,5vw,32px);font-weight:800;letter-spacing:-.03em;max-width:80%}.hero p{margin-top:8px;font-size:14px;line-height:1.5;color:#ffffffd1;max-width:80%}
.search{display:flex;align-items:center;gap:10px;margin-top:18px;height:56px;padding:0 18px;background:#fff;border:2px solid var(--ink);border-radius:999px;box-shadow:4px 4px 0 var(--ink)}
.search input{flex:1;border:0;outline:0;background:none;font-size:15px;font-weight:500;min-width:0}.search .ms{color:var(--pri);font-size:22px}.search button{display:none;color:var(--mut)}.search.has button{display:block}
.sh{display:flex;align-items:center;gap:10px;margin:28px 0 13px}.sh .ic{width:36px;height:36px;border-radius:11px;background:var(--tint);color:var(--pri);display:grid;place-items:center}.sh .ic .ms{font-size:20px}.sh h3{font-size:20px;font-weight:800}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.qc{display:flex;flex-direction:column;align-items:flex-start;min-height:160px;padding:18px;background:#fff;border:1px solid var(--line);border-radius:24px;text-align:left;transition:transform .15s,box-shadow .15s}
.qc:hover,.gl:hover{transform:translateY(-3px);border-color:var(--ink);box-shadow:4px 4px 0 var(--ink)}
.qc .ic{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;margin-bottom:auto}
.qc b{font-size:15px;font-weight:800;margin-top:16px;line-height:1.25}.qc small{display:flex;width:100%;align-items:center;margin-top:6px;font-size:11.5px;font-weight:600;color:var(--mut)}.qc small .ms{margin-left:auto;font-size:18px;color:var(--pri)}
.list{display:grid;gap:12px}
.gl{display:flex;align-items:center;gap:14px;padding:15px;background:#fff;border:1px solid var(--line);border-radius:22px;text-align:left;width:100%;transition:transform .15s,box-shadow .15s}
.gl .ic{width:52px;height:52px;border-radius:16px;background:var(--tint);color:var(--pri);display:grid;place-items:center;flex:none}
.gl div{flex:1;min-width:0}.gl b{display:block;font-size:15px;font-weight:800}.gl small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:4px;font-size:12.5px;line-height:1.4;color:var(--mut)}
.gl .go{width:34px;height:34px;border-radius:12px;background:var(--bg);display:grid;place-items:center;color:var(--mut);flex:none}.gl .go .ms{font-size:18px}
.none{text-align:center;padding:40px 20px;background:#fff;border-radius:22px;color:var(--mut);font-weight:700}.none .ms{font-size:42px;color:#94A3B8;display:block;margin-bottom:10px}
.help{display:flex;gap:14px;align-items:center;margin-top:24px;padding:18px;border-radius:22px;background:var(--ink);color:#fff}.help .ms{font-size:30px;color:var(--acc)}.help b{display:block;font-size:15px;font-weight:800}.help small{color:#ffffffb3;font-size:12px}
/* overlays */
.ov{position:fixed;inset:0;background:#17143a99;z-index:100;display:none;align-items:flex-end;justify-content:center}.ov.show{display:flex}
.sheet{width:100%;max-width:560px;max-height:88vh;background:#fff;border-radius:30px 30px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.grab{width:42px;height:5px;border-radius:20px;background:#CBD5E1;margin:12px auto 0}
.sh2{display:flex;align-items:center;gap:12px;padding:20px 12px 14px 20px;border-bottom:1px solid var(--line)}.sh2 .ic{width:46px;height:46px;border-radius:15px;background:var(--tint);color:var(--pri);display:grid;place-items:center}.sh2 h3{flex:1;font-size:19px;font-weight:800}
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px;overflow:auto}
.lo{display:flex;align-items:center;gap:6px;padding:0 14px;height:58px;border-radius:16px;background:var(--bg);border:1px solid var(--line);font-weight:600;text-align:left}.lo span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lo.on{background:var(--tint);border:1.5px solid var(--pri);color:var(--pri);font-weight:800}
/* walkthrough */
#walk{position:fixed;inset:0;z-index:150;background:var(--bg);display:none;flex-direction:column}#walk.show{display:flex}
.wb{max-width:640px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;padding:12px 18px calc(18px + env(safe-area-inset-bottom));min-height:0}
.pr{display:flex;font-size:12px;font-weight:700;color:#475569}.pr span:last-child{margin-left:auto;color:var(--pri);font-weight:800}
.track{height:8px;border-radius:30px;background:#E2E8F0;margin:10px 0 22px;overflow:hidden}.track i{display:block;height:100%;background:var(--pri);border-radius:30px;transition:width .3s}
.card{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px;background:#fff;border:1px solid var(--line);border-radius:30px;box-shadow:0 20px 40px #0f1b3d14}
.card .big{width:104px;height:104px;border-radius:32px;background:var(--tint);color:var(--pri);display:grid;place-items:center;margin-bottom:28px}.card .big .ms{font-size:52px}
.card h2{font-size:clamp(22px,5vw,27px);font-weight:800;letter-spacing:-.02em}.card p{margin-top:14px;font-size:15.5px;line-height:1.6;color:var(--mut);max-width:440px}
.dots{display:flex;gap:7px;margin-top:28px;flex-wrap:wrap;justify-content:center}.dots i{width:8px;height:8px;border-radius:20px;background:#CBD5E1;transition:width .2s}.dots i.on{width:24px;background:var(--pri)}
.nav{display:flex;gap:12px;margin-top:18px}.nav button{flex:1;height:54px;border-radius:17px;font-weight:800;display:flex;gap:7px;align-items:center;justify-content:center}
.nav .pv{border:1.5px solid var(--line);background:#fff}.nav .nx{background:var(--pri);color:#fff;box-shadow:4px 4px 0 var(--ink)}
.card.anim{animation:in .25s ease}@keyframes in{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
@media (max-width:480px){.hero h2,.hero p{max-width:100%}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
</style>
</head>

<header class="bar"><div class="bar-in">
  <button class="ib" id="back" aria-label="Back"><span class="ms">arrow_back</span></button>

  <div class="lgrid" id="lg"></div></div></div>

  </div>
</section>

const QC = [["#EFF6FF","#2563EB"],["#F5F3FF","#7C3AED"],["#ECFDF5","#059669"],["#FFF7ED","#EA580C"]];

const $ = id => document.getElementById(id);
const el = (t,c,x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const icon = n => el("span","ms",n);
let lang = "English", q = "", cur = null, stepI = 0;
try { const s = localStorage.getItem(KEY); if (s && LANGS.includes(s)) lang = s; else { const h = localStorage.getItem("tripride_home_language"); const m = {te:"తెలుగు",hi:"हिन्दी",ta:"தமிழ்",kn:"ಕನ್ನಡ",ml:"മലയാളം",mr:"मराठी",bn:"বাংলা",gu:"ગુજરાતી",pa:"ਪੰਜਾਬੀ",or:"ଓଡ଼ିଆ",ur:"اردو"}; if (h && m[h]) lang = m[h]; } } catch(_){}
const t = k => (U[lang] && U[lang][k]) || U["English"][k] || k;
const CI = () => lang === "తెలుగు" ? 1 : 0;           // content index (en / te)
const gt = g => g.ti[CI()], gs = g => g.su[CI()];
const back = () => history.length > 1 ? history.back() : location.href = HOME_URL;

function applyLang(){
  document.documentElement.dir = RTL.includes(lang) ? "rtl" : "ltr";
  $("ttl").textContent = t("guide"); document.title = t("guide"); $("lgName").textContent = lang; render();
}
function render(){
  const R = $("root"); R.textContent = "";
  const hero = el("div","hero"), hi = el("div","hi"); hi.append(icon("travel_explore"));
  hero.append(hi, el("h2",null,t("welcome")), el("p",null,t("welcomeSub"))); R.append(hero);
  const sb = el("div","search" + (q ? " has" : "")); const inp = el("input"); inp.type = "search"; inp.placeholder = t("search"); inp.value = q; inp.setAttribute("aria-label", t("search"));
  const x = el("button"); x.setAttribute("aria-label","Clear"); x.append(icon("close")); x.onclick = () => { q = ""; render(); };
  inp.oninput = () => { q = inp.value; sb.classList.toggle("has", !!q); list(); }; sb.append(icon("search"), inp, x); R.append(sb);
  R.append(head("bolt", t("quick")));
  const quick = el("div","quick"); G.slice(0,4).forEach((g,i) => { const b = el("button","qc"), ic = el("div","ic"); ic.style.cssText = `background:${QC[i][0]};color:${QC[i][1]}`; ic.append(icon(g.ic));
    const s = el("small",null,`${g.st.length} ${t("step")}`); s.append(icon("arrow_forward")); b.append(ic, el("b",null,gt(g)), s); b.onclick = () => open(g); quick.append(b); }); R.append(quick);
  R.append(head("grid_view", t("all")));
  const L = el("div","list"); L.id = "list"; R.append(L); list();
  const h = el("div","help"); const d = el("div"); d.append(el("b",null,t("more")), el("small",null,t("moreSub"))); h.append(icon("support_agent"), d); R.append(h);
}
function head(i, title){ const h = el("div","sh"), ic = el("div","ic"); ic.append(icon(i)); h.append(ic, el("h3",null,title)); return h; }
function list(){
  const L = $("list"); L.textContent = ""; const s = q.trim().toLowerCase();
  const f = G.filter(g => !s || gt(g).toLowerCase().includes(s) || gs(g).toLowerCase().includes(s) || g.id.includes(s));
  if (!f.length) { const n = el("div","none"); n.append(icon("search_off"), el("span",null,t("noResults"))); return L.append(n); }
  f.forEach(g => { const b = el("button","gl"), ic = el("div","ic"); ic.append(icon(g.ic)); const d = el("div"); d.append(el("b",null,gt(g)), el("small",null,gs(g)));
    const go = el("div","go"); go.append(icon("arrow_forward_ios")); go.firstChild.style.fontSize = "14px"; b.append(ic, d, go); b.onclick = () => open(g); L.append(b); });
}
/* ---- language sheet ---- */
function openLang(){ $("lT").textContent = t("language"); const g = $("lg"); g.textContent = "";
  LANGS.forEach(l => { const b = el("button","lo" + (l === lang ? " on" : "")); b.append(el("span",null,l)); if (l === lang) b.append(icon("check_circle"));
    b.onclick = () => { if (l !== lang) { lang = l; q = ""; try { localStorage.setItem(KEY, l); } catch(_){} applyLang(); } $("lov").classList.remove("show"); }; g.append(b); });
  $("lov").classList.add("show"); }
$("lgBtn").onclick = openLang; $("lX").onclick = () => $("lov").classList.remove("show"); $("lov").onclick = e => { if (e.target.id === "lov") $("lov").classList.remove("show"); };
/* ---- walkthrough ---- */
function open(g){ cur = g; stepI = 0; $("walk").classList.add("show"); document.body.style.overflow = "hidden"; $("wT").textContent = gt(g); step(false); }
function close(){ $("walk").classList.remove("show"); document.body.style.overflow = ""; cur = null; }
function step(anim = true){
  const s = cur.st[stepI], n = cur.st.length, last = stepI === n - 1, p = (stepI + 1) / n, i = CI();
  $("wS").textContent = `${t("step")} ${stepI + 1}/${n}`; $("wP").textContent = Math.round(p * 100) + "%"; $("wB").style.width = p * 100 + "%";
  const c = $("wC"); c.textContent = ""; c.className = "card" + (anim ? " anim" : "");
  const big = el("div","big"); big.append(icon(s[0])); const dots = el("div","dots"); cur.st.forEach((_,k) => dots.append(el("i", k === stepI ? "on" : "")));
  c.append(big, el("h2",null,s[1][i]), el("p",null,s[2][i]), dots);
  const pv = $("pv"), nx = $("nx"); pv.textContent = ""; pv.append(icon("arrow_back"), el("span",null,t("previous"))); pv.style.display = stepI ? "flex" : "none";
  nx.textContent = ""; nx.append(el("span",null, last ? t("done") : t("next")), icon(last ? "check_circle" : "arrow_forward"));
}
$("pv").onclick = () => { if (stepI > 0) { stepI--; step(); } };
$("nx").onclick = () => { if (stepI < cur.st.length - 1) { stepI++; step(); } else close(); };
$("wBack").onclick = close; $("back").onclick = back;
document.addEventListener("keydown", e => { if (!cur) return; if (e.key === "ArrowRight") $("nx").click(); else if (e.key === "ArrowLeft") $("pv").click(); else if (e.key === "Escape") close(); });
applyLang();
