const price=(t,g)=>g?fn(t.tripCost,t.price,t.amount):fn(t.price,t.tripPrice,t.amount);
function endTime(t,fb){const e=dt(fv(t.tripEndTime,t.rideEndTime,t.endTime,t.tripEndDateTime,t.endDateTime,t.expectedEndTime,t.expectedTripEnd));if(e)return e;const s=dt(fv(t.tripDate,t.startDate,t.rideDate,t.date,fb));if(!s)return null;const mi=fn(t.tripDurationMinutes,t.rideDurationMinutes,t.durationMinutes,t.estimatedDurationMinutes);if(mi>0)return new Date(s.getTime()+mi*6e4);const hr=fn(t.tripDurationHours,t.rideDurationHours,t.durationHours,t.estimatedDurationHours);return hr>0?new Date(s.getTime()+hr*36e5):s}
function status(t,d){const e=ft(t.status);if(e.toLowerCase().includes("cancel"))return e[0].toUpperCase()+e.slice(1);const en=endTime(t,d);if(en&&en<=new Date())return "Completed";if(e)return e[0].toUpperCase()+e.slice(1);const x=dt(d);return !x?"Active":x<new Date()?"Completed":"Upcoming"}
const sp=s=>{const v=(s||"").toLowerCase();return `<span class="pill ${/cancel|fail/.test(v)?"bad":/complete/.test(v)?"warn":"ok"}">${esc(s)}</span>`};
const active=d=>!/cancel/i.test(ft(d.bookingStatus,d.status,"Confirmed"));
const bcount=async(id,g)=>{try{return(await getDocs(query(collection(db,g?"group_bookings":"bookings"),where("tripId","==",id)))).docs.filter(d=>active(d.data())).length}catch{return 0}};
async function loadUser(uid,fb){try{const d=(await getDoc(doc(db,"users",uid))).data()||{};return{name:ft(d.name,d.fullName,d.displayName,fb.name),photo:ft(d.profilePhoto,d.photo,d.photoUrl,d.profileImage,fb.photo),phone:ft(d.phone,d.phoneNumber,d.mobile,d.mobileNumber,fb.phone)}}catch{return fb}}
boot(tr("My Trips"),u=>{const uid=u.uid;
 push(tr("My Trips"),m=>{m.innerHTML=`<h2 class="h2">Trips Created by You</h2><p class="sub">Manage your trips, view bookings and chat with passengers.</p>`;
  m.append(cat({icon:"route",title:"Place to Place Trips",sub:"Trips created by you and passenger bookings.",go:()=>list(false)}));
  m.append(cat({icon:"groups",color:"#059669",bg:"#ECFDF5",title:"Group Trips",sub:"Group trips created by you and booked members.",go:()=>list(true)}))});

 function list(g){push(g?"My Group Trips":"My Place to Place Trips",async m=>{m.innerHTML='<div class="empty"><div class="spin" style="margin:auto"></div></div>';
  try{const s=await getDocs(query(collection(db,g?"group_trips":"trips"),where(g?"creatorId":"driverId","==",uid)));
   const docs=s.docs.sort((a,b)=>ms(tdate(b.data(),g))-ms(tdate(a.data(),g)));m.textContent="";
   if(!docs.length)return m.innerHTML=empty(g?"groups":"route","No trips created yet",g?"Your created group trips will appear here.":"Your created place-to-place trips will appear here.");
   docs.forEach(d=>{const t=d.data(),date=tdate(t,g),st=status(t,date),f=from(t,g),to_=to(t,g),pr=price(t,g),veh=ft(t.vehicle,t.vehicleName,t.vehicleType,t.carModel);
    // auto-complete once the ride end time has passed
    const raw=ft(t.status).toLowerCase(),en=endTime(t,date);if(!raw.includes("cancel")&&raw!=="completed"&&en&&en<=new Date())updateDoc(d.ref,{status:"Completed",completedAt:serverTimestamp(),updatedAt:serverTimestamp()}).catch(()=>{});
    const e=h(`<div class="card tap"><div class="row"><div class="ib" style="width:47px;height:47px;background:${g?"#ECFDF5":"#EFF6FF"};color:${g?"#059669":"#2563EB"}"><span class="ms">${g?"groups":"route"}</span></div><b class="grow">${esc(g?ft(t.tripName,"Group Trip"):`${f} → ${to_}`)}</b>${sp(st)}</div><div style="margin:16px 0">${route(f,to_)}</div>${st.toLowerCase()==="completed"?'<div class="card" style="background:#ECFDF5;border-color:#A7F3D0;color:#047857;font-weight:800;font-size:13px;padding:11px 13px;margin:0 0 12px">✔ Ride Completed • View ride details</div>':""}${date?`<div class="mi"><span class="ms">calendar_month</span>${fdt(date)}</div>`:""}${veh?`<div class="mi"><span class="ms">directions_car</span>${esc(veh)}</div>`:""}<hr><div class="row"><span class="ms" style="color:#64748B">people_alt</span><b class="grow mut bc">0 bookings</b>${pr>0?`<b style="font-size:17px">₹${money(pr)}</b>`:""}</div><div class="row" style="margin-top:12px">${st.toLowerCase()!=="completed"&&ft(t.status)!=="Cancelled by Creator"?'<button class="btn out sm cx" style="color:#DC2626">Cancel Trip</button>':""}<span class="grow"></span><b style="color:#2563EB;font-size:13px">Manage Trip →</b></div></div>`);
    bcount(d.id,g).then(n=>e.querySelector(".bc").textContent=n+" bookings");
    e.onclick=()=>detail(d.id,t,g);const cx=e.querySelector(".cx");if(cx)cx.onclick=ev=>{ev.stopPropagation();cancel(d.id,g,cx)};m.append(e)})
  }catch(e){console.error(e);m.innerHTML=empty("cloud_off","Unable to load trips","Check your internet connection and try again.")}})}

 async function cancel(id,g,btn){
  const ref=doc(db,g?"group_trips":"trips",id);if(ft((await getDoc(ref)).data()?.status)==="Cancelled by Creator")return toast("This trip is already cancelled.");
  if(!confirm("Cancel Trip\n\nAre you sure?\n\n• This trip will be cancelled.\n• Every booked passenger will be refunded their booking fee.\n• The refunded amount will be deducted from your wallet.\n• If your wallet balance becomes negative, you cannot create a new trip until your dues are cleared."))return;
  btn.disabled=true;btn.textContent="Cancelling...";
  try{const bs=await getDocs(query(collection(db,g?"group_bookings":"bookings"),where("tripId","==",id))),act=bs.docs.filter(x=>active(x.data())),b=writeBatch(db);
   if(g)b.update(ref,{status:"Cancelled by Creator",seatsAvailable:0,bookedSeats:0});
   else{const n=act.reduce((a,x)=>{const k=x.data(),v=fn(k.seats,k.seatsBooked,k.bookedSeats,k.numberOfSeats);return a+(v>0?Math.trunc(v):1)},0);b.update(ref,{status:"Cancelled by Creator",availableSeats:increment(n),bookedSeats:increment(-n)})}
   let tot=0;for(const x of act){const k=x.data(),pid=k.passengerId||k.userId||k.bookedUserId,r=Math.round(fn(k.bookingFee,k.totalAmount,k.amount)),amt=r>0?r:50;b.update(x.ref,{bookingStatus:"Cancelled by Creator",cancelledBy:"Creator",cancelledAt:serverTimestamp()});if(!pid)continue;tot+=amt;b.update(doc(db,"users",pid),{wallet:increment(amt)})}
   b.update(doc(db,"users",uid),{wallet:increment(-tot)});await b.commit();
   toast(tot>0?`Trip cancelled. ₹${tot} refunded across ${act.length} passenger(s).`:"Trip cancelled successfully.");pop();list(g);
  }catch(e){console.error(e);toast("Unable to cancel the trip right now. Check your internet connection and try again.");btn.disabled=false;btn.textContent="Cancel Trip"}}

 function detail(id,t,g){push("Trip Details",m=>{
  const f=from(t,g),to_=to(t,g),date=tdate(t,g),pr=price(t,g),st=status(t,date),veh=ft(t.vehicle,t.vehicleName,t.vehicleType,t.carModel),vno=ft(t.vehicleNumber,t.registrationNumber,t.vehicleNo),ts=fn(t.totalSeats,t.seats,t.seatCapacity),as=fn(t.availableSeats,t.seatsAvailable,t.remainingSeats),cr=fv(t.createdAt,t.postedAt),en=endTime(t,date);
  m.innerHTML=hero(g?"Group Trip":"Place to Place",st,f,to_,[date&&fdt(date)],g)+
  sec("Trip Information",[["From",f],["To",to_],date&&["Date & Time",fdt(date)],veh&&["Vehicle",veh],vno&&["Vehicle No.",vno],pr>0&&["Price","₹"+money(pr)],ts>0&&["Total Seats",money(ts)],as>0&&["Available Seats",money(as)],["Status",st],st.toLowerCase()==="completed"&&en&&["Ride Completed",fdt(en)],["Trip ID",id],cr&&["Created On",fdt(cr)]])+
  `<h2 style="margin:18px 0 12px">Booked Passengers</h2><div id="pax"></div>`;
  const box=m.querySelector("#pax");box.innerHTML='<div class="empty"><div class="spin" style="margin:auto"></div></div>';
  getDocs(query(collection(db,g?"group_bookings":"bookings"),where("tripId","==",id))).then(async s=>{
   const docs=s.docs.filter(d=>active(d.data())).sort((a,b)=>ms(b.data().createdAt)-ms(a.data().createdAt));box.textContent="";
   if(!docs.length)return box.innerHTML='<div class="card mut">No passengers booked this trip yet.</div>';
   for(const d of docs){const b=d.data(),pid=ft(b.passengerId,b.bookedUserId,b.userId),fb={name:ft(b.passengerName,b.bookedUserName,b.userName,b.name,"Passenger"),photo:ft(b.passengerPhoto,b.bookedUserPhoto,b.profilePhoto,b.userPhoto),phone:ft(b.passengerPhone,b.passengerMobile,b.bookedUserPhone,b.bookedUserMobile,b.phone,b.phoneNumber,b.mobile,b.mobileNumber)},p=await loadUser(pid,fb),amt=fn(b.totalAmount,b.tripPrice,b.amount,b.bookingFee),seats=fn(b.seats,b.seatsBooked,b.bookedSeats,b.numberOfSeats);
    const e=h(`<div class="card"><div class="row">${avatar(p.photo,p.name,25)}<div class="grow"><b>${esc(p.name)}</b>${p.phone?`<br><small>📞 ${esc(p.phone)}</small>`:""}<br><small>${seats>0?money(seats)+" seat"+(seats==1?"":"s")+" booked":"Trip passenger"}</small></div>${pill(ft(b.bookingStatus,b.status,"Confirmed"))}</div><div class="row" style="margin:12px 0"><b class="grow">${amt>0?"₹"+money(amt):""}</b><small>${fdt(b.createdAt)}</small></div><div class="row"><button class="btn out sm grow dt" style="text-align:center">Details</button><button class="btn sm grow ch" style="text-align:center" ${pid?"":"disabled"}>Chat</button></div></div>`);
    e.querySelector(".dt").onclick=()=>pdetail(d.id,b,p,id,pid);e.querySelector(".ch").onclick=()=>chat(pid,p,id,t,g);box.append(e)}
  }).catch(()=>box.innerHTML='<div class="card mut">Unable to load bookings</div>')})}

 function pdetail(bid,b,p,tid,pid){push("Passenger Details",m=>{
  const fee=fn(b.bookingFee,b.bookingAmount),tot=fn(b.totalAmount,b.tripPrice,b.amount),rem=fn(b.remainingAmount,b.remainingPayment),seats=fn(b.seats,b.seatsBooked,b.bookedSeats,b.numberOfSeats),na="Not available";
  m.innerHTML=sec("Passenger",[["Name",p.name],p.phone&&["Mobile",p.phone],pid&&["ID",pid]])+
  sec("Booking Information",[["Booking ID",bid],["Trip ID",tid],seats>0&&["Seats",money(seats)],["Booking Status",ft(b.bookingStatus,b.status,"Confirmed")],["Booked On",fv(b.createdAt,b.bookedAt)?fdt(fv(b.createdAt,b.bookedAt)):na]])+
  sec("Payment Details",[tot>0&&["Total Amount","₹"+money(tot)],fee>0&&["Booking Fee","₹"+money(fee)],rem>0&&["Remaining","₹"+money(rem)],["Payment Status",ft(b.paymentStatus,b.payment_status,na)],["Payment Method",ft(b.paymentMethod,b.payment_method,na)],["Payment ID",ft(b.paymentId,b.razorpayPaymentId,b.razorpay_payment_id,na)]])})}

 async function chat(pid,p,tid,t,g){
  if(!pid)return;if(pid===uid)return toast("You cannot chat with yourself.");
  const type=g?"group":"place_to_place",cid=`${type}_${tid}_${uid}_${pid}`,f=from(t,g),to_=to(t,g),title=g?ft(t.tripName,`${f} → ${to_}`,"Group Trip"):`${f} → ${to_}`,me=await loadUser(uid,{name:"Trip Creator",photo:"",phone:""}),ref=doc(db,"chats",cid);
  try{const ex=await getDoc(ref),d={chatId:cid,userIds:[uid,pid],creatorId:uid,passengerId:pid,creatorName:me.name,creatorPhoto:me.photo,passengerName:p.name,passengerPhoto:p.photo,tripId:tid,tripType:type,tripTitle:title,from:f,to:to_,updatedAt:serverTimestamp()};
   if(!ex.exists()){d.createdAt=serverTimestamp();d.lastMessage=""}await setDoc(ref,d,{merge:true});
   location.href=`chat.html?id=${encodeURIComponent(cid)}`;  // <- point this at your chat page
  }catch(e){console.error(e);toast("Unable to open chat right now. Check your internet connection and try again.")}}
});
