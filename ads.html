<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A2540">
<title>Advertise with Tripride | Tripride Ads</title>
<meta name="description" content="Upload a 10-second video ad, pick your days, pay ₹50 per day and reach Tripride travellers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/logo.png">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
/* ============ BASE ============ */
:root{--navy:#0A2540;--blue:#0F8BD0;--sky:#9FD6F5;--cream:#F3F8FC;--ink:#34425a;--mut:#57677f;--line:#d6e4f0;--ok:#16a36a;--okbg:#e6f7ef;--warn:#b7791f;--warnbg:#fff4de;--bad:#d1434b;--badbg:#fdecee;--grad:linear-gradient(135deg,#0F8BD0,#18C1E8);--head:'Bricolage Grotesque',system-ui,sans-serif;--body:'DM Sans',system-ui,sans-serif;--nav-h:72px;--sec:clamp(60px,8vw,96px)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nav-h) + 12px);-webkit-text-size-adjust:100%}
body{font-family:var(--body);color:var(--ink);background:var(--cream);line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}a{color:inherit;text-decoration:none}ul{list-style:none}button{font-family:inherit}
h1,h2,h3,h4{font-family:var(--head);color:var(--navy);line-height:1.1;letter-spacing:-.02em}
.container{width:min(1200px,100% - 40px);margin-inline:auto}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 26px;min-height:48px;border-radius:999px;font-weight:700;font-size:.95rem;border:2px solid transparent;cursor:pointer;transition:.25s;background:var(--grad);color:#fff;box-shadow:0 10px 24px rgba(15,139,208,.3);white-space:nowrap}
.btn:hover{transform:translateY(-2px);box-shadow:0 16px 30px rgba(15,139,208,.4)}
.btn.out{background:#fff;color:var(--navy);border-color:var(--line);box-shadow:none}.btn.out:hover{border-color:var(--navy)}
.btn.navy{background:var(--navy);box-shadow:0 10px 24px rgba(10,37,64,.25)}.btn.ok{background:var(--ok);box-shadow:0 10px 24px rgba(22,163,106,.3)}.btn.bad{background:var(--bad);box-shadow:0 10px 24px rgba(209,67,75,.25)}
.btn.sm{min-height:38px;padding:8px 16px;font-size:.84rem;box-shadow:none}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.kicker{display:inline-block;font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--blue)}
.lead{color:var(--mut);font-size:clamp(1rem,1.5vw,1.1rem)}
.muted{color:var(--mut)}.ok-t{color:var(--ok)}
.sec-head{max-width:660px;margin:0 auto clamp(30px,5vw,48px);text-align:center}
.sec-head h2{font-size:clamp(1.85rem,4.2vw,2.9rem);margin:10px 0 12px}
.section{padding:var(--sec) 0}.section.white{background:#fff}

/* ============ NAV ============ */
.nav{position:sticky;top:0;z-index:500;background:rgba(243,248,252,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);transition:box-shadow .3s}
.nav.scrolled{box-shadow:0 8px 30px rgba(10,37,64,.1)}
.nav-in{display:flex;align-items:center;justify-content:space-between;height:var(--nav-h);gap:16px}
.brand{display:flex;align-items:center;gap:10px;flex:none}.logo-img{height:40px;width:auto}
.wordmark{font-family:var(--head);font-weight:800;font-size:1.35rem;letter-spacing:.06em;color:var(--navy)}.wordmark b{color:var(--blue)}
.ads-tag{font-family:var(--head);font-weight:800;font-size:.72rem;letter-spacing:.12em;color:#fff;background:var(--grad);padding:4px 9px;border-radius:999px;margin-left:2px}
.menu{display:flex;align-items:center;gap:2px}
.menu a{display:flex;align-items:center;padding:10px 13px;font-weight:500;font-size:.93rem;color:var(--navy);border-radius:999px;transition:.2s;white-space:nowrap}
.menu a:hover{color:var(--blue);background:#fff}
.menu .btn{margin-left:6px;color:#fff;padding:11px 22px;min-height:44px}.menu .btn:hover{background:var(--grad);color:#fff}
.menu .ghost{border:1.5px solid var(--line);background:#fff}
.burger{display:none;width:44px;height:44px;border:0;background:none;cursor:pointer;flex-direction:column;gap:6px;align-items:center;justify-content:center;z-index:502}
.burger span{display:block;width:25px;height:3px;background:var(--navy);transition:.3s;border-radius:3px}
.burger.open span:nth-child(1){transform:translateY(9px) rotate(45deg)}.burger.open span:nth-child(2){opacity:0}.burger.open span:nth-child(3){transform:translateY(-9px) rotate(-45deg)}

/* ============ HERO ============ */
.hero{position:relative;overflow:hidden;padding:clamp(40px,7vw,84px) 0 clamp(56px,8vw,96px);background:radial-gradient(700px 420px at 90% 0,#cfeaff,transparent 70%),radial-gradient(520px 360px at 0 100%,#e1f4ff,transparent 70%)}
.hero-in{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(32px,5vw,64px);align-items:center}
.pillk{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;background:#fff;border:1px solid var(--line);border-radius:999px;font-size:.8rem;font-weight:700;color:var(--blue);letter-spacing:.06em;text-transform:uppercase}
.pillk::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px #0f8bd033}
.hero h1{font-size:clamp(2.4rem,6vw,4.6rem);font-weight:800;margin:22px 0 18px}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lead{max-width:540px}
.cta{display:flex;flex-wrap:wrap;gap:14px;margin-top:30px}
.facts{display:flex;gap:12px;flex-wrap:wrap;margin-top:38px}
.facts span{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 18px;font-size:.85rem;color:var(--mut)}.facts b{display:block;color:var(--navy);font-family:var(--head);font-size:1.15rem}
.visual{position:relative;display:grid;place-items:center;min-height:480px}
.phone{position:relative;width:min(290px,78%);aspect-ratio:9/17;border-radius:44px;background:#0b1626;padding:11px;box-shadow:0 40px 80px rgba(10,37,64,.3);transform:rotate(3deg)}
.screen{position:relative;width:100%;height:100%;border-radius:34px;overflow:hidden;background:linear-gradient(160deg,#0F8BD0,#0A2540 80%);display:flex;flex-direction:column;justify-content:flex-end;padding:22px;color:#fff;isolation:isolate}
.screen::before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-80px;top:-60px;background:radial-gradient(circle,rgba(159,214,245,.55),transparent 70%);z-index:-1}
.screen .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-60%);width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);display:grid;place-items:center;backdrop-filter:blur(8px);animation:pulse 2.4s ease-out infinite}
.screen .play svg{width:28px;height:28px;fill:#fff;margin-left:4px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.35)}100%{box-shadow:0 0 0 28px rgba(255,255,255,0)}}
.screen small{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--sky);font-weight:700}
.screen b{font-family:var(--head);font-size:1.6rem;line-height:1.05;margin:4px 0 14px}
.bar{height:5px;border-radius:5px;background:rgba(255,255,255,.25);overflow:hidden}.bar i{display:block;height:100%;width:0;background:#fff;border-radius:5px;animation:fill 10s linear infinite}
@keyframes fill{to{width:100%}}
.float{position:absolute;z-index:3;background:#fff;border-radius:18px;padding:12px 16px;box-shadow:0 18px 40px rgba(10,37,64,.16);display:flex;gap:12px;align-items:center;animation:fl 5s ease-in-out infinite}
.float b{display:block;color:var(--navy);font-size:.9rem;line-height:1.2}.float small{color:var(--mut);font-size:.76rem}
.ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--c,var(--blue)) 14%,#fff);color:var(--c,var(--blue));flex:none}
.f1{top:34px;left:0}.f2{bottom:60px;right:0;animation-delay:-2.5s}
@keyframes fl{50%{transform:translateY(-10px)}}

/* ============ LIVE ADS ============ */
.ad-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
.ad-card{background:#fff;border:1px solid var(--line);border-radius:26px;overflow:hidden;transition:transform .3s,box-shadow .3s}
.ad-card:hover{transform:translateY(-6px);box-shadow:0 24px 48px rgba(10,37,64,.14)}
.ad-card video{width:100%;aspect-ratio:9/14;object-fit:cover;background:#000;display:block}
.ad-card div{padding:16px 18px 18px}.ad-card h3{font-size:1.1rem}.ad-card p{font-size:.88rem;color:var(--mut)}
.empty{grid-column:1/-1;text-align:center;background:#fff;border:1.5px dashed var(--line);border-radius:26px;padding:44px 20px;color:var(--mut)}
.empty h3{margin-bottom:6px}
.skel{height:340px;border-radius:26px;background:linear-gradient(100deg,#e7f0f7 30%,#f6fafd 50%,#e7f0f7 70%);background-size:200% 100%;animation:sk 1.3s linear infinite}
@keyframes sk{to{background-position:-200% 0}}

/* ============ STEPS / PRICING / FAQ ============ */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;counter-reset:s;position:relative}
.steps::before{content:"";position:absolute;top:30px;left:8%;right:8%;border-top:2px dashed #b9d4e8}
.step{position:relative;text-align:center;padding:0 8px}
.step::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:60px;height:60px;margin:0 auto 20px;border-radius:50%;background:var(--grad);color:#fff;font-family:var(--head);font-weight:800;font-size:1.4rem;box-shadow:0 0 0 8px var(--cream),0 12px 24px rgba(15,139,208,.35);position:relative;z-index:1}
.section.white .step::before{box-shadow:0 0 0 8px #fff,0 12px 24px rgba(15,139,208,.35)}
.step h4{font-size:1.2rem;margin-bottom:6px}.step p{font-size:.93rem;color:var(--mut)}
.price-wrap{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,4vw,56px);align-items:center;background:var(--navy);color:#cfd9ea;border-radius:36px;padding:clamp(28px,5vw,56px);position:relative;overflow:hidden;isolation:isolate}
.price-wrap::before{content:"";position:absolute;width:420px;height:420px;right:-120px;top:-180px;border-radius:50%;background:radial-gradient(circle,rgba(24,193,232,.35),transparent 70%);z-index:-1}
.price-wrap h2{color:#fff;font-size:clamp(1.9rem,4vw,2.8rem);margin:10px 0 14px}.price-wrap .kicker{color:var(--sky)}
.price-big{font-family:var(--head);font-weight:800;font-size:clamp(3.4rem,8vw,5rem);color:#fff;line-height:1;margin-top:18px}.price-big small{font-size:1.1rem;color:var(--sky);font-weight:600}
.calc{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:28px;padding:26px}
.calc label{display:flex;justify-content:space-between;font-size:.9rem;color:#cfd9ea;margin-bottom:12px}.calc label b{color:#fff}
.calc input[type=range]{width:100%;accent-color:#18C1E8;height:28px}
.calc .tot{display:flex;justify-content:space-between;align-items:flex-end;margin:18px 0 20px;padding-top:16px;border-top:1px solid rgba(255,255,255,.2)}
.calc .tot span{font-size:.85rem}.calc .tot b{font-family:var(--head);font-size:2.2rem;color:#fff;line-height:1}
.faq details{background:#fff;border:1px solid var(--line);border-radius:20px;margin-bottom:12px;transition:.25s;overflow:hidden}
.faq details[open]{border-color:var(--blue);box-shadow:0 14px 30px rgba(15,139,208,.12)}
.faq summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 22px;min-height:60px;font-family:var(--head);font-weight:700;font-size:1.05rem;color:var(--navy)}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--cream);border:1px solid var(--line);color:var(--blue);font-size:1.3rem;line-height:1;transition:.3s}
.faq details[open] summary::after{content:"–";background:var(--blue);color:#fff;border-color:var(--blue)}
.faq details p{padding:0 22px 20px;color:var(--mut);font-size:.97rem}
.faq-wrap{max-width:780px;margin:auto}
.cta-band{border-radius:36px;padding:clamp(36px,6vw,64px);background:var(--grad);color:#fff;text-align:center;position:relative;overflow:hidden}
.cta-band h2{color:#fff;font-size:clamp(1.8rem,4vw,2.8rem);margin-bottom:10px}.cta-band p{color:#e6f6ff;max-width:520px;margin:0 auto 24px}
.cta-band .btn{background:#fff;color:var(--navy);box-shadow:0 14px 30px rgba(10,37,64,.25)}

/* ============ AD FLOW ============ */
.page{width:min(780px,100% - 32px);margin:clamp(24px,5vw,56px) auto 80px}
.page-head{text-align:center;margin-bottom:24px}.page-head h1{font-size:clamp(1.9rem,4.5vw,2.8rem);margin:8px 0 8px}
.panel{background:#fff;border:1px solid var(--line);border-radius:30px;padding:clamp(22px,4vw,40px);box-shadow:0 26px 60px rgba(10,37,64,.09)}
.stepper{display:flex;align-items:center;margin-bottom:30px}
.sp{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none}
.sp i{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--head);font-weight:800;background:var(--cream);color:var(--mut);border:2px solid var(--line);transition:.3s}
.sp span{font-size:.74rem;font-weight:700;color:var(--mut);letter-spacing:.04em}
.sp.on i{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 8px 18px rgba(15,139,208,.35)}.sp.on span{color:var(--navy)}
.sp.done i{background:var(--okbg);color:var(--ok);border-color:#b7e4c7}
.sl{flex:1;height:2px;background:var(--line);margin:0 8px 22px}.sl.on{background:var(--blue)}
.panel h2{font-size:1.7rem;margin-bottom:4px}.panel .sub{color:var(--mut);margin-bottom:6px}
.field{margin-top:16px}
.field label,.lbl{display:block;font-size:.84rem;font-weight:700;color:var(--navy);margin-bottom:6px}
input,textarea,select{width:100%;min-height:50px;padding:13px 16px;border-radius:16px;border:1.5px solid var(--line);background:#fff;font:inherit;font-size:1rem;color:var(--navy);transition:.2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 4px rgba(15,139,208,.15)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.drop{display:grid;place-items:center;text-align:center;gap:6px;padding:34px 18px;border:2px dashed #b9d4e8;border-radius:24px;background:var(--cream);cursor:pointer;transition:.25s;margin-top:6px}
.drop:hover,.drop.over{border-color:var(--blue);background:#eaf6fd}
.drop input{display:none}.drop b{font-family:var(--head);font-size:1.1rem;color:var(--navy)}.drop span{font-size:.88rem;color:var(--mut)}
.drop .ico{width:56px;height:56px;border-radius:18px}
.preview-box{display:flex;gap:18px;align-items:center;margin-top:18px;padding:14px;border:1px solid var(--line);border-radius:22px;background:var(--cream)}
.preview{width:130px;aspect-ratio:9/14;object-fit:cover;border-radius:16px;background:#000;flex:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:10px 18px;border:1.5px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;font-weight:700;font-size:.9rem;color:var(--navy);transition:.2s;min-height:44px}
.chip:hover{border-color:var(--blue)}.chip.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 8px 18px rgba(15,139,208,.3)}
.summary{background:var(--cream);border:1px solid var(--line);border-radius:22px;padding:16px 20px;margin-top:22px}
.summary div{display:flex;justify-content:space-between;gap:14px;padding:7px 0;font-size:.95rem}.summary div span:first-child{color:var(--mut)}
.summary .total{border-top:1px dashed #b9d4e8;margin-top:6px;padding-top:14px;font-family:var(--head);font-size:1.4rem;font-weight:800;color:var(--navy)}.summary .total span:first-child{color:var(--navy)}
.error{color:var(--bad);background:var(--badbg);border:1px solid #f5c2c7;border-radius:14px;padding:11px 14px;font-size:.9rem;margin-top:16px}
.error:empty{display:none}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.row .btn{flex:1 1 150px}
.secure{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:16px;font-size:.82rem;color:var(--mut)}
.done{text-align:center}
.tick{width:84px;height:84px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;background:var(--okbg);color:var(--ok);animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.tick svg{width:42px;height:42px;stroke-width:3}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.badge{display:inline-block;padding:5px 12px;border-radius:999px;font-size:.72rem;font-weight:800;letter-spacing:.06em;background:var(--okbg);color:var(--ok)}

/* ============ ADMIN ============ */
.login-card{width:min(440px,100% - 32px);margin:clamp(28px,6vw,70px) auto}
.admin{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - var(--nav-h))}
.side{background:#fff;border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:var(--nav-h);align-self:start;height:calc(100vh - var(--nav-h))}
.side h4{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);padding:0 12px;margin-bottom:12px}
.side button{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border:0;background:none;color:var(--ink);border-radius:14px;margin-bottom:4px;cursor:pointer;font-weight:500;font-size:.95rem;text-align:left;transition:.2s}
.side button:hover{background:var(--cream)}.side button.on{background:var(--grad);color:#fff;font-weight:700;box-shadow:0 8px 18px rgba(15,139,208,.3)}
.side .cnt{margin-left:auto;font-size:.72rem;font-weight:800;background:var(--warnbg);color:var(--warn);padding:2px 8px;border-radius:999px}
.main{padding:clamp(18px,3vw,36px);min-width:0}
.main h2{font-size:clamp(1.6rem,3vw,2.2rem)}.main .sub{color:var(--mut);margin:4px 0 22px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:26px}
.stat{background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px}
.stat small{display:block;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.stat b{display:block;font-family:var(--head);font-size:2rem;color:var(--navy);margin-top:4px;line-height:1.1}
.card{background:#fff;border:1px solid var(--line);border-radius:26px;padding:clamp(18px,3vw,28px);margin-bottom:24px}
.card h3{font-size:1.25rem;margin-bottom:4px}.card .sub{margin-bottom:8px}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th{text-align:left;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding:10px 10px;border-bottom:1px solid var(--line);font-weight:700}
.tbl td{padding:14px 10px;border-bottom:1px solid #edf3f8;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-block;padding:4px 11px;border-radius:999px;font-size:.7rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;background:#eaf0f6;color:var(--mut)}
.tag.active{background:var(--okbg);color:var(--ok)}.tag.pending{background:var(--warnbg);color:var(--warn)}.tag.rejected{background:var(--badbg);color:var(--bad)}.tag.paused{background:#e4eefc;color:#2f6fd6}
.modal{position:fixed;inset:0;background:rgba(10,37,64,.6);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:900;padding:20px}
.modal-box{width:100%;max-width:420px;max-height:92vh;overflow:auto;background:#fff;border-radius:28px;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.modal-box video{width:100%;max-height:50vh;margin-top:14px;border-radius:18px;background:#000}

/* ============ FOOTER / TOAST ============ */

function toTop(){window.scrollTo({top:0,behavior:"smooth"})}
function selectVideo(f){
 A.error="";if(!f)return;
 if(!/^video\//.test(f.type)){A.error="Please choose a video file.";A.file=null;A.url="";render();return}
 if(f.size>MAX_VIDEO_MB*1024*1024){A.error=`Video must be smaller than ${MAX_VIDEO_MB} MB.`;A.file=null;A.url="";render();return}
 const u=URL.createObjectURL(f),v=document.createElement("video");v.preload="metadata";v.src=u;
 v.onloadedmetadata=()=>{if(v.duration>MAX_VIDEO_SECONDS+.2){A.error=`Video must be ${MAX_VIDEO_SECONDS} seconds or shorter.`;A.file=null;A.url=""}else{A.file=f;A.url=u;A.duration=v.duration}render()};
 v.onerror=()=>{A.error="Unable to read this video.";render()};
}
function nextStep(){
 A.error="";
 if(A.step===1){if(A.business.trim().length<2)A.error="Enter your business name.";else if(!/^\d{10}$/.test(A.phone.trim()))A.error="Enter a valid 10-digit phone number.";else if(!/^\S+@\S+\.\S+$/.test(A.email.trim()))A.error="Enter a valid email address."}
 if(A.step===2&&!A.file)A.error="Please upload a video.";
 if(A.step===3&&A.start<today())A.error="Start date cannot be in the past.";
 if(A.error){render();return}A.step++;render();toTop();
}

/* ================= RAZORPAY + FIREBASE =================
   Payment is taken first. If saving to Firebase fails afterwards, the
   button becomes "Retry saving" and re-uses the SAME payment (no second charge).
   For secure production verification, add Razorpay webhooks/server checks. */
async function pay(){
 if(A.busy)return;
 if(A.paid){return savePaidAd()}
 const amount=A.days*PRICE_PER_DAY;
 if(!RAZORPAY_KEY_ID||RAZORPAY_KEY_ID==="YOUR_RAZORPAY_KEY_ID"){A.error="Razorpay Key ID is missing.";render();return}
 if(!window.Razorpay){A.error="Razorpay Checkout failed to load. Check your internet connection and open this page over HTTPS.";render();return}
 A.error="";A.busy=true;A.busyText="Preparing payment…";render();
 try{
  await firebaseAuthReady;
  if(!anonymousUser){const r=await auth.signInAnonymously();anonymousUser=r.user}
  const adId=db.ref("ads").push().key;
  const rzp=new Razorpay({
   key:RAZORPAY_KEY_ID,
   amount:Math.round(amount*100),
   currency:"INR",
   name:"TRIPRIDE ADS",
   description:`${A.days} day advertisement`,
   prefill:{name:A.contact.trim(),email:A.email.trim(),contact:A.phone.trim()},
   notes:{businessName:A.business.trim(),advertisementTitle:A.title.trim(),campaignDays:String(A.days)},
   theme:{color:"#0F8BD0"},
   handler:function(response){
    A.paid={paymentId:response.razorpay_payment_id,adId,amount};
    A.busy=false;
    savePaidAd();
   },
   modal:{ondismiss:function(){
    if(A.paid)return;
    A.busy=false;A.error="Payment window was closed. No payment was completed.";render();
   }}
  });
  rzp.on("payment.failed",function(response){
   const err=response.error||{};
   A.busy=false;A.error="Razorpay payment failed: "+(err.description||err.reason||err.code||"Unknown Razorpay error");
   render();console.error("Razorpay payment.failed:",response);
  });
  A.busyText="Opening Razorpay…";render();
  rzp.open();
 }catch(e){
  console.error("Payment initialization error:",e);
  A.busy=false;A.error="Unable to start Razorpay: "+(e.message||e);render();
 }
}
async function savePaidAd(){
 if(A.busy||!A.paid)return;
 const {paymentId,adId,amount}=A.paid,storagePath=`advertisements/${adId}/video.mp4`;
 A.busy=true;A.busyText="Uploading advertisement…";A.error="";render();
 try{
  if(!A.file)throw new Error("The video file is no longer available in this browser. Please contact support with payment ID "+paymentId+".");
  await firebaseAuthReady;
  const fileRef=storage.ref(storagePath);
  try{await fileRef.put(A.file,{contentType:A.file.type||"video/mp4",customMetadata:{adId:String(adId),businessName:A.business.trim()}})}
  catch(se){throw new Error("Firebase Storage upload failed: "+se.message)}
  A.busyText="Saving advertisement…";render();
  let videoUrl;
  try{videoUrl=await fileRef.getDownloadURL()}catch(ue){throw new Error("Firebase Storage URL failed: "+ue.message)}
  const ad={
   adId,businessName:A.business.trim(),title:A.title.trim(),contactName:A.contact.trim(),phone:A.phone.trim(),email:A.email.trim(),
   videoUrl,videoPath:storagePath,durationSec:Number(A.duration.toFixed(2)),
   startDate:A.start,endDate:addDays(A.start,A.days-1),totalDays:A.days,pricePerDay:PRICE_PER_DAY,amount,
   paymentId,paymentStatus:"PAID",status:"PENDING_APPROVAL",createdAt:firebase.database.ServerValue.TIMESTAMP
  };
  try{await db.ref("ads/"+adId).set(ad)}catch(de){throw new Error("Firebase Realtime Database save failed: "+de.message)}
  A.done=ad;
  try{
   await db.ref("payments/"+paymentId).set({paymentId,adId,businessName:A.business.trim(),amount,totalDays:A.days,status:"PAID",createdAt:firebase.database.ServerValue.TIMESTAMP});
  }catch(pe){A.error="Advertisement saved, but the payment record could not be saved: "+pe.message}
 }catch(e){
  console.error(e);
  A.error=`Your payment (ID ${paymentId}) was received, but saving the advertisement failed: ${e.message}. Tap "Retry saving advertisement". You will not be charged again. Please keep this tab open.`;
 }finally{
  A.busy=false;render();
 }
}
function resetAd(){A=newAd()}
window.addEventListener("beforeunload",e=>{if(A.paid&&!A.done){e.preventDefault();e.returnValue=""}});

/* ================= ADMIN ================= */
function adminLogin(){
 return `<main><div class="login-card"><div class="panel"><span class="badge" style="background:#e4f2fb;color:var(--blue)">ADMIN ACCESS</span><h2 style="margin-top:12px">Admin login</h2><p class="sub">Authorized administrators only.</p>
 <div class="field"><label>Admin ID</label><input id="aid" autocomplete="username"></div>
 <div class="field"><label>Password</label><input id="apass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doAdminLogin()"></div>
 <div id="loginErr" class="error"></div>
 <div class="row"><button class="btn" onclick="doAdminLogin()">Login</button><a href="#home" class="btn out">Cancel</a></div></div></div></main>`;
}
function doAdminLogin(){
 if($("#aid").value===ADMIN_ID&&$("#apass").value===ADMIN_PASSWORD){admin=true;ADMIN_CACHE=null;location.hash="admin";render()}
 else{const e=$("#loginErr");e.textContent="Invalid admin ID or password."}
}
function logout(){admin=false;ADMIN_CACHE=null;location.hash="home";render()}
async function getAllAds(){const s=await db.ref("ads").once("value");return Object.values(s.val()||{}).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))}
async function getPayments(){const s=await db.ref("payments").once("value");return Object.values(s.val()||{}).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))}

 <div class="two"><div class="field"><label>Business / brand name *</label><input value="${esc(AF.business)}" oninput="AF.business=this.value" placeholder="TRIPRIDE"></div>
 <div class="field"><label>Advertisement title</label><input value="${esc(AF.title)}" oninput="AF.title=this.value" placeholder="Admin Promotion"></div></div>
 <div class="field"><span class="lbl">Advertisement video *</span>
 <label class="drop" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="event.preventDefault();this.classList.remove('over');selectAdminFreeVideo(event.dataTransfer.files[0])"><input type="file" accept="video/*" onchange="selectAdminFreeVideo(this.files[0])"><span class="ico">${I.upload}</span><b>${AF.url?"Replace video":"Choose a video"}</b><span>Up to ${MAX_VIDEO_SECONDS} sec / ${MAX_VIDEO_MB} MB</span></label></div>
 ${AF.url?`<div class="preview-box"><video class="preview" src="${esc(AF.url)}" controls muted playsinline></video><div><p class="muted" style="font-size:.9rem">Duration: ${AF.duration.toFixed(1)} seconds</p><span class="badge">READY</span></div></div>`:""}
 <div class="two"><div class="field"><label>Start date *</label><input type="date" min="${today()}" value="${AF.start}" onchange="AF.start=this.value||today();render()"></div>
 <div class="field"><label>Days (1-90) *</label><input type="number" min="1" max="90" value="${AF.days}" onchange="AF.days=Math.max(1,Math.min(90,+this.value||1));render()"></div></div>

 <div class="summary"><div><span>Price</span><b class="ok-t">FREE</b></div><div><span>Campaign</span><span>${fmt(AF.start)} - ${fmt(addDays(AF.start,AF.days-1))}</span></div><div><span>Status after upload</span><b class="ok-t">ACTIVE</b></div></div>
 ${AF.error?`<div class="error">${esc(AF.error)}</div>`:""}
 <div class="row"><button class="btn ok" ${AF.saving?"disabled":""} onclick="saveAdminFreeAd()">${AF.saving?"Uploading…":"Upload free advertisement"}</button></div></div>`;

function selectAdminFreeVideo(f){
 AF.error="";if(!f)return;
 if(!/^video\//.test(f.type)){AF.error="Please choose a video file.";AF.file=null;AF.url="";render();return}
 if(f.size>MAX_VIDEO_MB*1024*1024){AF.error=`Video must be smaller than ${MAX_VIDEO_MB} MB.`;AF.file=null;AF.url="";render();return}
 const u=URL.createObjectURL(f),v=document.createElement("video");v.preload="metadata";v.src=u;
 v.onloadedmetadata=()=>{if(v.duration>MAX_VIDEO_SECONDS+.2){AF.error=`Video must be ${MAX_VIDEO_SECONDS} seconds or shorter.`;AF.file=null;AF.url=""}else{AF.file=f;AF.url=u;AF.duration=v.duration}render()};

async function saveAdminFreeAd(){
 AF.error="";AF.business=(AF.business||"").trim();AF.title=(AF.title||"").trim();
 if(AF.business.length<2){AF.error="Enter a business/brand name.";render();return}
 if(!AF.file){AF.error="Please upload a video.";render();return}
 if(AF.saving)return;
 AF.saving=true;render();
 try{
  await firebaseAuthReady;
  if(!anonymousUser){const r=await auth.signInAnonymously();anonymousUser=r.user}
  const adId=db.ref("ads").push().key,storagePath=`advertisements/admin-free/${adId}/video.mp4`,fileRef=storage.ref(storagePath);
  await fileRef.put(AF.file,{contentType:AF.file.type||"video/mp4",customMetadata:{adId:String(adId),businessName:AF.business,adminFreeAd:"true"}});
  const videoUrl=await fileRef.getDownloadURL();
  await db.ref("ads/"+adId).set({
   adId,businessName:AF.business,title:AF.title||"Admin Advertisement",contactName:"TRIPRIDE ADMIN",phone:"",email:"",
   videoUrl,videoPath:storagePath,durationSec:Number(AF.duration.toFixed(2)),
   startDate:AF.start,endDate:addDays(AF.start,AF.days-1),totalDays:AF.days,pricePerDay:0,amount:0,
   paymentId:"ADMIN_FREE",paymentStatus:"PAID",status:"ACTIVE",adminCreated:true,freeAdminAd:true,createdAt:firebase.database.ServerValue.TIMESTAMP
  });
  toast("Free admin advertisement uploaded and activated.");
  AF=newAF();adminTab="all";ADMIN_CACHE=null;render();
 }catch(e){
  console.error("Admin free advertisement upload failed:",e);
  AF.saving=false;AF.error="Upload failed: "+(e.message||e);render();
 }
}
const tagCls=s=>{s=String(s).toLowerCase();return s.includes("pending")?"pending":s}
async function adminPage(){
 if(!admin)return adminLogin();
 if(!ADMIN_CACHE){
  try{const [ads,pays]=await Promise.all([getAllAds(),getPayments()]);ADMIN_CACHE={ads,pays}}
  catch(e){return `<main><div class="page"><div class="panel"><h2>Firebase error</h2><div class="error">${esc(e.message)}</div></div></div></main>`}
 }
 const {ads,pays}=ADMIN_CACHE;
 const pending=ads.filter(a=>a.status==="PENDING_APPROVAL"),active=ads.filter(a=>a.status==="ACTIVE"&&a.endDate>=today()),revenue=pays.reduce((s,p)=>s+Number(p.amount||0),0);
 let content="";
 if(adminTab==="dashboard")content=`<h2>Dashboard</h2><p class="sub">Advertisement overview.</p>
  <div class="stats"><div class="stat"><small>Total ads</small><b>${ads.length}</b></div><div class="stat"><small>Pending</small><b>${pending.length}</b></div><div class="stat"><small>Active</small><b>${active.length}</b></div><div class="stat"><small>Revenue</small><b>${money(revenue)}</b></div></div>
  <div class="card"><h3>Pending approval</h3><p class="sub">Review and approve new advertisements.</p>${adTable(pending)}</div>${adminFreeUploadCard()}`;
 else if(adminTab==="free")content=`<h2>Free upload</h2><p class="sub">Add an admin advertisement.</p>${adminFreeUploadCard()}`;
 else if(adminTab==="payments")content=`<h2>Payments</h2><p class="sub">Payments stored in Firebase Realtime Database.</p><div class="card">${payTable(pays)}</div>`;
 else{const list=adminTab==="pending"?pending:adminTab==="active"?active:ads,title=adminTab==="pending"?"Pending advertisements":adminTab==="active"?"Active advertisements":"All advertisements";
  content=`<h2>${title}</h2><p class="sub">Manage advertisements.</p><div class="card">${adTable(list)}</div>`}
 const tabs=[["dashboard","Dashboard"],["pending","Pending Ads"],["active","Active Ads"],["all","All Ads"],["free","Free Upload"],["payments","Payments"]];
 return `<div class="admin"><aside class="side"><h4>Admin</h4>
 ${tabs.map(([k,l])=>`<button class="${adminTab===k?"on":""}" onclick="adminTab='${k}';render()">${l}${k==="pending"&&pending.length?`<span class="cnt">${pending.length}</span>`:""}</button>`).join("")}
 <button onclick="ADMIN_CACHE=null;render();toast('Refreshing…')">Refresh</button><button onclick="logout()">Logout</button></aside>
 <main class="main">${content}</main></div>`;
}
function adTable(list){
 if(!list.length)return `<p class="muted">No advertisements found.</p>`;
 return `<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Business</th><th>Campaign</th><th>Amount</th><th>Status</th><th>Actions</th></tr></thead><tbody>${list.map(a=>`<tr>
 <td data-l="Business"><span><b style="color:var(--navy)">${esc(a.businessName)}</b><br><small class="muted">${esc(a.phone||"")}</small></span></td>
 <td data-l="Campaign"><span>${fmt(a.startDate)} - ${fmt(a.endDate)}<br><small class="muted">${a.totalDays} day(s)</small></span></td>
 <td data-l="Amount">${money(a.amount)}</td>
 <td data-l="Status"><span class="tag ${tagCls(a.status)}">${esc(String(a.status).replaceAll("_"," "))}</span></td>
 <td class="acts-td" data-l="Actions"><div class="acts"><button class="btn out sm" onclick="viewAd('${esc(a.adId)}')">View</button>
 ${a.status==="PENDING_APPROVAL"?`<button class="btn ok sm" onclick="changeStatus('${esc(a.adId)}','ACTIVE')">Approve</button><button class="btn bad sm" onclick="changeStatus('${esc(a.adId)}','REJECTED')">Reject</button>`:""}
 ${a.status==="ACTIVE"?`<button class="btn out sm" onclick="changeStatus('${esc(a.adId)}','PAUSED')">Pause</button>`:""}
 ${a.status==="PAUSED"?`<button class="btn ok sm" onclick="changeStatus('${esc(a.adId)}','ACTIVE')">Resume</button>`:""}
 </div></td></tr>`).join("")}</tbody></table></div>`;
}
function payTable(list){
 if(!list.length)return `<p class="muted">No payments found.</p>`;
 return `<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Payment ID</th><th>Business</th><th>Amount</th><th>Days</th><th>Status</th></tr></thead><tbody>${list.map(p=>`<tr><td data-l="Payment ID">${esc(p.paymentId)}</td><td data-l="Business">${esc(p.businessName)}</td><td data-l="Amount">${money(p.amount)}</td><td data-l="Days">${esc(p.totalDays)}</td><td data-l="Status"><span class="tag active">${esc(p.status)}</span></td></tr>`).join("")}</tbody></table></div>`;
}
async function changeStatus(id,status){
 try{await db.ref("ads/"+id).update({status,updatedAt:firebase.database.ServerValue.TIMESTAMP});toast("Advertisement updated.");ADMIN_CACHE=null;render()}
 catch(e){toast("Update failed: "+e.message)}
}
async function viewAd(id){
 const s=await db.ref("ads/"+id).once("value"),a=s.val();if(!a)return;
 const m=document.createElement("div");m.className="modal";m.onclick=e=>{if(e.target===m)m.remove()};
 m.innerHTML=`<div class="modal-box"><h2 style="font-size:1.5rem">${esc(a.businessName)}</h2><p class="muted">${esc(a.title||"Advertisement")}</p><video src="${esc(a.videoUrl)}" controls autoplay playsinline></video>
 <div class="summary"><div><span>Campaign</span><span>${fmt(a.startDate)} - ${fmt(a.endDate)}</span></div><div><span>Duration</span><span>${esc(a.totalDays)} days</span></div><div><span>Amount</span><b>${money(a.amount)}</b></div>${a.phone?`<div><span>Phone</span><span>${esc(a.phone)}</span></div>`:""}${a.email?`<div><span>Email</span><span style="word-break:break-all">${esc(a.email)}</span></div>`:""}</div>
 <div class="row"><button class="btn out" onclick="this.closest('.modal').remove()">Close</button></div></div>`;
 document.body.appendChild(m);
}

/* ================= ROUTER ================= */
const HOME_SECTIONS=["home","live","how","pricing","faq"];
let view="",routeToken=0;
async function render(force=true){
 const h=location.hash.slice(1)||"home",my=++routeToken,app=$("#app");
 if(HOME_SECTIONS.includes(h)){
  if(view!=="home"||force){
   app.innerHTML=homeHTML();view="home";loadLiveAds();
   if(h==="home")window.scrollTo(0,0);
  }
  if(h!=="home"){requestAnimationFrame(()=>{const el=document.getElementById(h);if(el)el.scrollIntoView({behavior:"smooth"})})}
  return;
 }
 if(h==="advertise"){
  const y=scrollY;app.innerHTML=advertise();
  if(view!=="advertise"){window.scrollTo(0,0)}else{window.scrollTo(0,y)}
  view="advertise";return;
 }
 if(h==="admin"){
  const html=admin?await adminPage():adminLogin();
  if(my!==routeToken)return;
  const y=view==="admin"?scrollY:0;
  app.innerHTML=html;view="admin";window.scrollTo(0,y);return;
 }
 location.hash="home";
}
window.addEventListener("hashchange",()=>{
 const h=location.hash.slice(1)||"home";
 if(h==="admin"&&view!=="admin")ADMIN_CACHE=null;
 render(!(HOME_SECTIONS.includes(h)&&view==="home"));
});
window.addEventListener("error",e=>console.error("TRIPRIDE ADS error:",e.error||e.message));
render();
</script>
