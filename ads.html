function advertise(){

 <div class="summary"><div><span>Advertisement ID</span><b>${esc(A.done.adId)}</b></div><div><span>Amount</span><b>${money(A.done.amount)}</b></div><div><span>Status</span><b class="success">PENDING APPROVAL</b></div></div>
 <div class="row"><button class="btn" onclick="resetAd();location.hash='home'">Back to Home</button></div></div></div>`;
 const end=addDays(A.start,A.days-1),amount=A.days*PRICE_PER_DAY;
 let c="";
 if(A.step===1)c=`<h2>Business Details</h2><p class="sub">Enter your advertisement information.</p>
 <label>Business Name *</label><input value="${esc(A.business)}" oninput="A.business=this.value" placeholder="ABC Restaurant">
 <label>Advertisement Title</label><input value="${esc(A.title)}" oninput="A.title=this.value" placeholder="Special Offer">

 <label>Email *</label><input type="email" value="${esc(A.email)}" oninput="A.email=this.value">`;
 if(A.step===2)c=`<h2>Upload Video</h2><p class="sub">Maximum ${MAX_VIDEO_SECONDS} seconds and ${MAX_VIDEO_MB} MB.</p>
 <label>Advertisement Video *</label><input type="file" accept="video/*" onchange="selectVideo(this.files[0])">
 ${A.url?`<video class="preview" src="${A.url}" controls muted playsinline></video><p class="muted">Duration: ${A.duration.toFixed(1)} seconds</p>`:""}`;
 if(A.step===3)c=`<h2>Campaign Duration</h2><label>Start Date *</label><input type="date" min="${today()}" value="${A.start}" onchange="A.start=this.value;render()">
 <label>Number of Days *</label><div class="chips">${[1,3,7,15,30].map(d=>`<span class="chip ${A.days===d?"on":""}" onclick="A.days=${d};render()">${d} Day${d>1?"s":""}</span>`).join("")}</div>
 <input type="number" min="1" max="90" value="${A.days}" style="margin-top:10px" onchange="A.days=Math.max(1,Math.min(90,+this.value||1));render()">
 <div class="summary"><div><span>Price per day</span><b>${money(PRICE_PER_DAY)}</b></div><div><span>Duration</span><b>${A.days} day(s)</b></div><div><span>Campaign</span><span>${fmt(A.start)} - ${fmt(end)}</span></div><div class="total"><span>Total</span><span>${money(amount)}</span></div></div>`;
 if(A.step===4)c=`<h2>Review & Payment</h2><p class="sub">Check the details before continuing to Razorpay.</p>
 <div class="summary"><div><span>Business</span><b>${esc(A.business)}</b></div><div><span>Video</span><span>${A.duration.toFixed(1)} sec</span></div><div><span>Campaign</span><span>${fmt(A.start)} - ${fmt(end)}</span></div><div class="total"><span>Total</span><span>${money(amount)}</span></div></div>
 <p class="muted" style="margin-top:14px">After payment, your advertisement will be submitted for admin approval.</p>`;
 return nav()+`<div class="page"><div class="panel"><div class="progress">${[1,2,3,4].map(i=>`<i class="${i<=A.step?"on":""}"></i>`).join("")}</div>${c}<div class="error">${esc(A.error)}</div><div class="row">
 ${A.step>1?`<button class="btn dark" onclick="A.step--;render()">Back</button>`:""}${A.step<4?`<button class="btn" onclick="nextStep()">Continue</button>`:`<button class="btn" id="payBtn" onclick="pay()">Pay ${money(amount)}</button>`}</div></div></div>`;

function selectVideo(f){
 A.error="";if(!f)return;
 if(f.size>MAX_VIDEO_MB*1024*1024){A.error=`Video must be smaller than ${MAX_VIDEO_MB} MB.`;A.file=null;A.url="";render();return}
 const u=URL.createObjectURL(f),v=document.createElement("video");v.preload="metadata";v.src=u;
 v.onloadedmetadata=()=>{if(v.duration>MAX_VIDEO_SECONDS+.2){A.error=`Video must be ${MAX_VIDEO_SECONDS} seconds or shorter.`;A.file=null;A.url="";}else{A.file=f;A.url=u;A.duration=v.duration}render()};
 v.onerror=()=>{A.error="Unable to read this video.";render()};
}
function nextStep(){
 A.error="";
 if(A.step===1){if(A.business.trim().length<2)A.error="Enter your business name.";else if(!/^\d{10}$/.test(A.phone.trim()))A.error="Enter a valid 10-digit phone number.";else if(!/^\S+@\S+\.\S+$/.test(A.email.trim()))A.error="Enter a valid email address."}
 if(A.step===2&&!A.file)A.error="Please upload a video.";
 if(A.error){render();return}A.step++;render();
}

/* ================= RAZORPAY + FIREBASE =================
   Successful checkout stores the ad in Firebase.
   For secure production verification, use Razorpay webhooks/server.
*/
async function pay(){
  const btn=$("#payBtn"), amount=A.days*PRICE_PER_DAY;

  if(!RAZORPAY_KEY_ID || RAZORPAY_KEY_ID==="YOUR_RAZORPAY_KEY_ID"){
    A.error="Razorpay Key ID is missing.";
    render();
    return;
  }

  if(!window.Razorpay){
    A.error="Razorpay Checkout failed to load. Check your internet connection and open this website through HTTPS/localhost.";
    render();
    return;
  }

  try{
    btn.disabled=true;
    btn.textContent="Preparing payment...";

    // Make sure Firebase anonymous authentication is ready before the payment flow.
    await firebaseAuthReady;

    if(!anonymousUser){
      const r=await auth.signInAnonymously();
      anonymousUser=r.user;
    }

    const adId=db.ref("ads").push().key;
    const storagePath=`advertisements/${adId}/video.mp4`;

    const options={
      key:RAZORPAY_KEY_ID,
      amount:Math.round(amount*100),
      currency:"INR",
      name:"TRIPRIDE ADS",
      description:`${A.days} day advertisement`,
      image:"",
      prefill:{
        name:A.contact.trim(),
        email:A.email.trim(),
        contact:A.phone.trim()
      },
      notes:{
        businessName:A.business.trim(),
        advertisementTitle:A.title.trim(),
        campaignDays:String(A.days)
      },
      theme:{color:"#ff6b35"},

      handler:async function(response){
        try{
          btn.disabled=true;
          btn.textContent="Uploading advertisement...";

          if(!A.file){
            throw new Error("Advertisement video is missing. Payment was successful, but the video file is not available in this browser.");
          }

          const fileRef=storage.ref(storagePath);

          try{
            await fileRef.put(A.file,{
              contentType:A.file.type || "video/mp4",
              customMetadata:{
                adId:String(adId),
                businessName:A.business.trim()
              }
            });
          }catch(storageError){
            throw new Error("Firebase Storage upload failed: "+storageError.message);
          }

          btn.textContent="Saving advertisement...";

          let videoUrl;
          try{
            videoUrl=await fileRef.getDownloadURL();
          }catch(urlError){
            throw new Error("Firebase Storage URL failed: "+urlError.message);
          }

          const ad={
            adId,
            businessName:A.business.trim(),
            title:A.title.trim(),
            contactName:A.contact.trim(),
            phone:A.phone.trim(),
            email:A.email.trim(),
            videoUrl,
            videoPath:storagePath,
            durationSec:Number(A.duration.toFixed(2)),
            startDate:A.start,
            endDate:addDays(A.start,A.days-1),
            totalDays:A.days,
            pricePerDay:PRICE_PER_DAY,
            amount,
            paymentId:response.razorpay_payment_id,
            paymentStatus:"PAID",
            status:"PENDING_APPROVAL",
            createdAt:firebase.database.ServerValue.TIMESTAMP
          };

          try{
            await db.ref("ads/"+adId).set(ad);
          }catch(dbError){
            throw new Error("Firebase Realtime Database save failed: "+dbError.message);
          }

          try{
            await db.ref("payments/"+response.razorpay_payment_id).set({
              paymentId:response.razorpay_payment_id,
              adId,
              businessName:A.business.trim(),
              amount,
              totalDays:A.days,
              status:"PAID",
              createdAt:firebase.database.ServerValue.TIMESTAMP
            });
          }catch(paymentDbError){
            // The main ad was already saved. Show a specific warning instead of pretending the whole payment failed.
            A.done=ad;
            A.error="Advertisement saved, but payment record could not be saved: "+paymentDbError.message;
            btn.disabled=false;
            btn.textContent="Payment completed";
            render();
            return;
          }

          A.done=ad;
          A.error="";
          render();

        }catch(e){
          A.error=`Payment was successful, but advertisement saving failed. ${e.message}`;
          btn.disabled=false;
          btn.textContent="Retry Save";
          render();
        }
      },

      modal:{
        ondismiss:function(){
          btn.disabled=false;
          btn.textContent="Pay "+money(amount);
          A.error="Payment window was closed. No payment was completed.";
          render();
        }
      }
    };

    const rzp=new Razorpay(options);

    rzp.on("payment.failed",function(response){
      const err=response.error||{};
      const reason=err.description || err.reason || err.code || "Unknown Razorpay error";
      A.error="Razorpay payment failed: "+reason;
      btn.disabled=false;
      btn.textContent="Pay "+money(amount);
      render();
      console.error("Razorpay payment.failed:",response);
    });

    btn.textContent="Opening Razorpay...";
    rzp.open();

  }catch(e){
    console.error("Payment initialization error:",e);
    A.error="Unable to start Razorpay: "+(e.message||e);
    btn.disabled=false;
    btn.textContent="Pay "+money(amount);
    render();
  }
}

    <input id="afBusiness" value="${esc(AF.business)}" placeholder="TRIPRIDE">
    <label>Advertisement Title</label>
    <input id="afTitle" value="${esc(AF.title)}" placeholder="Admin Promotion">
    <label>Advertisement Video *</label>
    <input type="file" accept="video/*" onchange="selectAdminFreeVideo(this.files[0])">
    ${AF.url?`<video class="preview" src="${esc(AF.url)}" controls muted playsinline></video><p class="muted">Duration: ${AF.duration.toFixed(1)} seconds</p>`:""}
    <label>Start Date *</label>
    <input type="date" min="${today()}" value="${AF.start}" onchange="AF.start=this.value">
    <label>Number of Days *</label>
    <div class="chips">${[1,3,7,15,30].map(d=>`<span class="chip ${AF.days===d?"on":""}" onclick="AF.days=${d};render()">${d} Day${d>1?"s":""}</span>`).join("")}</div>
    <input type="number" min="1" max="90" value="${AF.days}" style="margin-top:10px" onchange="AF.days=Math.max(1,Math.min(90,+this.value||1));render()">
    <div class="summary">
      <div><span>Price</span><b class="success">FREE</b></div>
      <div><span>Campaign</span><span>${fmt(AF.start)} - ${fmt(addDays(AF.start,AF.days-1))}</span></div>
      <div><span>Status after upload</span><b class="success">ACTIVE</b></div>
    </div>
    ${AF.error?`<p class="error">${esc(AF.error)}</p>`:""}
    <div class="row"><button class="btn green" ${AF.saving?"disabled":""} onclick="saveAdminFreeAd()">${AF.saving?"Uploading...":"Upload Free Advertisement"}</button></div>
  </div>`;
}

function selectAdminFreeVideo(f){
  AF.error="";
  if(!f)return;
  if(f.size>MAX_VIDEO_MB*1024*1024){
    AF.error=`Video must be smaller than ${MAX_VIDEO_MB} MB.`;
    AF.file=null; AF.url=""; render(); return;
  }
  const u=URL.createObjectURL(f),v=document.createElement("video");
  v.preload="metadata"; v.src=u;
  v.onloadedmetadata=()=>{
    if(v.duration>MAX_VIDEO_SECONDS+.2){
      AF.error=`Video must be ${MAX_VIDEO_SECONDS} seconds or shorter.`;
      AF.file=null; AF.url="";
    }else{
      AF.file=f; AF.url=u; AF.duration=v.duration;
    }
    render();
  };
  v.onerror=()=>{AF.error="Unable to read this video.";render()};
}

async function saveAdminFreeAd(){
  AF.error="";
  AF.business=($("#afBusiness")?.value||AF.business||"").trim();
  AF.title=($("#afTitle")?.value||AF.title||"").trim();

  if(AF.business.length<2){AF.error="Enter a business/brand name.";render();return}
  if(!AF.file){AF.error="Please upload a video.";render();return}
  if(AF.saving)return;

  AF.saving=true; render();

  try{
    await firebaseAuthReady;
    if(!anonymousUser){
      const r=await auth.signInAnonymously();
      anonymousUser=r.user;
    }

    const adId=db.ref("ads").push().key;
    const storagePath=`advertisements/admin-free/${adId}/video.mp4`;
    const fileRef=storage.ref(storagePath);

    await fileRef.put(AF.file,{
      contentType:AF.file.type||"video/mp4",
      customMetadata:{adId:String(adId),businessName:AF.business,adminFreeAd:"true"}
    });

    const videoUrl=await fileRef.getDownloadURL();

    const ad={
      adId,
      businessName:AF.business,
      title:AF.title||"Admin Advertisement",
      contactName:"TRIPRIDE ADMIN",
      phone:"",
      email:"",
      videoUrl,
      videoPath:storagePath,
      durationSec:Number(AF.duration.toFixed(2)),
      startDate:AF.start,
      endDate:addDays(AF.start,AF.days-1),
      totalDays:AF.days,
      pricePerDay:0,
      amount:0,
      paymentId:"ADMIN_FREE",
      paymentStatus:"PAID",
      status:"ACTIVE",
      adminCreated:true,
      freeAdminAd:true,
      createdAt:firebase.database.ServerValue.TIMESTAMP
    };

    await db.ref("ads/"+adId).set(ad);

    toast("Free admin advertisement uploaded and activated.");
    AF={business:"TRIPRIDE",title:"Admin Advertisement",file:null,url:"",duration:0,start:today(),days:1,error:"",saving:false};
    adminTab="all";
    render();
  }catch(e){
    console.error("Admin free advertisement upload failed:",e);
    AF.saving=false;
    AF.error="Upload failed: "+(e.message||e);
    render();
  }
}

async function adminPage(){
 if(!admin)return adminLogin();
 let ads=[],pays=[];try{[ads,pays]=await Promise.all([getAllAds(),getPayments()])}catch(e){return nav()+`<div class="page"><div class="panel"><h2>Firebase Error</h2><p class="error">${esc(e.message)}</p></div></div>`}
 const pending=ads.filter(a=>a.status==="PENDING_APPROVAL"),active=ads.filter(a=>a.status==="ACTIVE"&&a.endDate>=today()),revenue=pays.reduce((s,p)=>s+Number(p.amount||0),0);
 let content="";
 if(adminTab==="dashboard")content=`<h2>Dashboard</h2><p class="sub">Real-time advertisement overview.</p>${adminFreeUploadCard()}<div class="stats">
 <div class="card stat"><b>${ads.length}</b>Total Ads</div><div class="card stat"><b>${pending.length}</b>Pending</div><div class="card stat"><b>${active.length}</b>Active</div><div class="card stat"><b>${money(revenue)}</b>Revenue</div></div>
 <h3>Pending Approval</h3><br>${adTable(pending)}`;
 else if(adminTab==="free")content=adminFreeUploadCard();
  else if(adminTab==="payments")content=`<h2>Payments</h2><p class="sub">Payments stored in Firebase Realtime Database.</p>${payTable(pays)}`;
 else{let list=adminTab==="pending"?pending:adminTab==="active"?active:ads;content=`<h2>${adminTab==="pending"?"Pending Advertisements":adminTab==="active"?"Active Advertisements":"All Advertisements"}</h2><p class="sub">Manage advertisements.</p>${adTable(list)}`}
 return nav()+`<div class="adminLayout"><aside class="sidebar">
 <button class="${adminTab==="dashboard"?"active":""}" onclick="adminTab='dashboard';render()">Dashboard</button>
 <button class="${adminTab==="pending"?"active":""}" onclick="adminTab='pending';render()">Pending Ads</button>
 <button class="${adminTab==="active"?"active":""}" onclick="adminTab='active';render()">Active Ads</button>
 <button class="${adminTab==="all"?"active":""}" onclick="adminTab='all';render()">All Ads</button>
 <button class="${adminTab==="payments"?"active":""}" onclick="adminTab='payments';render()">Payments</button>
 <button onclick="logout()">Logout</button></aside><main class="adminMain">${content}</main></div>`;
}
function adTable(list){
 if(!list.length)return `<div class="card"><p class="muted">No advertisements found.</p></div>`;
 return `<div class="card" style="overflow:auto"><table><tr><th>Business</th><th>Campaign</th><th>Amount</th><th>Status</th><th>Actions</th></tr>${list.map(a=>`<tr>
 <td><b>${esc(a.businessName)}</b><br><small class="muted">${esc(a.phone||"")}</small></td>
 <td>${fmt(a.startDate)} - ${fmt(a.endDate)}<br>${a.totalDays} day(s)</td><td>${money(a.amount)}</td>
 <td><span class="tag ${String(a.status).toLowerCase().includes("pending")?"pending":String(a.status).toLowerCase()}">${String(a.status).replaceAll("_"," ")}</span></td>
 <td><button class="btn dark" onclick="viewAd('${a.adId}')">View</button>
 ${a.status==="PENDING_APPROVAL"?`<button class="btn green" onclick="changeStatus('${a.adId}','ACTIVE')">Approve</button><button class="btn red" onclick="changeStatus('${a.adId}','REJECTED')">Reject</button>`:""}
 ${a.status==="ACTIVE"?`<button class="btn dark" onclick="changeStatus('${a.adId}','PAUSED')">Pause</button>`:""}
 ${a.status==="PAUSED"?`<button class="btn green" onclick="changeStatus('${a.adId}','ACTIVE')">Resume</button>`:""}
 </td></tr>`).join("")}</table></div>`;
}
function payTable(list){return `<div class="card" style="overflow:auto"><table><tr><th>Payment ID</th><th>Business</th><th>Amount</th><th>Days</th><th>Status</th></tr>${list.map(p=>`<tr><td>${esc(p.paymentId)}</td><td>${esc(p.businessName)}</td><td>${money(p.amount)}</td><td>${p.totalDays}</td><td>${esc(p.status)}</td></tr>`).join("")||`<tr><td colspan="5">No payments found.</td></tr>`}</table></div>`}
async function changeStatus(id,status){try{await db.ref("ads/"+id).update({status,updatedAt:firebase.database.ServerValue.TIMESTAMP});toast("Advertisement updated.");render()}catch(e){toast("Update failed: "+e.message)}}
async function viewAd(id){
 const s=await db.ref("ads/"+id).once("value"),a=s.val();if(!a)return;
 const m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="modalBox"><h2>${esc(a.businessName)}</h2><p class="muted">${esc(a.title||"Advertisement")}</p><video src="${esc(a.videoUrl)}" controls autoplay playsinline style="width:100%;margin-top:15px;border-radius:12px;background:#000"></video><div class="summary"><div><span>Duration</span><span>${a.totalDays} days</span></div><div><span>Amount</span><b>${money(a.amount)}</b></div></div><div class="row"><button class="btn dark" onclick="this.closest('.modal').remove()">Close</button></div></div>`;document.body.appendChild(m)
}

/* ================= ROUTER ================= */
async function render(){
 const h=location.hash.slice(1)||"home";
 if(h==="advertise"){$("#app").innerHTML=advertise();return}
 if(h==="admin"){$("#app").innerHTML=admin?await adminPage():adminLogin();return}
 $("#app").innerHTML=await home();
}
window.addEventListener("hashchange",render);

window.addEventListener("error",e=>{
  console.error("TRIPRIDE ADS error:",e.error||e.message);
});

render();
</script>
</body>
